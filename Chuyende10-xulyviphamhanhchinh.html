hông tin bất động sản không đúng sự thật. - Điểm a Khoản 4 Điều 59 Nghị định số 16/2022/NĐ-CP: Quy định hình thức xử phạt bổ sung (Đình chỉ hoạt động sàn). - Điều 57 Luật Kinh doanh bất động sản năm 2023: Quy định về nghĩa vụ của sàn giao dịch là phải kiểm tra hồ sơ, thông tin về bất động sản trước khi đưa vào kinh doanh. Nhiều sàn giao dịch thường bào chữa rằng họ chỉ \"quảng cáo hộ\" chủ đầu tư. Tuy nhiên, theo Luật Kinh doanh bất động sản 2023, sàn giao dịch có nghĩa vụ kiểm soát tính pháp lý và độ chính xác của thông tin trước khi giới thiệu đến khách hàng. Việc cung cấp thông tin sai lệch — dù vô tình hay hữu ý — đều cấu thành vi phạm và bị xử phạt theo khung 200 - 250 triệu đồng. Hình thức đình chỉ hoạt động từ 6 đến 9 tháng thực chất là một \"lệnh cấm hành nghề\" tạm thời đối với pháp nhân. Trong thời gian này: (1) Sàn không được thực hiện bất kỳ xác nhận giao dịch nào. (2) Mọi hợp đồng dịch vụ ký kết trong thời gian bị đình chỉ đều có nguy cơ bị tuyên vô hiệu. (3) Uy tín thương hiệu của sàn trên thị trường gần như bị xóa sổ."}, {"level": "1", "content": "Môi giới viên A (có chứng chỉ hành nghề) thuộc Sàn giao dịch bất động sản B đã thực hiện đăng tải thông tin quảng cáo về Dự án căn hộ \"Sky Dream\". Trong các bài viết trên mạng xã hội và tờ rơi gửi khách hàng, môi giới A khẳng định dự án có \"Hồ bơi vô cực tiêu chuẩn Olympic và Trung tâm thương mại 5 tầng\". Tuy nhiên, căn cứ vào Quy hoạch chi tiết 1/500 đã được phê duyệt và hồ sơ dự án, vị trí hồ bơi thực chất chỉ là một khu vui chơi trẻ em nhỏ, và trung tâm thương mại chỉ là khu vực Shophouse tại tầng trệt. Một khách hàng sau khi đặt cọc đã phát hiện sự sai lệch này và gửi đơn tố cáo đến cơ quan chức năng. Theo quy định tại Nghị định số 16/2022/NĐ-CP, hành vi cung cấp thông tin không đúng sự thật về tiện ích dự án của Sàn giao dịch bất động sản B sẽ bị xử phạt ở mức nào?", "options": {"A": "Từ 60.000.000 đồng đến 80.000.000 đồng.", "B": "Từ 120.000.000 đồng đến 160.000.000 đồng.", "C": "Từ 200.000.000 đồng đến 250.000.000 đồng.", "D": "Từ 400.000.000 đồng đến 600.000.000 đồng.."}, "answer": "C", "explanation": "<b>Giải thích học thuật:</b> Theo Điều 59 Nghị định 16/2022/NĐ-CP, hành vi cung cấp thông tin bất động sản không đúng sự thật bị xử phạt như sau: Hành vi: \"Cung cấp thông tin về bất động sản không đúng sự thật hoặc không đầy đủ hồ sơ, giấy tờ theo quy định\". Mức phạt tiền: Từ 200.000.000 đồng đến 250.000.000 đồng (đối với tổ chức/sàn giao dịch). Cá nhân môi giới vi phạm mức phạt sẽ bằng một nửa. Hình thức xử phạt bổ sung: Tạm ngưng hoạt động dịch vụ môi giới từ 06 tháng đến 09 tháng."}, {"level": "1", "content": "Môi giới viên A (có chứng chỉ hành nghề) thuộc Sàn giao dịch bất động sản B đã thực hiện đăng tải thông tin quảng cáo về Dự án căn hộ \"Sky Dream\". Trong các bài viết trên mạng xã hội và tờ rơi gửi khách hàng, môi giới A khẳng định dự án có \"Hồ bơi vô cực tiêu chuẩn Olympic và Trung tâm thương mại 5 tầng\". Tuy nhiên, căn cứ vào Quy hoạch chi tiết 1/500 đã được phê duyệt và hồ sơ dự án, vị trí hồ bơi thực chất chỉ là một khu vui chơi trẻ em nhỏ, và trung tâm thương mại chỉ là khu vực Shophouse tại tầng trệt. Một khách hàng sau khi đặt cọc đã phát hiện sự sai lệch này và gửi đơn tố cáo đến cơ quan chức năng. Đối với cá nhân môi giới viên A, ngoài việc bị phạt tiền, cơ quan có thẩm quyền có thể áp dụng hình thức xử phạt bổ sung nào sau đây?", "options": {"A": "Phạt cảnh cáo và buộc phải xin lỗi khách hàng trên phương tiện thông tin đại chúng.", "B": "Tước quyền sử dụng chứng chỉ hành nghề môi giới bất động sản từ 03 tháng đến 06 tháng.", "C": "Tước quyền sử dụng chứng chỉ hành nghề môi giới bất động sản từ 06 tháng đến 09 tháng.", "D": "Đình chỉ hoạt động môi giới trong thời hạn 24 tháng."}, "answer": "B", "explanation": "<b>Giải thích học thuật:</b> Theo Điều 59 Nghị định 16/2022/NĐ-CP, hành vi cung cấp thông tin bất động sản không đúng sự thật bị xử phạt như sau: Hành vi: \"Cung cấp thông tin về bất động sản không đúng sự thật hoặc không đầy đủ hồ sơ, giấy tờ theo quy định\". Mức phạt tiền: Từ 200.000.000 đồng đến 250.000.000 đồng (đối với tổ chức/sàn giao dịch). Cá nhân môi giới vi phạm mức phạt sẽ bằng một nửa. Hình thức xử phạt bổ sung: Tước quyền sử dụng chứng chỉ hành nghề môi giới từ 03 tháng đến 06 tháng."}, {"level": "1", "content": "Ông E dẫn khách mua đất và cung cấp thông tin rằng thửa đất \"đã có quy hoạch đất ở\", \"chỉ chờ lên thổ cư\", trong khi trên thực tế đất chưa được phép chuyển mục đích sử dụng. Theo Nghị định số 16/2022/NĐ-CP, hành vi này của ông E sẽ bị xử lý như thế nào?", "options": {"A": "Phạt tiền từ 40.000.000 đồng đến 60.000.000 đồng; tước quyền sử dụng chứng chỉ hành nghề từ 03 tháng đến 06 tháng.", "B": "Phạt tiền từ 100.000.000 đồng đến 125.000.000 đồng; tước quyền sử dụng chứng chỉ hành nghề từ 06 tháng đến 09 tháng.", "C": "Phạt tiền từ 200.000.000 đồng đến 250.000.000 đồng; đình chỉ hoạt động sàn giao dịch từ 06 tháng đến 09 tháng.", "D": "Phạt tiền từ 100.000.000 đồng đến 120.000.000 đồng; buộc bồi thường gấp đôi tiền cọc cho khách hàng."}, "answer": "B", "explanation": "<b>Giải thích học thuật:</b> Căn cứ pháp lý: Khoản 1 Điều 8 Luật Kinh doanh bất động sản năm 2023: Nghiêm cấm hành vi \"Gian lận, lừa dối trong kinh doanh bất động sản\". Điểm a Khoản 2 Điều 62 Luật Kinh doanh bất động sản năm 2023: Quy định nghĩa vụ của cá nhân hành nghề môi giới phải \"Cung cấp hồ sơ, thông tin về bất động sản do mình môi giới và chịu trách nhiệm về hồ sơ, thông tin do mình cung cấp\". Khoản 3 Điều 59 Nghị định số 16/2022/NĐ-CP: Quy định xử phạt đối với hành vi cung cấp thông tin không đúng sự thật. Hành vi: Cung cấp thông tin bất động sản không đúng sự thật (Khoản 3 Điều 59) có mức phạt dành cho tổ chức là  200.000.000 – 250.000.000 VNĐ, mức phạt cá nhân (Ông E): 100.000.000 – 125.000.000 VNĐ (bằng 1/2 mức phạt tổ chức). Điểm b khoản 4 của điều 59 cũng quy định Tước quyền sử dụng chứng chỉ hành nghề môi giới từ 06 tháng đến 09 tháng đối với cá nhân vi phạm quy định tại Khoản 3 (Hành vi cung cấp thông tin sai sự thật)."}, {"level": "1", "content": "Căn cứ Điều 59 Nghị định số 16/2022/NĐ-CP, hãy xác định sự khác biệt về hình thức xử phạt bổ sung (tước quyền sử dụng chứng chỉ hành nghề) giữa hành vi (1) \"Cho người khác mượn chứng chỉ\" và hành vi (2) \"Cung cấp thông tin bất động sản không đúng sự thật\" của cá nhân môi giới?", "options": {"A": "Cả hai hành vi đều bị tước chứng chỉ từ 03 tháng đến 06 tháng vì đều là vi phạm của cá nhân.", "B": "Hành vi (1) bị tước chứng chỉ từ 03 tháng đến 06 tháng; hành vi (2) bị tước chứng chỉ từ 06 tháng đến 09 tháng.", "C": "Hành vi (1) bị tước chứng chỉ từ 06 tháng đến 09 tháng; hành vi (2) bị tước chứng chỉ từ 03 tháng đến 06 tháng.", "D": "Cả hai hành vi đều bị tước chứng chỉ từ 06 tháng đến 09 tháng để đảm bảo tính răn đe tối đa."}, "answer": "B", "explanation": "<b>Giải thích học thuật:</b> Căn cứ pháp lý: Điều 59 Nghị định 16/2022/NĐ-CP.  Lỗi cung cấp thông tin sai sự thật (Khoản 3) là lỗi gây hệ lụy xã hội lớn, nên dù là Sàn (đình chỉ hoạt động) hay Môi giới (tước chứng chỉ) thì đều chịu chung khung thời gian từ 06 đến 09 tháng (theo điểm a và điểm b Khoản 4 Điều 59). Riêng các lỗi mang tính kỹ thuật, quản lý hồ sơ tại Khoản 1 thì thời gian tước chứng chỉ nhẹ hơn, từ 03 đến 06 tháng (theo điểm c Khoản 4 Điều 59)."}, {"level": "1", "content": "Căn cứ Điều 59 Nghị định 16/2022/NĐ-CP, hành vi không lập hợp đồng hoặc hợp đồng kinh doanh dịch vụ bất động sản không đầy đủ các nội dung chính theo quy định thì bị phạt bao nhiêu tiền?", "options": {"A": "Từ 100.000.000 đồng đến 140.000.000 đồng", "B": "Từ 120.000.000 đồng đến 160.000.000 đồng", "C": "Từ 140.000.000 đồng đến 180.000.000 đồng", "D": "Từ 160.000.000 đồng đến 200.000.000 đồng"}, "answer": "B", "explanation": "<b>Giải thích học thuật:</b> Căn cứ pháp lý:  Điểm a Khoản 2 Điều 59 Nghị định số 16/2022/NĐ-CP: Quy định xử phạt đối với tổ chức kinh doanh dịch vụ bất động sản (như sàn giao dịch, môi giới, tư vấn, quản lý bất động sản) có hành vi: \"Kinh doanh dịch vụ bất động sản mà không lập hợp đồng hoặc hợp đồng không đầy đủ các nội dung chính theo quy định\". Khoản 3 Điều 4 Nghị định số 16/2022/NĐ-CP: Xác định mức phạt tiền quy định tại Điều 59 là mức phạt áp dụng đối với tổ chức. Mức 120 - 160 triệu đồng áp dụng cho Pháp nhân (Công ty, Sàn giao dịch).Đối với Cá nhân môi giới vi phạm (theo nguyên tắc 1/2), mức phạt tiền sẽ là từ 60.000.000 đồng đến 80.000.000 đồng."}, {"level": "1", "content": "Mức xử phạt từ 400-600 triệu đồng trong Nghị định 16/2022/NĐ-CP được áp dụng cho lĩnh vực Kinh doanh Bất động sản trong những trường hợp nào dưới đây:", "options": {"A": "Kinh doanh không đúng phạm vi được phép theo quy định", "B": "Triển khai xây dựng dự án kinh doanh bất động sản, dự án đầu tư xây dựng nhà ở chậm tiến độ", "C": "Câu A đúng câu B sai", "D": "Cả câu A và B đều đúng"}, "answer": "D", "explanation": "<b>Giải thích học thuật:</b> "}, {"level": "1", "content": "Tổ chức có hành vi kinh doanh bất động sản không đúng phạm vi được phép kinh doanh theo quy định thì bị phạt tiền ở mức nào?", "options": {"A": "Từ 80.000.000 đồng đến 100.000.000 đồng", "B": "Từ 100.000.000 đồng đến 120.000.000 đồng.", "C": "Từ 120.000.000 đồng đến 160.000.000 đồng", "D": "Từ 160.000.000 đồng đến 200.000.000 đồng"}, "answer": "B", "explanation": "<b>Giải thích học thuật:</b> "}, {"level": "1", "content": "Tổ chức có hành vi không lập hợp đồng hoặc lập hợp đồng kinh doanh bất động sản không đầy đủ các nội dung chính theo quy định thì bị phạt tiền bao nhiêu?", "options": {"A": "Từ 50.000.000 đồng đến 100.000.000 đồng", "B": "Từ 80.000.000 đồng đến 100.000.000 đồng", "C": "Từ 100.000.000 đồng đến 120.000.000 đồng.", "D": "Từ 120.000.000 đồng đến 150.000.000 đồng"}, "answer": "C", "explanation": "<b>Giải thích học thuật:</b> "}, {"level": "1", "content": "Hành vi ký kết hợp đồng mua bán hoặc thuê mua nhà, công trình xây dựng mà không gắn quyền sử dụng đất với nhà, công trình xây dựng đó sẽ bị phạt tiền ở mức nào đối với tổ chức?", "options": {"A": "Từ 100.000.000 đồng đến 120.000.000 đồng", "B": "Từ 120.000.000 đồng đến 160.000.000 đồng.", "C": "Từ 160.000.000 đồng đến 200.000.000 đồng", "D": "Từ 400.000.000 đồng đến 600.000.000 đồng"}, "answer": "B", "explanation": "<b>Giải thích học thuật:</b> "}, {"level": "1", "content": "Tổ chức kinh doanh bất động sản có hành vi không thông báo cho bên mua các hạn chế về quyền sở hữu nhà, công trình xây dựng (nếu có) thì bị phạt tiền bao nhiêu?", "options": {"A": "Từ 80.000.000 đồng đến 100.000.000 đồng", "B": "Từ 100.000.000 đồng đến 120.000.000 đồng", "C": "Từ 120.000.000 đồng đến 160.000.000 đồng.", "D": "Từ 160.000.000 đồng đến 200.000.000 đồng"}, "answer": "C", "explanation": "<b>Giải thích học thuật:</b> "}, {"level": "1", "content": "Tổ chức có hành vi thu tiền của bên mua, bên thuê mua bất động sản hình thành trong tương lai không đúng tiến độ thực hiện dự án theo thỏa thuận của các bên bị phạt tiền ở mức nào?", "options": {"A": "Từ 120.000.000 đồng đến 160.000.000 đồng", "B": "Từ 200.000.000 đồng đến 300.000.000 đồng", "C": "Từ 400.000.000 đồng đến 600.000.000 đồng.", "D": "Từ 800.000.000 đồng đến 1.000.000.000 đồng"}, "answer": "C", "explanation": "<b>Giải thích học thuật:</b> "}, {"level": "1", "content": "Chủ đầu tư có hành vi bán hoặc cho thuê mua nhà ở thương mại hình thành trong tương lai mà chưa được ngân hàng thương mại đủ năng lực thực hiện bảo lãnh nghĩa vụ tài chính thì bị phạt tiền bao nhiêu?", "options": {"A": "Từ 200.000.000 đồng đến 400.000.000 đồng", "B": "Từ 300.000.000 đồng đến 500.000.000 đồng", "C": "Từ 400.000.000 đồng đến 600.000.000 đồng.", "D": "Từ 600.000.000 đồng đến 800.000.000 đồng"}, "answer": "C", "explanation": "<b>Giải thích học thuật:</b> "}, {"level": "1", "content": "Tổ chức có hành vi ủy quyền hoặc giao cho bên tham gia hợp tác đầu tư, liên doanh, liên kết, hợp tác kinh doanh hoặc góp vốn thực hiện ký hợp đồng mua bán, chuyển nhượng hoặc cho thuê mua bất động sản bị phạt tiền ở mức nào?", "options": {"A": "Từ 120.000.000 đồng đến 160.000.000 đồng", "B": "Từ 200.000.000 đồng đến 300.000.000 đồng", "C": "Từ 400.000.000 đồng đến 600.000.000 đồng.", "D": "Từ 800.000.000 đồng đến 1.000.000.000 đồng"}, "answer": "C", "explanation": "<b>Giải thích học thuật:</b> "}, {"level": "1", "content": "Chủ đầu tư dự án kinh doanh bất động sản có hành vi bàn giao nhà, công trình xây dựng cho khách hàng khi chưa hoàn thành nghiệm thu đưa công trình vào sử dụng theo quy định thì bị phạt tiền ở mức nào?", "options": {"A": "Từ 400.000.000 đồng đến 600.000.000 đồng", "B": "Từ 600.000.000 đồng đến 800.000.000 đồng", "C": "Từ 800.000.000 đồng đến 1.000.000.000 đồng.", "D": "Từ 1.000.000.000 đồng đến 1.200.000.000 đồng"}, "answer": "C", "explanation": "<b>Giải thích học thuật:</b> "}, {"level": "1", "content": "Chủ đầu tư dự án kinh doanh bất động sản có hành vi huy động vốn không đúng quy định bị xử phạt tiền ở mức nào?", "options": {"A": "Từ 200.000.000 đồng đến 400.000.000 đồng", "B": "Từ 400.000.000 đồng đến 600.000.000 đồng", "C": "Từ 600.000.000 đồng đến 800.000.000 đồng", "D": "Từ 800.000.000 đồng đến 1.000.000.000 đồng ."}, "answer": "D", "explanation": "<b>Giải thích học thuật:</b> "}, {"level": "1", "content": "Hành vi sử dụng vốn huy động của tổ chức, cá nhân hoặc tiền ứng trước của bên mua, bên thuê mua bất động sản hình thành trong tương lai không đúng mục đích cam kết của chủ đầu tư dự án sẽ bị phạt tiền ở mức nào?", "options": {"A": "Từ 400.000.000 đồng đến 600.000.000 đồng", "B": "Từ 600.000.000 đồng đến 800.000.000 đồng", "C": "Từ 800.000.000 đồng đến 1.000.000.000 đồng.", "D": "Từ 1.000.000.000 đồng đến 1.500.000.000 đồng"}, "answer": "C", "explanation": "<b>Giải thích học thuật:</b> "}, {"level": "1", "content": "Kinh doanh dịch vụ bất động sản mà không thành lập doanh nghiệp theo quy định, không đủ số người có chứng chỉ hành nghề môi giới bất động sản theo quy định hoặc chứng hành nghề đã hết thời hạn sử dụng theo quy định bị phạt tiền?", "options": {"A": "Từ 100.000.000 đồng đến 140.000.000 đồng", "B": "Từ 120.000.000 đồng đến 160.000.000 đồng", "C": "Từ 140.000.000 đồng đến 180.000.000 đồng", "D": "Từ 160.000.000 đồng đến 200.000.000 đồng"}, "answer": "B", "explanation": "<b>Giải thích học thuật:</b> "}, {"level": "1", "content": "Cá nhân hành nghề môi giới bất động sản mà không có chứng chỉ hành nghề theo quy định hoặc chứng chỉ hành nghề hết thời hạn sử dụng theo quy định thì bị phạt tiền?", "options": {"A": "Từ 20.000.000 đồng đến 40.000.000 đồng", "B": "Từ 30.000.000 đồng đến 50.000.000 đồng", "C": "Từ 40.000.000 đồng đến 60.000.000 đồng", "D": "Từ 50.000.000 đồng đến 70.000.000 đồng"}, "answer": "C", "explanation": "<b>Giải thích học thuật:</b> "}, {"level": "1", "content": "Tẩy xóa, sữa chữa, cho mượn, cho thuê hoặc thuê, mượn chứng chỉ hành nghề môi giới bất động sản để thực hiện các hoạt động liên quan đến môi giới bất động sản thì bị phạt tiền?", "options": {"A": "Từ 20.000.000 đồng đến 40.000.000 đồng", "B": "Từ 30.000.000 đồng đến 50.000.000 đồng", "C": "Từ 40.000.000 đồng đến 60.000.000 đồng", "D": "Từ 50.000.000 đồng đến 70.000.000 đồng"}, "answer": "C", "explanation": "<b>Giải thích học thuật:</b> "}, {"level": "1", "content": "Không lập hợp đồng hoặc hợp đồng kinh doanh dịch vụ bất động sản không đầy đủ các nội dung chính theo quy định thì bị phạt tiền? (căn cứ Điều 59 Nghị định 16/2022/NĐ-CP)", "options": {"A": "Từ 100.000.000 đồng đến 140.000.000 đồng", "B": "Từ 120.000.000 đồng đến 160.000.000 đồng", "C": "Từ 140.000.000 đồng đến 180.000.000 đồng", "D": "Từ 160.000.000 đồng đến 200.000.000 đồng"}, "answer": "B", "explanation": "<b>Giải thích học thuật:</b> "}, {"level": "1", "content": "Sàn giao dịch bất động sản không có quy chế hoạt động, tên, địa chỉ theo quy định hoặc hoạt động sai quy chế được cơ quan có thẩm quyền chấp thuận thì bị phạt tiền?", "options": {"A": "Từ 100.000.000 đồng đến 140.000.000 đồng", "B": "Từ 120.000.000 đồng đến 160.000.000 đồng", "C": "Từ 140.000.000 đồng đến 180.000.000 đồng", "D": "Từ 160.000.000 đồng đến 200.000.000 đồng"}, "answer": "B", "explanation": "<b>Giải thích học thuật:</b> "}, {"level": "1", "content": "Hành vi không cung cấp, cung cấp không đầy đủ hoặc cung cấp không chính xác hồ sơ, thông tin về bất động sản mà mình môi giới thì bị phạt tiền?", "options": {"A": "Từ 50.000.000 đồng đến 100.000.000 đồng", "B": "Từ 100.000.000 đồng đến 150.000.000 đồng", "C": "Từ 150.000.000 đồng đến 200.000.000 đồng", "D": "Từ 200.000.000 đồng đến 250.000.000 đồng"}, "answer": "D", "explanation": "<b>Giải thích học thuật:</b> "}, {"level": "1", "content": "Theo quy định pháp luật hiện hành về xử phạt vi phạm hành chính trong các lĩnh vực xây dựng, đất đai và kinh doanh bất động sản, mức phạt tiền tối đa đối với cá nhân vi phạm trong các lĩnh vực này là bao nhiêu?", "options": {"A": "100.000.000 đồng", "B": "250.000.000 đồng", "C": "500.000.000 đồng", "D": "1.000.000.000 đồng"}, "answer": "C", "explanation": "<b>Giải thích học thuật:</b> điểm i khoản 1 Điều 24 Luật XP VPHC 2012"}, {"level": "1", "content": "Đối với tổ chức vi phạm hành chính trong lĩnh vực kinh doanh bất động sản, mức phạt tiền tối đa được xác định như thế nào?", "options": {"A": "Bằng mức phạt của cá nhân", "B": "Gấp 2 lần mức phạt của cá nhân", "C": "Gấp 3 lần mức phạt của cá nhân", "D": "Không quy định mức tối đa"}, "answer": "B", "explanation": "<b>Giải thích học thuật:</b> Khoản 2 Điều 24 Luật Xử lý vi phạm hành chính"}, {"level": "1", "content": "Theo Nghị định 16/2022/NĐ-CP, hành vi vi phạm nào sau đây thuộc nhóm vi phạm trong kinh doanh bất động sản?", "options": {"A": "Không nộp thuế thu nhập doanh nghiệp đúng hạn", "B": "Không công khai thông tin dự án bất động sản theo quy định", "C": "Vi phạm quy định về phòng cháy chữa cháy trong nhà ở", "D": "Không đăng ký hộ kinh doanh cá thể"}, "answer": "B", "explanation": "<b>Giải thích học thuật:</b> Điểm b khoản 1 Điều 58 Nghị định 16/2022/NĐ-CP"}, {"level": "1", "content": "Hành vi kinh doanh BĐS mà Hợp đồng kinh doanh bất động sản không được lập thành văn bản hoặc lập hợp đồng kinh doanh bất động sản không đầy đủ các nội dung chính theo quy định hoặc trái quy định của pháp luật", "options": {"A": "50 – 100 triệu đồng", "B": "100 – 120 triệu đồng", "C": "120 – 250 triệu đồng", "D": "250 – 300 triệu đồng"}, "answer": "B", "explanation": "<b>Giải thích học thuật:</b> Điểm c, khoản 1 Điều 58 Nghị định 16/2022/NĐ-CP."}, {"level": "1", "content": "Kinh doanh bất động sản mà bất động sản đó không đảm bảo đầy đủ các điều kiện theo quy định hoặc không được phép đưa vào kinh doanh theo quy định bị xử phạt:", "options": {"B": "300 – 400 triệu đồng", "C": "400 – 600 triệu đồng", "D": "Trên 600 triệu đồng"}, "answer": "C", "explanation": "<b>Giải thích học thuật:</b> Điểm a Khoản 3, Điều 58 Nghị định 16/2022/NĐ-CP."}, {"level": "1", "content": "Kinh doanh dịch vụ bất động sản mà không thành lập doanh nghiệp theo quy định hoặc không đủ số người có chứng chỉ hành nghề môi giới bất động sản theo quy định hoặc chứng chỉ hành nghề hết thời hạn sử dụng theo quy định bị xử phạt:", "options": {"A": "60 – 80 triệu đồng", "B": "80 – 100 triệu đồng", "C": "100 – 120 triệu đồng", "D": "120 – 160 triệu đồng"}, "answer": "D", "explanation": "<b>Giải thích học thuật:</b> Điểm a khoản 2 Điều 59 Nghị định 16/2022/NĐ-CP."}, {"level": "1", "content": "Kinh doanh dịch vụ môi giới bất động sản độc lập mà không có chứng chỉ hành nghề hoặc chứng chỉ hành nghề hết thời hạn sử dụng theo quy định bị phạt:", "options": {"B": "60 – 80 triệu đồng", "C": "80 – 100 triệu đồng", "D": "100 – 120 triệu đồng"}, "answer": "A", "explanation": "<b>Giải thích học thuật:</b> Điều a khoản 1 Điều 59 Nghị định 16/2022/NĐ-CP."}, {"level": "1", "content": "Không cung cấp, cung cấp không chính xác, không đầy đủ hoặc không đúng thời hạn kê khai thông tin, dữ liệu về thị trường bất động sản cho cơ quan quản lý hệ thống thông tin về nhà ở và thị trường bất động sản theo quy định:", "options": {"A": "60 – 80 triệu đồng", "B": "80 – 150 triệu đồng", "C": "150 – 200 triệu đồng", "D": "200 – 250 triệu đồng"}, "answer": "A", "explanation": "<b>Giải thích học thuật:</b> Điểm a ,Khoản 1, Điều 60 Nghị định 16/2022/NĐ-CP."}, {"level": "1", "content": "Xử phạt đối với hành vi không thực hiện thủ tục để điều chỉnh, gia hạn giấy phép xây dựng đối với xây dựng nhà ở riêng lẻ trong khu bảo tồn, khu di tích lịch sử - văn hóa hoặc công trình xây dựng khác:", "options": {"A": "5 – 10 triệu đồng", "B": "10 – 20 triệu đồng", "C": "25 – 30 triệu đồng", "D": "30 – 50 triệu đồng"}, "answer": "C", "explanation": "<b>Giải thích học thuật:</b> Điểm b khoản 3 Điều 16 Nghị định 16/2022/NĐ-CP."}, {"level": "1", "content": "Xử phạt hành vi tổ chức thi công xây dựng công trình không che chắn hoặc có che chắn nhưng để rơi vãi vật liệu xây dựng xuống các khu vực xung quanh hoặc để vật liệu xây dựng không đúng nơi quy định đối với xây dựng nhà ở riêng lẻ hoặc công trình xây dựng khác:", "options": {"A": "1 – 3 triệu đồng", "B": "3  – 5 triệu đồng", "C": "10 – 20 triệu đồng", "D": "25 – 30 triệu đồng"}, "answer": "B", "explanation": "<b>Giải thích học thuật:</b> Điểm a Khoản 1 Điều 16 Nghị định 16/2022/NĐ-CP."}, {"level": "1", "content": "Xử phạt đối với hành vi tổ chức thi công xây dựng công trình không có giấy phép xây dựng mà theo quy định phải có giấy phép xây dựng đối với xây dựng nhà ở riêng lẻ trong khu bảo tồn, khu di tích lịch sử - văn hóa hoặc công trình xây dựng khác;", "options": {"B": "80 – 100 triệu đồng", "C": "100 – 120 triệu đồng", "D": "120 – 150 triệu đồng"}, "answer": "B", "explanation": "<b>Giải thích học thuật:</b> điểm b Khoản 7, Điều 16 Nghị định 16/2022/NĐ-CP."}, {"level": "1", "content": "Vi phạm quy định về kinh doanh bất động sản, với mức phạt tiền từ 120.000.000 đồng đến 160.000.000 đồng đối với chủ đầu tư hoặc chủ sở hữu nhà, công trình xây dựng có một trong các hành vi nào sau đây:", "options": {"A": "Ký kết hợp đồng mua bán hoặc thuê mua nhà, công trình xây dựng mà không gắn quyền sử dụng đất với nhà, công trình xây dựng đó;", "B": "Không thông báo cho bên mua các hạn chế về quyền sở hữu nhà, công trình xây dựng (nếu có).", "C": "Cả A & B", "D": "Triển khai xây dựng dự án kinh doanh bất động sản, dự án đầu tư xây dựng nhà ở chậm tiến độ đã được cơ quan có thẩm quyền phê duyệt"}, "answer": "", "explanation": ""}, {"level": "1", "content": "Thời hiệu xử phạt vi phạm hành chính trong lĩnh vực đất đai là:", "options": {"A": "1 năm", "B": "2 năm", "C": "3 năm", "D": "5 năm"}, "answer": "B", "explanation": "<b>Giải thích học thuật:</b> Khoản 1 Điều 3 Nghị định số 123/2024/NĐ-CP ngày 4/10/2024 của Chính phủ quy định về xử phạt vi phạm hành chính trong lĩnh vực đất đai"}, {"level": "1", "content": "Theo Luật Xử lý vi phạm hành chính, cá nhân có quyền gì trong quá trình xử lý vi phạm hành chính?", "options": {"A": "Quyền tố cáo hành vi vi phạm pháp luật trong việc xử lý vi phạm hành chính theo quy định pháp luật", "B": "Quyền chỉ được khiếu nại, không được tố cáo", "C": "Quyền yêu cầu hủy bỏ toàn bộ quyết định xử phạt hành chính", "D": "Quyền tự ý đình chỉ việc thi hành quyết định xử phạt"}, "answer": "A", "explanation": "<b>Giải thích học thuật:</b> Khoản 2 Điều 15 Luật Xử lý vi phạm hành chính năm 2012"}, {"level": "1", "content": "Tổ chức có hành vi tổ chức thi công xây dựng công trình không có giấy phép xây dựng mà theo quy định phải có giấy phép đối với nhà ở riêng lẻ thì bị phạt tiền ở mức nào?", "options": {"A": "Từ 60.000.000 đồng đến 80.000.000 đồng", "B": "Từ 40.000.000 đồng đến 60.000.000 đồng", "C": "Từ 80.000.000 đồng đến 100.000.000 đồng", "D": "Từ 100.000.000 đồng đến 120.000.000 đồng"}, "answer": "A", "explanation": "<b>Giải thích học thuật:</b> Điểm a khoản 7 Điều 16 quy định phạt tiền từ 60.000.000 đồng đến 80.000.000 đồng đối với hành vi tổ chức thi công xây dựng nhà ở riêng lẻ không có giấy phép xây dựng."}, {"level": "1", "content": "Tổ chức có hành vi tổ chức thi công xây dựng công trình không có giấy phép xây dựng đối với công trình có yêu cầu phải lập báo cáo nghiên cứu khả thi đầu tư xây dựng thì bị phạt tiền ở mức nào?", "options": {"A": "Từ 80.000.000 đồng đến 100.000.000 đồng", "B": "Từ 100.000.000 đồng đến 120.000.000 đồng", "C": "Từ 120.000.000 đồng đến 140.000.000 đồng", "D": "Từ 140.000.000 đồng đến 160.000.000 đồng"}, "answer": "C", "explanation": "<b>Giải thích học thuật:</b> Điểm c khoản 7 Điều 16 quy định chế tài phạt tiền từ 120.000.000 đồng đến 140.000.000 đồng đối với công trình vi phạm không phép thuộc diện phải lập báo cáo nghiên cứu khả thi/báo cáo kinh tế - kỹ thuật."}, {"level": "1", "content": "Tổ chức có hành vi thi công xây dựng công trình sai nội dung giấy phép xây dựng được cấp đối với trường hợp cấp phép xây dựng mới cho nhà ở riêng lẻ bị phạt tiền ở mức nào?", "options": {"A": "Từ 15.000.000 đồng đến 20.000.000 đồng", "B": "Từ 30.000.000 đồng đến 40.000.000 đồng", "C": "Từ 50.000.000 đồng đến 70.000.000 đồng", "D": "Từ 70.000.000 đồng đến 90.000.000 đồng"}, "answer": "B", "explanation": "<b>Giải thích học thuật:</b> Điểm a khoản 6 Điều 16 quy định hành vi xây sai nội dung giấy phép xây dựng mới đối với nhà ở riêng lẻ chịu mức phạt tiền từ 30.000.000 đồng đến 40.000.000 đồng."}, {"level": "1", "content": "Tổ chức có hành vi thi công xây dựng công trình sai nội dung giấy phép xây dựng mới được cấp đối với công trình có yêu cầu phải lập báo cáo nghiên cứu khả thi đầu tư xây dựng bị phạt tiền bao nhiêu?", "options": {"A": "Từ 70.000.000 đồng đến 90.000.000 đồng", "B": "Từ 80.000.000 đồng đến 100.000.000 đồng", "C": "Từ 100.000.000 đồng đến 120.000.000 đồng", "D": "Từ 120.000.000 đồng đến 140.000.000 đồng"}, "answer": "C", "explanation": "<b>Giải thích học thuật:</b> Điểm c khoản 6 Điều 16 quy định mức phạt từ 100.000.000 đồng đến 120.000.000 đồng đối với hành vi xây sai nội dung giấy phép xây dựng mới áp dụng cho công trình yêu cầu phải lập báo cáo nghiên cứu khả thi."}, {"level": "1", "content": "Tổ chức có hành vi thi công xây dựng công trình sai nội dung giấy phép sửa chữa, cải tạo đối với công trình có yêu cầu phải lập báo cáo nghiên cứu khả thi đầu tư xây dựng bị phạt tiền bao nhiêu?", "options": {"A": "Từ 30.000.000 đồng đến 40.000.000 đồng", "B": "Từ 50.000.000 đồng đến 70.000.000 đồng", "C": "Từ 70.000.000 đồng đến 90.000.000 đồng", "D": "Từ 90.000.000 đồng đến 110.000.000 đồng"}, "answer": "C", "explanation": "<b>Giải thích học thuật:</b> Điểm c khoản 4 Điều 16 phân hóa rõ vi phạm sai phép \"sửa chữa, cải tạo\" sẽ có mức phạt nhẹ hơn so với sai phép \"xây dựng mới\", cụ thể mức phạt áp dụng là từ 70.000.000 đồng đến 90.000.000 đồng."}, {"level": "1", "content": "Hành vi tổ chức thi công xây dựng công trình không đúng thiết kế xây dựng được thẩm định trong trường hợp được miễn giấy phép xây dựng bị phạt tiền ở mức nào đối với tổ chức?", "options": {"A": "Từ 40.000.000 đồng đến 60.000.000 đồng", "B": "Từ 60.000.000 đồng đến 80.000.000 đồng", "C": "Từ 80.000.000 đồng đến 100.000.000 đồng", "D": "Từ 100.000.000 đồng đến 120.000.000 đồng"}, "answer": "C", "explanation": "<b>Giải thích học thuật:</b> Khoản 9 Điều 16 quy định vi phạm về việc thi công không đúng thiết kế xây dựng được thẩm định (áp dụng với trường hợp được miễn giấy phép) bị phạt tiền từ 80.000.000 đồng đến 100.000.000 đồng."}, {"level": "1", "content": "Tổ chức có hành vi xây dựng cơi nới, lấn chiếm diện tích, lấn chiếm không gian đang được quản lý, sử dụng hợp pháp của tổ chức, cá nhân khác đối với xây dựng nhà ở riêng lẻ thì bị phạt tiền ở mức nào?", "options": {"A": "Từ 60.000.000 đồng đến 80.000.000 đồng", "B": "Từ 80.000.000 đồng đến 100.000.000 đồng", "C": "Từ 100.000.000 đồng đến 120.000.000 đồng", "D": "Từ 120.000.000 đồng đến 140.000.000 đồng"}, "answer": "B", "explanation": "<b>Giải thích học thuật:</b> Theo điểm a khoản 10 Điều 16, các hành vi cơi nới, lấn chiếm không gian/diện tích hợp pháp của chủ thể khác đối với nhà ở riêng lẻ sẽ bị áp dụng mức phạt từ 80.000.000 đồng đến 100.000.000 đồng. Hành vi này có tính chất xâm phạm quyền tài sản nghiêm trọng nên có mức phạt cao hơn so với chỉ vi phạm xây không phép trên đất của mình."}, {"level": "1", "content": "Tổ chức đang thi công xây dựng nhà ở riêng lẻ không có giấy phép xây dựng, đã bị người có thẩm quyền lập biên bản vi phạm hành chính mà vẫn tiếp tục thực hiện hành vi vi phạm thì bị phạt tiền ở mức nào?", "options": {"A": "Từ 80.000.000 đồng đến 100.000.000 đồng", "B": "Từ 100.000.000 đồng đến 120.000.000 đồng", "C": "Từ 120.000.000 đồng đến 140.000.000 đồng", "D": "Từ 400.000.000 đồng đến 500.000.000 đồng"}, "answer": "B", "explanation": "<b>Giải thích học thuật:</b> Điểm a khoản 12 Điều 16 thiết lập khung hình phạt tăng nặng đối với hành vi \"tiếp tục thực hiện vi phạm\" sau khi đã bị lập biên bản. Mức phạt từ 100.000.000 đồng đến 120.000.000 đồng (nhà ở riêng lẻ)."}, {"level": "1", "content": "Tổ chức đang thi công công trình có yêu cầu phải lập báo cáo nghiên cứu khả thi đầu tư xây dựng không phép, đã bị lập biên bản vi phạm hành chính mà vẫn \"tiếp tục thực hiện hành vi vi phạm\" thì bị phạt tiền ở mức nào?", "options": {"A": "Từ 100.000.000 đồng đến 120.000.000 đồng", "B": "Từ 200.000.000 đồng đến 300.000.000 đồng", "C": "Từ 300.000.000 đồng đến 400.000.000 đồng", "D": "Từ 400.000.000 đồng đến 500.000.000 đồng"}, "answer": "D", "explanation": "<b>Giải thích học thuật:</b> Theo điểm c khoản 12 Điều 16, hành vi tiếp tục vi phạm đối với công trình yêu cầu lập báo cáo nghiên cứu khả thi bị phạt rất nặng để mang tính răn đe, khung tiền phạt từ 400.000.000 đồng đến 500.000.000 đồng."}, {"level": "1", "content": "Tổ chức đã bị xử phạt vi phạm hành chính về hành vi xây dựng công trình không phép đối với công trình có yêu cầu phải lập báo cáo nghiên cứu khả thi đầu tư xây dựng, nhưng chưa hết thời hạn được coi là chưa bị xử phạt mà lại \"tái phạm\" thì bị phạt tiền ở mức nào?", "options": {"A": "Từ 400.000.000 đồng đến 500.000.000 đồng", "B": "Từ 600.000.000 đồng đến 800.000.000 đồng", "C": "Từ 800.000.000 đồng đến 900.000.000 đồng", "D": "Từ 950.000.000 đồng đến 1.000.000.000 đồng"}, "answer": "D", "explanation": "<b>Giải thích học thuật:</b> Điểm c khoản 13 Điều 16 quy định mức xử phạt kịch khung trong lĩnh vực trật tự xây dựng hiện hành đối với hành vi \"tái phạm\" (đã có quyết định xử phạt, chưa hết thời hạn xóa tích mà lại vi phạm tiếp) đối với công trình lớn, với số tiền phạt lên đến từ 950.000.000 đồng đến 1.000.000.000 đồng."}, {"level": "1", "content": "Công ty cổ phần Đào tạo BĐS Alpha tổ chức lớp bồi dưỡng kiến thức hành nghề môi giới bất động sản. Tuy nhiên, qua công tác thanh tra, Sở Xây dựng phát hiện công ty này đã phân công một số cá nhân không đủ tiêu chuẩn theo quy định làm giảng viên đứng lớp. Theo quy định pháp luật, Công ty Alpha sẽ bị áp dụng mức phạt tiền là bao nhiêu đối với vi phạm này?", "options": {"A": "Từ 10.000.000 đồng đến 20.000.000 đồng", "B": "Từ 20.000.000 đồng đến 30.000.000 đồng", "C": "Từ 30.000.000 đồng đến 40.000.000 đồng", "D": "Từ 40.000.000 đồng đến 50.000.000 đồng"}, "answer": "A", "explanation": "<b>Giải thích học thuật:</b> (Lĩnh vực Đào tạo): Căn cứ theo khoản 1 Điều 61 Nghị định 16/2022/NĐ-CP, pháp luật quy định mức phạt tiền từ 10.000.000 đồng đến 20.000.000 đồng đối với tổ chức, cơ sở đào tạo có hành vi \"Sử dụng giảng viên không đủ tiêu chuẩn theo quy định\" khi giảng dạy các khóa bồi dưỡng kiến thức hành nghề môi giới bất động sản, điều hành sàn giao dịch. Việc đảm bảo chất lượng giảng viên là yếu tố bắt buộc để đảm bảo chất lượng nguồn nhân lực đầu ra."}, {"level": "1", "content": "Trung tâm Đào tạo nghề Bất động sản Beta đã tự ý cấp giấy chứng nhận hoàn thành khóa học bồi dưỡng kiến thức hành nghề môi giới bất động sản cho học viên Nguyễn Văn A, mặc dù học viên này thường xuyên vắng mặt và chưa hoàn thành đủ thời lượng chương trình khung. Với vi phạm cấp giấy chứng nhận không đúng quy định này, Trung tâm Beta sẽ bị phạt tiền ở mức nào?", "options": {"A": "Từ 20.000.000 đồng đến 40.000.000 đồng", "B": "Từ 40.000.000 đồng đến 60.000.000 đồng", "C": "Từ 60.000.000 đồng đến 80.000.000 đồng", "D": "Từ 80.000.000 đồng đến 100.000.000 đồng"}, "answer": "B", "explanation": "<b>Giải thích học thuật:</b> (Lĩnh vực Đào tạo, Chứng chỉ): Theo điểm c khoản 2 Điều 61 Nghị định 16/2022/NĐ-CP, hành vi \"Cấp giấy chứng nhận hoàn thành khóa học bồi dưỡng kiến thức hành nghề môi giới bất động sản, điều hành sàn giao dịch bất động sản không đúng quy định\" được xếp vào nhóm vi phạm nghiêm trọng về tính minh bạch trong đào tạo, với khung hình phạt tiền áp dụng cho tổ chức vi phạm là từ 40.000.000 đồng đến 60.000.000 đồng. Ngoài ra, cơ sở vi phạm còn bị áp dụng biện pháp khắc phục hậu quả là buộc thu hồi các giấy chứng nhận đã cấp sai."}, {"level": "1", "content": "Doanh nghiệp kinh doanh bất động sản Omega có trách nhiệm cung cấp thông tin, dữ liệu về dự án bất động sản đang triển khai cho cơ quan quản lý hệ thống thông tin. Tuy nhiên, doanh nghiệp đã trốn tránh, không cung cấp hoặc cung cấp không chính xác, không đầy đủ các thông tin này theo quy định làm ảnh hưởng đến cơ sở dữ liệu chung. Hành vi này của Omega sẽ bị xử phạt tiền ở mức nào?", "options": {"A": "Từ 40.000.000 đồng đến 60.000.000 đồng", "B": "Từ 60.000.000 đồng đến 80.000.000 đồng", "C": "Từ 80.000.000 đồng đến 100.000.000 đồng", "D": "Từ 100.000.000 đồng đến 120.000.000 đồng"}, "answer": "B", "explanation": "<b>Giải thích học thuật:</b> (Lĩnh vực Hệ thống thông tin): Căn cứ điểm a khoản 1 Điều 60 Nghị định 16/2022/NĐ-CP, các tổ chức, doanh nghiệp có hành vi \"Không cung cấp, cung cấp không chính xác, không đầy đủ hoặc không đúng thời hạn thông tin, dữ liệu về dự án bất động sản\" sẽ bị phạt tiền từ 60.000.000 đồng đến 80.000.000 đồng. Chế tài này nhằm thiết lập kỷ cương trong việc xây dựng hệ thống dữ liệu quốc gia minh bạch về thị trường."}, {"level": "1", "content": "Sàn giao dịch bất động sản Delta trong quá trình báo cáo định kỳ đã gửi số liệu lên hệ thống cơ sở dữ liệu nhà ở và thị trường bất động sản. Sau đó, Sàn Delta tự phát hiện có sai sót nghiêm trọng trong dữ liệu đã cung cấp nhưng lại \"không thông báo kịp thời\" cho cơ quan quản lý để đính chính. Sự chậm trễ đính chính dữ liệu này bị xử phạt tiền bao nhiêu?", "options": {"A": "Từ 20.000.000 đồng đến 40.000.000 đồng", "B": "Từ 40.000.000 đồng đến 60.000.000 đồng", "C": "Từ 60.000.000 đồng đến 80.000.000 đồng", "D": "Từ 80.000.000 đồng đến 100.000.000 đồng"}, "answer": "C", "explanation": "<b>Giải thích học thuật:</b> (Lĩnh vực Hệ thống thông tin): Theo điểm c khoản 1 Điều 60 Nghị định 16/2022/NĐ-CP, nghĩa vụ của chủ thể cung cấp thông tin không chỉ dừng lại ở lần báo cáo đầu tiên. Trường hợp phát hiện sai sót nhưng \"Không thông báo kịp thời cho cơ quan quản lý hệ thống thông tin về nhà ở và thị trường bất động sản về những sai sót của thông tin, dữ liệu đã cung cấp\" thì tổ chức vi phạm vẫn sẽ chịu mức phạt nặng tương đương hành vi không báo cáo, cụ thể là từ 60.000.000 đồng đến 80.000.000 đồng."}, {"level": "1", "content": "Công ty nghiên cứu thị trường BĐS Sigma được cơ quan nhà nước có thẩm quyền cung cấp một số dữ liệu chuyên sâu về thị trường bất động sản phục vụ đề tài nghiên cứu chuyên đề. Tuy nhiên, Sigma đã tự ý sao chép và \"cung cấp cho một bên thứ ba\" (là một doanh nghiệp tư nhân khác) các dữ liệu này khi chưa được cơ quan nhà nước cho phép. Hành vi phát tán dữ liệu này của Sigma bị phạt tiền ở mức nào?", "options": {"A": "Từ 40.000.000 đồng đến 50.000.000 đồng", "B": "Từ 50.000.000 đồng đến 60.000.000 đồng", "C": "Từ 60.000.000 đồng đến 80.000.000 đồng", "D": "Từ 80.000.000 đồng đến 100.000.000 đồng"}, "answer": "C", "explanation": "<b>Giải thích học thuật:</b> (Lĩnh vực Hệ thống thông tin): Dữ liệu bất động sản do cơ quan nhà nước quản lý là tài nguyên thông tin có tính bảo mật nhất định. Căn cứ điểm d khoản 1 Điều 60 Nghị định 16/2022/NĐ-CP, hành vi tự ý \"Cung cấp cho bên thứ ba dữ liệu về nhà ở và thị trường bất động sản do cơ quan nhà nước có thẩm quyền cung cấp mà không được sự cho phép của cơ quan có thẩm quyền\" bị xử phạt tiền với mức từ 60.000.000 đồng đến 80.000.000 đồng đối với tổ chức."}];
        let quizData = [];
        let currentIndex = 0;

        window.onload = function() {
            try {
                if(!allData || allData.length === 0) {
                    document.getElementById("quiz-container").innerHTML = "<h3 style='color:red; text-align:center;'>Lỗi: Không có dữ liệu câu hỏi!</h3>";
                    return;
                }
                quizData = getSampledQuestions(100);
                renderQuestion();
            } catch(e) {
                alert("Lỗi khởi tạo hệ thống: " + e.message);
            }
        };

        function getSampledQuestions(count) {
            const shuffle = (arr) => arr.sort(() => Math.random() - 0.5);
            const filterLvl = (l) => allData.filter(q => String(q.level) === String(l));
            
            let p1 = shuffle(filterLvl("1")); let p2 = shuffle(filterLvl("2"));
            let p3 = shuffle(filterLvl("3")); let p4 = shuffle(filterLvl("4")); let p5 = shuffle(filterLvl("5"));

            let n1 = Math.round(count * 0.25); let n2 = Math.round(count * 0.25);
            let n3 = Math.round(count * 0.20); let n4 = Math.round(count * 0.20);
            let n5 = count - (n1 + n2 + n3 + n4);

            let selected = [ ...p1.splice(0, n1), ...p2.splice(0, n2), ...p3.splice(0, n3), ...p4.splice(0, n4), ...p5.splice(0, n5) ];

            if(selected.length < count) {
                let remain = shuffle([...p1, ...p2, ...p3, ...p4, ...p5]);
                selected = [...selected, ...remain.splice(0, count - selected.length)];
            }
            return shuffle(selected).slice(0, count);
        }

        function renderQuestion() {
            try {
                if (!quizData[currentIndex]) return;
                const q = quizData[currentIndex];
                
                // Nhận diện CHỌN NHIỀU ĐÁP ÁN cực kỳ an toàn
                let qContentLower = q.content ? q.content.toLowerCase() : "";
                const isMulti = (q.answer && q.answer.includes(",")) || qContentLower.includes("(chọn 2");
                const multiHint = isMulti ? "<span class='q-hint'>* Câu hỏi này yêu cầu chọn nhiều đáp án</span>" : "";
                
                document.getElementById("progress-text").innerText = `Câu ${currentIndex + 1} / ${quizData.length}`;
                
                let optHtml = "";
                let hasOptions = false;
                
                ['A','B','C','D'].forEach(lbl => {
                    if(q.options && q.options[lbl]) {
                        hasOptions = true;
                        optHtml += `
                            <label class="option-item" id="label-${lbl}">
                                <input type="${isMulti ? 'checkbox' : 'radio'}" name="q_opt" value="${lbl}" onchange="updateSelection()">
                                <b>${lbl}.</b> ${q.options[lbl]}
                            </label>`;
                    }
                });

                if(!hasOptions) {
                    optHtml = "<div style='color:red; background:#ffebee; padding:10px; border-radius:5px;'><i>⚠️ Lỗi: Không trích xuất được đáp án. (Kiểm tra lại tính năng đánh số tự động trong Word).</i></div>";
                }

                // Chống gãy chuỗi vì ký tự ngắt dòng
                let safeContent = q.content || "";
                safeContent = safeContent.split('\n').join('<br>');

                document.getElementById("quiz-container").innerHTML = `
                    <div class="card">
                        <div class="q-meta">MỨC ĐỘ THỬ THÁCH: ${q.level || '1'}</div>
                        <div class="q-text">${safeContent}</div>
                        ${multiHint}
                        <div class="options">${optHtml}</div>
                        
                        <button id="btn-check" class="btn-check-inline" onclick="checkAnswer()">Kiểm tra đáp án</button>
                        
                        <div id="exp-box" class="exp-box"></div>
                    </div>`;
                window.scrollTo(0,0);
            } catch(e) {
                alert("Lỗi hiển thị câu hỏi: " + e.message);
            }
        }

        function updateSelection() {
            document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
            document.querySelectorAll('input:checked').forEach(el => el.parentElement.classList.add('selected'));
        }

        function checkAnswer() {
            try {
                const q = quizData[currentIndex];
                const box = document.getElementById("exp-box");
                const btn = document.getElementById("btn-check");
                
                const checkedInputs = document.querySelectorAll('input[name="q_opt"]:checked');
                const selectedVals = Array.from(checkedInputs).map(i => i.value).sort().join(",");
                
                if (!selectedVals) {
                    alert("⚠️ Vui lòng chọn phương án trước khi kiểm tra!");
                    return;
                }

                btn.style.display = "none";
                box.style.display = "block";

                let resultTitle = "";
                if (selectedVals === q.answer) {
                    resultTitle = `<div class="result-title" style="color: var(--success);">✔ CHÍNH XÁC!</div>`;
                    box.style.borderLeftColor = "var(--success)";
                } else {
                    resultTitle = `<div class="result-title" style="color: var(--error);">✘ SAI RỒI! (Bạn chọn: ${selectedVals})</div>`;
                    box.style.borderLeftColor = "var(--error)";
                }

                ['A','B','C','D'].forEach(lbl => {
                    const el = document.getElementById(`label-${lbl}`);
                    if(!el) return;
                    
                    if(q.answer && q.answer.includes(lbl)) {
                        el.classList.add('correct-ans');
                    } else if(selectedVals.includes(lbl)) {
                        el.classList.add('wrong-ans');
                    }
                    
                    const input = el.querySelector('input');
                    if(input) input.disabled = true;
                });

                box.innerHTML = `
                    ${resultTitle}
                    <div style="margin-bottom:12px; font-size:1.05em;"><b>Đáp án đúng:</b> <span style="color:var(--success); font-weight:bold">${q.answer || "Không rõ"}</span></div>
                    <div>${q.explanation || "<i>Hệ thống chưa cập nhật giải thích cho câu này.</i>"}</div>
                `;

                box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } catch(e) {
                alert("Lỗi xử lý đáp án: " + e.message);
            }
        }

        function nextQ() { if(currentIndex < quizData.length-1) { currentIndex++; renderQuestion(); } }
        function prevQ() { if(currentIndex > 0) { currentIndex--; renderQuestion(); } }
    </script>
</body>
</html>
