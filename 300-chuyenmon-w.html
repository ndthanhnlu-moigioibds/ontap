    <script>
        const allData = [{"level": "1", "content": "Theo Luật kinh doanh bất động sản 2023 (hiệu lực 01/08/2024), điều kiện tiên quyết để một cá nhân được hành nghề môi giới bất động sản là gì?", "options": {"A": "Phải có bằng đại học chuyên ngành Luật hoặc Kinh tế.", "B": "Có ít nhất 5 năm kinh nghiệm.", "C": "Phải là thành viên của Hiệp hội bất động sản Việt Nam.", "D": "Có Chứng chỉ hành nghề môi giới bất động sản và phải làm việc trong một tổ chức kinh doanh dịch vụ bất động sản."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Yếu tố \"Hội nhập quốc tế\" ảnh hưởng đến nghề môi giới bất động sản Việt Nam chủ yếu ở khía cạnh nào?", "options": {"A": "Khiến mức phí hoa hồng giảm xuống.", "B": "Đòi hỏi nâng cao tính chuyên nghiệp, kỹ năng , hiểu biết luật pháp và thông lệ quốc tế để phục vụ khách hàng/đối tác nước ngoài.", "C": "Hạn chế vai trò của các sàn giao dịch bất động sản.", "D": "Làm giảm số lượng nhà môi giới bất động sản trong nước."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Nguyên tắc đạo đức \"Trung thành\" (Loyalty) của nhà môi giới bất động sản đối với khách hàng bị vi phạm trong trường hợp nào sau đây?", "options": {"A": "Môi giới nỗ lực đàm phán để đạt được các điều khoản có lợi nhất cho khách hàng của mình.", "B": "Môi giới đại diện người mua nhưng lại cố tình giới thiệu bất động sản giá cao hơn thị trường để nhận hoa hồng cao hơn từ người bán .", "C": "Môi giới từ chối tiết lộ thông tin tài chính cá nhân của người bán cho người mua.", "D": "Môi giới tư vấn cho người bán nên sửa chữa lại nhà trước khi bán để được giá tốt hơn."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Một cá nhân có Chứng chỉ hành nghề môi giới bất động sản nhưng không làm việc cho công ty nào, tự đứng ra nhận tiền của khách để tìm nhà giúp họ từ ngày 01/08/2024. Hành vi này có phù hợp với quy định mới không?", "options": {"A": "Không phù hợp, cá nhân phải hành nghề thông qua một tổ chức kinh doanh dịch vụ bất động sản.", "B": "Chỉ phù hợp nếu khách hàng đồng ý.", "C": "Hoàn toàn phù hợp vì đã có chứng chỉ.", "D": "Chỉ phù hợp nếu giao dịch giá trị thấp."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Điều kiện về \"cơ sở vật chất, kỹ thuật\" đối với doanh nghiệp kinh doanh dịch vụ môi giới bất động sản nhằm đảm bảo điều gì?", "options": {"A": "Doanh nghiệp phải có website riêng.", "B": "Doanh nghiệp có địa điểm hoạt động rõ ràng, có đủ trang thiết bị tối thiểu để phục vụ hoạt động nghiệp vụ và lưu trữ hồ sơ theo quy định.", "C": "Văn phòng phải thật sang trọng, hoành tráng.", "D": "Doanh nghiệp phải có ít nhất 10 máy tính."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Nguyên tắc \"Công bằng, minh bạch\" trong hoạt động môi giới đòi hỏi nhà môi giới bất động sản KHÔNG được làm điều gì?", "options": {"A": "Nỗ lực tìm kiếm Bất động sản phù hợp nhất với nhu cầu khách hàng.", "B": "Che giấu thông tin về một khoản phí mà khách hàng phải trả không được báo trước.", "C": "Cung cấp thông tin về quy hoạch cho người mua.", "D": "Giải thích rõ các điều khoản trong hợp đồng."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Việc Luật kinh doanh bất động sản Việt Nam công nhận và quy định về nghề môi giới bất động sản có ý nghĩa gì đối với sự phát triển của nghề?", "options": {"A": "Hạn chế sự phát triển của nghề.", "B": "Tạo cơ sở pháp lý chính thức, khẳng định vai trò xã hội, thúc đẩy sự chuyên nghiệp hóa và tạo điều kiện cho nghề phát triển một cách bài bản, có quản lý.", "C": "Không có ý nghĩa gì đáng kể.", "D": "Khiến việc hành nghề trở nên khó khăn hơn không cần thiết."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Tại sao nhà môi giới bất động sản cần có kiến thức về các yếu tố ảnh hưởng đến cung, cầu BĐS (kinh tế vĩ mô, tài chính, xã hội...)?", "options": {"A": "Để có thể phân tích, dự báo xu hướng thị trường, từ đó tư vấn chiến lược phù hợp cho khách hàng", "B": "Để có chuyện nói với khách hàng.", "C": "Để có thể tự đầu tư Bất động sản hiệu quả hơn.", "D": "Chỉ để phục vụ việc thi lấy chứng chỉ."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Việc nhà môi giới bất động sản từ chối tham gia vào một giao dịch có dấu hiệu rửa tiền, mặc dù có thể mang lại hoa hồng rất lớn, thể hiện việc tuân thủ nguyên tắc nào?", "options": {"A": "Nguyên tắc công khai, minh bạch.", "B": "Nguyên tắc hoạt động dựa trên chuyên môn.", "C": "Nguyên tắc lấy lợi ích khách hàng làm định hướng.", "D": "Nguyên tắc tuân thủ pháp luật và đạo đức nghề nghiệp."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Sự phát triển của các nền tảng công nghệ bất động sản (Proptech) tại Việt Nam ảnh hưởng đến vai trò của nhà môi giới bất động sản truyền thống như thế nào?", "options": {"A": "Không ảnh hưởng gì đáng kể.", "B": "Chỉ làm tăng chi phí hoạt động cho nhà môi giới bất động sản.", "C": "Tạo ra cả thách thức và cơ hội cho nghề môi giới.", "D": "Hoàn toàn thay thế vai trò của nhà môi giới bất động sản."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Nguyên tắc \"Hoạt động dựa trên nền tảng kiến thức chuyên môn và kinh nghiệm\" đòi hỏi nhà môi giới bất động sản phải làm gì liên tục?", "options": {"A": "Chỉ dựa vào kinh nghiệm cá nhân đã có.", "B": "Chỉ cần có chứng chỉ hành nghề là đủ.", "C": "Luôn học hỏi, cập nhật kiến thức mới về thị trường, pháp luật, công nghệ và trau dồi kỹ năng nghiệp vụ.", "D": "Thường xuyên thay đổi lĩnh vực hoạt động."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Việc thành lập Sàn giao dịch Bất động sản ở Việt Nam có yêu cầu gì khác biệt cơ bản so với thành lập một doanh nghiệp môi giới thông thường?", "options": {"A": "Phải đăng ký hoạt động với Sở Xây dựng, đáp ứng điều kiện khắt khe hơn về", "B": "Chỉ được phép giao dịch BĐS hình thành trong tương lai.", "C": "Không cần người có chứng chỉ môi giới.", "D": "Không được phép thu hoa hồng môi giới."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Tại sao nguyên tắc đạo đức \"Không phân biệt đối xử\" lại quan trọng trong hoạt động môi giới bất động sản?", "options": {"A": "Đảm bảo sự công bằng trong việc cung cấp dịch vụ, tuân thủ pháp luật về chống phân biệt đối xử và xây dựng hình ảnh nhân văn, chuyên nghiệp cho nghề.", "B": "Giúp nhà môi giới bất động sản dễ dàng định giá bất động sản hơn.", "C": "Chỉ áp dụng khi làm việc với khách hàng nước ngoài.", "D": "Giúp nhà môi giới bất động sản có nhiều khách hàng hơn."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Yếu tố \"Lợi nhuận hấp dẫn\" ảnh hưởng đến sự phát triển nghề môi giới bất động sản như thế nào?", "options": {"A": "Chỉ có tác động tiêu cực, làm nhiều người thiếu năng lực tham gia.", "B": "Không ảnh hưởng gì đến sự phát triển của nghề.", "C": "Chỉ ảnh hưởng đến các nhà môi giới bất động sản làm việc độc lập.", "D": "Là động lực thu hút nhân lực tham gia vào nghề, nhưng cũng đòi hỏi phải có cơ chế quản lý, đào tạo và đạo đức để đảm bảo sự phát triển bền vững, chuyên nghiệp."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Nếu nhà môi giới bất động sản không có Chứng chỉ hành nghề mà vẫn thực hiện hoạt động môi giới và thu phí, họ có thể đối mặt với hậu quả pháp lý nào?", "options": {"A": "Chỉ bị khách hàng nhắc nhở.", "B": "Không có hậu quả gì nếu khách hàng không khiếu nại.", "C": "Được phép tiếp tục hành nghề nếu nộp phạt.", "D": "Bị xử phạt vi phạm hành chính theo quy định của pháp luật về kinh doanh Bất"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Việc nhà môi giới bất động sản chủ động tham gia các khóa đào tạo liên tục mang lại lợi ích kép là gì?", "options": {"A": "Chỉ tốn kém chi phí và thời gian.", "B": "Vừa đáp ứng yêu cầu pháp lý/nghề nghiệp để duy trì quyền hành nghề, vừa giúp cập nhật kiến thức, nâng cao kỹ năng và năng lực cạnh tranh.", "C": "Chỉ giúp mở rộng mối quan hệ.", "D": "Chỉ để đáp ứng yêu cầu gia hạn giấy phép/chứng chỉ."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Tình huống: Một sàn giao dịch bất động sản không công khai thông tin về chủ đầu tư và tình trạng pháp lý của dự án đang bán trên website của mình. Hành vi này vi phạm nguyên tắc nào?", "options": {"A": "Nguyên tắc Công khai, minh bạch.", "B": "Nguyên tắc Tuân thủ pháp luật.", "C": "Cả A và B.", "D": "Không vi phạm nguyên tắc nào."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Trong các yếu tố ảnh hưởng gián tiếp đến sự phát triển nghề môi giới bất động sản, yếu tố nào phản ánh khả năng chi trả và quyết định mua bất động sản của người dân rõ rệt nhất?", "options": {"A": "Số lượng dự án bất động sản mới được cấp phép.", "B": "Sức mua, thu nhập bình quân và khả năng tiếp cận tín dụng.", "C": "Chi phí xây dựng.", "D": "Chính sách quy hoạch đô thị."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Vai trò \"Khai thác nguồn thu cho ngân sách nhà nước\" của hoạt động môi giới thể hiện như thế nào?", "options": {"A": "Nhà môi giới bất động sản tư vấn cho khách hàng cách tránh thuế.", "B": "Hoạt động môi giới thúc đẩy các giao dịch bất động sản diễn ra thành công và hợp pháp, từ đó tạo cơ sở cho việc thu các loại thuế, phí liên quan đến giao dịch đó.", "C": "Nhà môi giới bất động sản phải đóng góp một phần hoa hồng cho nhà", "D": "Nhà môi giới bất động sản trực tiếp thu thuế thay nhà nước."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Tình huống: Nhà môi giới bất động sản A được người bán ủy thác bán nhà. Sau đó, chính môi giới A lại muốn mua căn nhà đó. Để đảm bảo đạo đức và tránh xung đột lợi ích, môi giới A cần làm gì?", "options": {"A": "Tự mình mua với giá thấp hơn thị trường vì đang là người môi giới.", "B": "Nhờ người nhà đứng tên mua hộ để che giấu.", "C": "Vừa đóng vai trò môi giới vừa là người mua để tự thương lượng giá.", "D": "Thông báo rõ ràng ý định muốn mua của mình cho người bán, từ bỏ vai trò môi giới đại diện cho người bán trong giao dịch này và tiến hành mua bán một cách công bằng như một người mua thông thường (có thể cần bên thứ ba hỗ trợ)."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Yếu tố \"Sự chuyển đổi cơ cấu kinh tế - xã hội\" (ví dụ: từ nông nghiệp sang công nghiệp, dịch vụ) ảnh hưởng đến nhu cầu loại hình bất động sản nào nhiều nhất?", "options": {"A": "Gần như không ảnh hưởng đến thị trường bất động sản.", "B": "Chỉ ảnh hưởng đến bất động sản ở khu vực nông thôn.", "C": "Chỉ ảnh hưởng đến nhu cầu đất nông nghiệp.", "D": "Tạo ra và thay đổi mạnh mẽ nhu cầu đối với các loại hình bất động sản khác nhau."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Yếu tố nào sau đây KHÔNG phải là vai trò trực tiếp của nhà môi giới bất động sản chuyên nghiệp?", "options": {"A": "Quyết định phê duyệt quy hoạch đô thị.", "B": "Cung cấp thông tin thị trường.", "C": "Thúc đẩy giao dịch thành công", "D": "Tư vấn về quy trình, thủ tục pháp lý cơ bản."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Tình huống: Một sàn giao dịch BĐS bị khách hàng khiếu nại về việc nhân viên tư vấn sai thông tin pháp lý dẫn đến thiệt hại. Ai sẽ là người chịu trách nhiệm chính trước khách hàng và pháp luật?", "options": {"A": "Sàn giao dịch BĐS (pháp nhân kinh doanh) và người đại diện theo pháp luật/người quản lý sàn phải chịu trách nhiệm về hoạt động của nhân viên thuộc quyền quản lý của mình.", "B": "Chỉ cá nhân nhân viên tư vấn đó.", "C": "Khách hàng phải tự chịu trách nhiệm vì đã tin lời tư vấn.", "D": "Hiệp hội Bất động sản."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Yếu tố \"sự phát triển của thị trường tài chính\" ảnh hưởng đến nghề môi giới bất động sản như thế nào?", "options": {"A": "Tạo điều kiện cho người mua dễ dàng tiếp cận vốn vay hơn, thúc đẩy cầu bất động sản; đồng thời cũng tạo ra các sản phẩm đầu tư bất động sản phức tạp hơn đòi hỏi sự tư vấn chuyên sâu từ môi giới.", "B": "Khiến việc định giá bất động sản trở nên dễ dàng hơn.", "C": "Chỉ ảnh hưởng đến các nhà đầu tư lớn.", "D": "Làm giảm nhu cầu về dịch vụ môi giới."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Nguyên tắc đạo đức nào bị vi phạm khi nhà môi giới bất động sản tiết lộ cho đối thủ cạnh tranh biết về chiến lược marketing hoặc danh sách khách hàng tiềm năng của công ty mình?", "options": {"A": "Nguyên tắc Chuyên môn và Trách nhiệm.", "B": "Nguyên tắc Tuân thủ pháp luật.", "C": "Nguyên tắc Trung thành (với công ty/người sử dụng lao động) và Bảo mật thông tin kinh doanh.", "D": "Nguyên tắc Công bằng, minh bạch."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Yếu tố nào sau đây KHÔNG ảnh hưởng trực tiếp đến mức phí hoa hồng môi giới bất động sản?", "options": {"A": "Mức độ phức tạp của giao dịch và công sức của nhà môi giới bất động sản.", "B": "Tỷ lệ hoa hồng thỏa thuận trong hợp đồng dịch vụ.", "C": "Tình trạng pháp lý của nhà môi giới bất động sản (có chứng chỉ hay không).", "D": "Giá trị của bất động sản giao dịch."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Yếu tố nào là quan trọng nhất đảm bảo sự thành công lâu dài của một Sàn giao dịch bất động sản tại Việt Nam?", "options": {"A": "Mức phí thu từ các nhà môi giới bất động sản thành viên thật cao.", "B": "Chỉ niêm yết các bất động sản giá rẻ.", "C": "Vị trí văn phòng thật đẹp.", "D": "Xây dựng được uy tín, nguồn hàng phong phú, đa dạng, đội ngũ môi giới chuyên nghiệp và quy trình hoạt động minh bạch, hiệu quả."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Việc nhà môi giới bất động sản phải \"hành động trong khuôn khổ được ủy quyền trong hợp đồng môi giới\" có nghĩa là gì?", "options": {"A": "Có thể tự quyết định thay đổi giá bán mà không cần hỏi khách hàng.", "B": "Được phép làm mọi thứ để bán được nhà.", "C": "Chỉ được thực hiện những công việc, hành động đã được khách hàng đồng ý và ghi rõ trong phạm vi thỏa thuận của hợp đồng dịch vụ.", "D": "Phải luôn xin ý kiến khách hàng cho từng hành động nhỏ."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Tình huống: Doanh nghiệp môi giới bất động sản C thường xuyên tổ chức các buổi đào tạo nội bộ về kỹ năng mềm cho nhân viên. Việc này mang lại lợi ích gì trực tiếp nhất?", "options": {"A": "Tăng chi phí đào tạo cho công ty.", "B": "Nâng cao khả năng tương tác, thuyết phục khách hàng và xử lý tình huống của nhân viên, từ đó cải thiện tỷ lệ chốt giao dịch và sự hài lòng của khách hàng.", "C": "Giúp nhân viên có thêm bằng cấp.", "D": "Giảm thời gian nhân viên đi gặp khách hàng."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Tại sao nói hoạt động môi giới bất động sản góp phần \"thúc đẩy đổi mới chính sách quản lý bất động sản\"?", "options": {"A": "Vì nhà môi giới bất động sản trực tiếp tham gia soạn thảo luật.", "B": "Vì các vướng mắc, bất cập phát sinh trong thực tế hoạt động môi giới là nguồn thông tin phản hồi quan trọng để cơ quan quản lý xem xét, điều chỉnh chính sách cho phù hợp hơn.", "C": "Vì hoạt động môi giới làm giảm vai trò của cơ quan quản lý.", "D": "Vì nhà môi giới bất động sản luôn yêu cầu thay đổi chính sách."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Việc một nhà môi giới bất động sản chủ động tư vấn cho khách hàng về các rủi ro tiềm ẩn của một bất động sản (thay vì chỉ nói về ưu điểm) thể hiện điều gì?", "options": {"A": "Sự thiếu tự tin vào khả năng bán hàng.", "B": "Mong muốn làm nản lòng khách hàng.", "C": "Sự thiếu hiểu biết về marketing.", "D": "Tính chuyên nghiệp, trung thực và đặt lợi ích lâu dài của khách hàng lên trên việc chốt giao dịch bằng mọi giá."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Có mấy loại hợp đồng kinh doanh bất động sản theo Luật kinh doanh bất động sản hiện hành?", "options": {"A": "04 loại.", "B": "10 loại.", "C": "11 loại.", "D": "12 loại."}, "answer": "C,D", "explanation": ""}, {"level": "1", "content": "Đâu KHÔNG phải là nguồn cung cấp thông tin trực tiếp về bất động sản đang chào bán?", "options": {"A": "Người dân treo biển \"Bán nhà\".", "B": "Chủ đầu tư dự án.", "C": "Báo cáo phân tích thị trường của công ty tư vấn.", "D": "Sàn giao dịch bất động sản nhận ký gửi."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Yếu tố nào sau đây ảnh hưởng trực tiếp đến nguồn cung bất động sản?", "options": {"A": "Chính sách về quy hoạch sử dụng đất.", "B": "Lãi suất cho vay mua nhà của ngân hàng.", "C": "Thu nhập bình quân của người dân.", "D": "Tỷ lệ đô thị hóa."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Khi thu thập thông tin về một bất động sản, yếu tố \"Hướng nhà\" thuộc nhóm thông tin nào?", "options": {"A": "Lịch sử - Xã hội", "B": "Pháp lý", "C": "Tài chính", "D": "Kinh tế - Kỹ thuật"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Tìm kiếm khách hàng thông qua việc gọi điện thoại trực tiếp đến các khách hàng tiềm năng thuộc phương pháp thu thập thông tin về cầu bất động sản nào?", "options": {"A": "Thụ động", "B": "Ngẫu nhiên", "C": "Gián tiếp", "D": "Chủ động"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Mục đích chính của việc lập Hồ sơ thương vụ môi giới là gì?", "options": {"A": "Để tính toán chi phí hoạt động của nhà môi giới.", "B": "Để lưu trữ thông tin, theo dõi tiến độ và làm bằng chứng pháp lý.", "C": "Để xác định giá trị bất động sản.", "D": "Để quảng cáo bất động sản hiệu quả hơn."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Nhà môi giới có nên giữ bản gốc Giấy chứng nhận (Sổ hồng /Sổ đỏ) của khách hàng không?", "options": {"A": "Nên giữ và giao cho ngân hàng nếu khách hàng vay vốn.", "B": "Tuyệt đối không nên giữ, chỉ xem, sao chụp và hoàn trả ngay.", "C": "Nên giữ để đảm bảo khách hàng không bán cho người khác.", "D": "Chỉ nên giữ khi khách hàng yêu cầu."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Hợp đồng Dịch vụ Môi giới Bất động sản là thỏa thuận giữa ai với ai?", "options": {"A": "Giữa nhà môi giới và cơ quan quản lý nhà nước.", "B": "Giữa nhà môi giới/công ty môi giới và khách hàng.", "C": "Giữa nhà môi giới và ngân hàng cho vay.", "D": "Giữa người mua và người bán."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Việc đăng ký thế chấp quyền sử dụng đất tại cơ quan nhà nước có thẩm quyền nhằm mục đích gì?", "options": {"A": "Để làm thủ tục cấp Sổ hồng (GCN) mới.", "B": "Để công khai hóa việc tài sản đang được dùng làm bảo đảm và có giá trị pháp lý với người thứ ba.", "C": "Để xác định giá trị bất động sản.", "D": "Để tính thuế sử dụng đất."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Bước đầu tiên trong quy trình thực hiện thương vụ môi giới bất động sản là gì?", "options": {"A": "Đàm phán giá cả.", "B": "Ký hợp đồng đặt cọc.", "C": "Tìm kiếm, tiếp nhận và chuẩn bị thông tin.", "D": "Bàn giao Bất động sản."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Kỹ năng nào là nền tảng quan trọng nhất để thấu hiểu nhu cầu khách hàng?", "options": {"A": "Kỹ năng trình bày.", "B": "Kỹ năng quản lý thời gian.", "C": "Kỹ năng đàm phán.", "D": "Kỹ năng lắng nghe chủ động."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Đơn giá bán căn hộ chung cư trên m2 được hiểu là?", "options": {"A": "Giá theo tổng m2 phủ bì căn hộ.", "B": "Giá theo tổng m2 phủ bì căn hộ, nhưng trừ diện tích các cột và hộp kỹ thuật.", "C": "Giá theo tổng m2 thông thủy của căn hộ.", "D": "Giá theo tổng m2 tim tường của căn hộ."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Tại sao cần tập trung trình bày \"lợi ích\" thay vì chỉ \"đặc tính\" của bất động sản?", "options": {"A": "Vì lợi ích dễ nhớ hơn đặc tính.", "B": "Vì khách hàng mua bất động sản vì những giá trị, giải pháp mà bất động sản mang lại cho họ, chứ không chỉ vì bản thân đặc tính đó.", "C": "Vì đặc tính bất động sản thường khó mô tả.", "D": "Vì trình bày lợi ích giúp tăng giá bán bất động sản."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Nguyên tắc cơ bản nhất khi xử lý phản đối của khách hàng là gì?", "options": {"A": "Lắng nghe, đồng cảm, làm rõ vấn đề và giải đáp bằng thông tin khách quan.", "B": "Tranh luận để chứng minh khách hàng sai.", "C": "Giảm giá ngay lập tức để khách hàng hài lòng.", "D": "Phớt lờ lời phản đối và tiếp tục trình bày."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Kênh giao tiếp nào phù hợp nhất để thảo luận các vấn đề phức tạp, nhạy cảm trong giao dịch bất động sản?", "options": {"A": "Bình luận trên mạng xã hội.", "B": "Email.", "C": "Gặp mặt trực tiếp.", "D": "Tin nhắn Zalo/SMS."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Nguyên tắc quan trọng nhất trong quản lý thông tin khách hàng là gì?", "options": {"A": "Bảo mật thông tin cá nhân và giao dịch của khách hàng.", "B": "Chỉ lưu trữ thông tin khách hàng trong thời gian ngắn.", "C": "Sử dụng thông tin khách hàng để quảng cáo cho sản phẩm khác.", "D": "Chia sẻ thông tin rộng rãi để nhiều người biết."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Mục tiêu lý tưởng nhất trong đàm phán bất động sản là mô hình kết quả nào?", "options": {"A": "Lose - Win (Thua - Thắng)", "B": "Win - Lose (Thắng - Thua)", "C": "Lose - Lose (Cùng thua)", "D": "Win - Win (Cùng thắng)"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Khi người bán muốn giá 2 tỷ, người mua trả 1.9 tỷ, chiến thuật nào KHÔNG phù hợp để môi giới thu hẹp khoảng cách?", "options": {"A": "Nhấn mạnh vào điểm yếu của bất động sản để ép người bán giảm giá sâu hơn", "B": "Phân tích chi phí cơ hội nếu không đạt được thỏa thuận cho cả hai bên.", "C": "Đề xuất chia đôi khoảng chênh lệch (mỗi bên nhích 50 triệu).", "D": "Tìm kiếm các yếu tố phi giá cả để thương lượng (nội thất, thời gian bàn giao...)."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Trong đàm phán, việc tập trung vào \"lợi ích\" thay vì \"lập trường\" có nghĩa là gì?", "options": {"A": "Chỉ quan tâm đến lợi ích của mình.", "B": "Tìm hiểu lý do sâu xa đằng sau yêu cầu của mỗi bên để tìm giải pháp đáp ứng nhu cầu thực sự.", "C": "Luôn giữ vững quan điểm ban đầu của mình.", "D": "Ưu tiên các yếu tố tài chính hơn các yếu tố khác."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Tâm lý chung của khách hàng mua căn hộ lần đầu tiên là", "options": {"A": "Sợ rằng rủi ro tài chính sẽ rất lớn", "B": "Tìm hiểu thông tin liên quan rất kỹ", "C": "Cả A và B đều đúng", "D": "Cả A và B đều sai"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Khi xây dựng chiến lược kinh doanh cho văn phòng môi giới, việc phân tích đối thủ cạnh tranh KHÔNG nhằm mục đích gì?", "options": {"A": "Xác định lợi thế cạnh tranh của văn phòng mình.", "B": "Sao chép hoàn toàn mô hình kinh doanh của đối thủ.", "C": "Xây dựng chiến lược giá và dịch vụ phù hợp.", "D": "Hiểu điểm mạnh, điểm yếu của đối thủ."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Có mấy loại hợp đồng kinh doanh dịch vụ bất động sản theo Luật kinh doanh bất động sản hiện hành?", "options": {"A": "5 loại", "B": "4 loại", "C": "6 loại", "D": "11 loại"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Điều khoản nào bắt buộc phải có trong Hợp đồng Dịch vụ Môi giới bất động sản?", "options": {"A": "Lịch trình thanh toán tiền mua bất động sản.", "B": "Chữ ký của công chứng viên.", "C": "Mô tả chi tiết nội thất bất động sản.", "D": "Mức phí, thù lao môi giới và điều kiện thanh toán."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Để phòng ngừa rủi ro bất động sản bị giả mạo giấy tờ (sổ giả), biện pháp nào hiệu quả nhất?", "options": {"A": "Yêu cầu người bán cung cấp bản photo sổ.", "B": "Chỉ tin vào lời nói của người bán.", "C": "So sánh sổ với sổ của hàng xóm.", "D": "Đối chiếu thông tin sổ với cơ sở dữ liệu của văn phòng đăng ký đất đai hoặc yêu cầu công chứng viên kiểm tra kỹ."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Rủi ro quy hoạch trong giao dịch bất động sản là gì?", "options": {"A": "Bên bán không bàn giao nhà đúng hẹn.", "B": "Bất động sản nằm trong khu vực dự kiến bị thu hồi đất hoặc thay đổi chức Năng sử dụng theo quy hoạch của nhà nước.", "C": "Diện tích thực tế của bất động sản nhỏ hơn trên giấy tờ.", "D": "Bất động sản bị tranh chấp về quyền sở hữu."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Việc bên mua không thanh toán đúng hạn theo thỏa thuận trong hợp đồng thuộc loại rủi ro nào?", "options": {"A": "Rủi ro quy hoạch.", "B": "Rủi ro bàn giao.", "C": "Rủi ro thanh toán.", "D": "Rủi ro pháp lý dự án."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Tình huống: Căn nhà giao dịch với giá 500 triệu đồng. Ngân hàng định giá 420 triệu đồng và Ngân hàng cho vay 70% giá trị của BĐS, vậy số tiền Ngân hàng cho vay là:", "options": {"A": "216 triệu đồng.", "B": "294 triệu đồng", "C": "324 triệu đồng.", "D": "350 triệu đồng."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Nhà môi giới nên làm gì khi khách hàng đưa ra một mức giá đề nghị (offer) thấp hơn đáng kể so với giá chào bán?", "options": {"A": "Chấp nhận ngay để nhanh chóng chốt giao dịch.", "B": "Tự ý nâng giá đề nghị của khách hàng lên khi báo cho bên bán.", "C": "Tiếp nhận đề nghị một cách chuyên nghiệp, trình bày lại cho bên bán và hỗ trợ quá trình thương lượng.", "D": "Từ chối ngay lập tức và không làm việc với khách hàng đó nữa."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Kỹ thuật đặt câu hỏi phễu (Funneling) được áp dụng như thế nào?", "options": {"A": "Bắt đầu bằng câu hỏi tổng quát, sau đó đi sâu vào chi tiết bằng các câu hỏi cụ thể hơn.", "B": "Chỉ đặt các câu hỏi mở.", "C": "Chỉ đặt các câu hỏi đóng.", "D": "Đặt các câu hỏi không liên quan để đánh lạc hướng."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Nếu một bất động sản đang được thế chấp tại ngân hàng, người bán có được quyền bán bất động sản đó không?", "options": {"A": "Không được phép bán trong mọi trường hợp.", "B": "Chỉ được bán nếu người mua đồng ý trả nợ thay.", "C": "Chỉ được bán sau khi đã trả hết nợ ngân hàng.", "D": "Được phép bán nếu có sự đồng ý của ngân hàng nhận thế chấp và thực hiện thủ tục giải chấp hoặc chuyển nợ theo quy định."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Hợp đồng nào sau đây không phải là hợp đồng kinh doanh bất động sản:", "options": {"A": "Hợp đồng mua bán nhà, công trình xây dựng.", "B": "Hợp đồng thuê mua nhà, công trình xây dựng.", "C": "Hợp đồng quản lý BĐS.", "D": "Hợp đồng chuyển nhượng, cho thuê, cho thuê lại quyền sử dụng đất"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Khi làm việc với khách hàng mua là nhà đầu tư \"lướt sóng\", nhà môi giới cần tập trung tư vấn vào yếu tố nào?", "options": {"A": "Lịch sử lâu đời và yếu tố tâm linh của BĐS.", "B": "Sự yên tĩnh và không gian xanh của khu vực.", "C": "Tính thanh khoản cao và khả năng tăng giá trong ngắn hạn.", "D": "Thiết kế nội thất đẹp và sang trọng."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Một nhà môi giới và khách hàng của anh ta đang đàm phán thỏa thuận mua một bất động sản tại Hà Nội. Họ đã thực hiện xong công tác tiếp xúc, thăm dò đối tác, lập các phương án thỏa thuận mua bán, xác định chiến lược đàm phán với người bán bất động sản này. Họ thậm chí đã đàm phán thử với đối tác nhưng chưa mang lại kết quả. Bước nào họ nên thực hiện tiếp theo?", "options": {"A": "Rút kinh nghiệm và tiến hành các bước tiếp xúc, thăm dò đối tác lại.", "B": "Tiến hành đàm phán hợp nhất: Thảo luận về các mục tiêu chung và các mục", "C": "Đàm phán phân bổ: Trình bày quan điểm yêu cầu của mình và lắng nghe đối tác trình bày quan điểm của họ.", "D": "Chuẩn bị các hợp đồng đã soạn thảo sẵn để đưa ra đàm phán lại."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "\"Chiến thuật cộng trong đàm phán\" dựa trên việc nêu bật yếu tố nào?", "options": {"A": "Những ưu điểm, giá trị độc đáo của bất động sản, tiềm năng tăng giá.", "B": "Những khiếm khuyết, lỗi của bất động sản.", "C": "Tình hình thị trường đang đi xuống.", "D": "Khả năng tài chính hạn chế của người mua."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Vai trò của nhà môi giới KHÔNG bao gồm việc nào sau đây?", "options": {"A": "Tư vấn về quy trình, thủ tục giao dịch.", "B": "Cung cấp thông tin thị trường cho khách hàng.", "C": "Đưa ra quyết định cuối cùng thay cho khách hàng.", "D": "Hỗ trợ khách hàng trong quá trình đàm phán."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Trong thời hạn bao nhiêu ngày kể từ ngày bàn giao nhà, công trình xây dựng cho người mua, thì chủ đầu tư phải làm thủ tục để cơ quan Nhà nước có thẩm quyền cấp giấy chứng nhận quyền sử dụng đất, quyền sở hữu nhà ở và các tài sản khác gắn liền với đất cho bên mua?", "options": {"A": "20 ngày.", "B": "30 ngày.", "C": "50 ngày.", "D": "90 ngày."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "\"Chiến thuật trừ trong đàm phán\" hiệu quả nhất khi nào?", "options": {"A": "Khi người bán không cần bán gấp.", "B": "Khi bất động sản hoàn hảo không có điểm yếu.", "C": "Khi thị trường đang rất sôi động, giá tăng mạnh.", "D": "Khi có thể chỉ ra những điểm yếu khách quan của bất động sản hoặc dẫn chứng"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Khi dẫn khách xem nhà, nếu khách hàng im lặng, ít đưa ra nhận xét, nhà môi giới nên làm gì?", "options": {"A": "Giả định rằng khách hàng không thích và nhanh chóng chuyển sang bất động sản khác.", "B": "Cũng im lặng và chờ đợi.", "C": "Chủ động đặt câu hỏi gợi mở, khơi gợi câu chuyện về sở thích, mối quan tâm của họ để phá vỡ sự im lặng và tìm hiểu nhu cầu.", "D": "Nói liên tục về các đặc điểm của bất động sản."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Đâu là dấu hiệu cho thấy một cuộc đàm phán đang có nguy cơ đi vào bế tắc?", "options": {"A": "Các bên đồng ý tạm dừng để suy nghĩ thêm.", "B": "Cả hai bên đều đưa ra nhiều phương án thay thế.", "C": "Các bên tập trung thảo luận về các chi tiết nhỏ.", "D": "Các bên không còn đưa ra nhượng bộ nào và giữ vững lập trường đối lập."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Yếu tố nào sau đây KHÔNG phải là mục tiêu chính của hoạt động marketing BĐS?", "options": {"A": "Tăng nhận diện thương hiệu cho môi giới/sàn.", "B": "Hoàn thiện thủ tục pháp lý cho giao dịch.", "C": "Thúc đẩy giao dịch thành công.", "D": "Thu hút khách hàng tiềm năng."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Trong hợp đồng dịch vụ môi giới, điều khoản về \"thời hạn hợp đồng\" quy định điều gì?", "options": {"A": "Thời gian nhà môi giới được phép cung cấp dịch vụ và hưởng hoa hồng theo thỏa thuận", "B": "Thời gian khách hàng được phép xem bất động sản.", "C": "Thời gian tối đa để bán được bất động sản.", "D": "Thời gian khách hàng phải thanh toán phí."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Theo quy định hiện hành thì cơ quan quản lý Nhà nước nào có thẩm quyền cấp chứng chỉ hành nghề Môi giới Bất động sản?", "options": {"A": "UBND cấp tỉnh", "B": "Bộ Xây dựng.", "C": "Sở Xây dựng.", "D": "Sở Nông Nghiệp & Môi trường."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Khi khách hàng có nhiều lựa chọn bất động sản và tỏ ra phân vân, nhà môi giới nên làm gì?", "options": {"A": "Giúp khách hàng hệ thống hóa lại các ưu nhược điểm của từng lựa chọn dựa trên nhu cầu của họ, tập trung vào các yếu tố quan trọng nhất để hỗ trợ ra quyết định.", "B": "Thúc ép khách hàng chọn đại một căn.", "C": "Bỏ mặc khách hàng tự quyết định.", "D": "Đưa thêm thật nhiều lựa chọn khác nữa."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Đạo đức nghề nghiệp của Nhà môi giới Bất động sản?", "options": {"A": "Tuân thủ pháp luật.", "B": "Cung cấp thông tin trung thực về Bất động sản.", "C": "Đặt lợi ích của khách hàng lên trên hết.", "D": "Cả A, B, C đều đúng."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Kỹ năng nào giúp nhà môi giới trình bày thông tin phức tạp một cách dễ hiểu cho khách hàng?", "options": {"A": "Kỹ năng đàm phán.", "B": "Kỹ năng định giá bất động sản.", "C": "Kỹ năng quản lý thời gian.", "D": "Kỹ năng sử dụng ngôn ngữ đơn giản, ví dụ minh họa và chia nhỏ thông tin."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Khi nhận được thông tin phản hồi tiêu cực từ khách hàng sau khi xem nhà, nhà môi giới nên làm gì?", "options": {"A": "Bỏ qua và không quan tâm.", "B": "Tranh cãi với khách hàng để bảo vệ BĐS.", "C": "Đổ lỗi cho khách hàng khó tính.", "D": "Lắng nghe cẩn thận, tìm hiểu rõ lý do không hài lòng, cảm ơn phản hồi và sử dụng thông tin đó để tìm BĐS phù hợp hơn hoặc tư vấn lại cho bên bán."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Việc nhà môi giới chủ động đề xuất các giải pháp tài chính () cho khách hàng mua thể hiện kỹ năng gì?", "options": {"A": "Kỹ năng cung cấp dịch vụ hỗ trợ và gia tăng giá trị.", "B": "Kỹ năng đàm phán.", "C": "Kỹ năng định giá.", "D": "Kỹ năng quản lý rủi ro."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Trong hợp đồng mua bán bất động sản, tại sao cần mô tả chi tiết bất động sản (địa chỉ, diện tích, số thửa...)?", "options": {"A": "Chỉ là thủ tục hình thức.", "B": "Để xác định chính xác đối tượng của hợp đồng, tránh nhầm lẫn và tranh chấp.", "C": "Để cơ quan thuế dễ tính thuế.", "D": "Để làm tăng giá trị hợp đồng."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Rủi ro nào có thể phát sinh nếu mua bất động sản thông qua hợp đồng ủy quyền không hợp lệ?", "options": {"A": "Người mua phải trả thêm thuế.", "B": "Bất động sản bị giảm giá trị.", "C": "Giao dịch có thể bị tuyên vô hiệu, người mua mất tiền và không có quyền sở hữu.", "D": "Không có rủi ro nào đáng kể."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Khi soạn thảo điều khoản về phí hoa hồng trong Hợp đồng Dịch vụ Môi giới, cần lưu ý điều gì nhất?", "options": {"A": "Để trống phần phí hoa hồng.", "B": "Ghi mức phí càng cao càng tốt.", "C": "Ghi mức phí một cách rõ ràng và quy định cụ thể thời điểm, điều kiện thanh toán phí.", "D": "Chỉ cần ghi chung chung \"theo thỏa thuận\"."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Những biểu hiện nào sau đây cho phép xác định đối tượng khách hàng của bạn là “khách hàng thụ động”?", "options": {"A": "Dễ chịu, tươi cười, tế nhị, không thích bị ép.", "B": "Né tránh, sợ bị gạt, không dám quyết định một mình.", "C": "Có vẻ không đồng ý, hơi nghi ngờ, hay so sánh với sản phẩm khác của đối thủ.", "D": "Tươi cười, xởi lởi, tỏ vẻ quan tâm."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Nghĩa vụ của doanh nghiệp kinh doanh dịch vụ môi giới bất động sản?", "options": {"A": "Yêu cầu khách hàng cung cấp hồ sơ, thông tin về bất động sản.", "B": "Hưởng thù lao, hoa hồng môi giới theo thỏa thuận trong hợp đồng đã ký với", "C": "Thuê doanh nghiệp kinh doanh dịch vụ môi giới bất động sản, cá nhân kinh", "D": "Cung cấp hồ sơ, thông tin về bất động sản do mình môi giới và chịu trách nhiệm về hồ sơ, thông tin do mình cung cấp."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Khi phân tích nguồn cung bất động sản, yếu tố \"tốc độ tăng trưởng và suy thoái của từng loại BĐS\" phản ánh điều gì rõ nhất?", "options": {"A": "Chu kỳ của thị trường bất động sản và tâm lý đầu tư.", "B": "Chính sách tín dụng của ngân hàng.", "C": "Chi phí xây dựng hiện tại.", "D": "Mật độ dân số khu vực."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Hành động nào sau đây bị nhà nước thu hồi chứng chỉ hành nghề môi giới bất động sản:", "options": {"A": "Cho người khác mượn, thuê chứng chỉ để hành nghề.", "B": "Người được cấp chứng chỉ kê khai trong hồ sơ xin cấp chứng chỉ không trung thực.", "C": "Chứng chỉ bị tẩy, xoá, sửa chữa", "D": "Cả A, B và C."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Một khách hàng Việt Kiều muốn mua nhà tại Việt Nam. Yếu tố pháp lý nào nhà môi giới cần tư vấn ĐẦU TIÊN và quan trọng nhất cho khách hàng này?", "options": {"A": "Điều kiện và đối tượng người Việt Nam định cư ở nước ngoài được phép sở hữu nhà ở tại Việt Nam theo Luật Nhà ở.", "B": "Thủ tục xin cấp Sổ hồng (GCN).", "C": "Cách thức vay vốn ngân hàng tại Việt Nam.", "D": "Các loại thuế, phí phải nộp khi mua bán."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Khi thẩm định pháp lý một căn nhà riêng lẻ đã qua sử dụng, ngoài Sổ hồng (GCN), giấy tờ nào cũng rất quan trọng để đánh giá tính hợp pháp của công trình xây dựng?", "options": {"A": "Giấy phép xây dựng (đối với nhà xây sau khi có quy định về cấp phép).", "B": "Hóa đơn tiền điện, nước.", "C": "Thông báo nộp thuế đất hàng năm.", "D": "Hợp đồng mua bán lần đầu với chủ đầu tư (nếu có)."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Việc bất động sản bị đưa vào danh sách \"ngăn chặn giao dịch\" tại Văn phòng Đăng ký đất đai có thể do nguyên nhân nào sau đây?", "options": {"A": "Chủ nhà đi công tác nước ngoài dài hạn.", "B": "Có quyết định kê biên tài sản của tòa án hoặc cơ quan thi hành án.", "C": "Chủ nhà chưa nộp thuế sử dụng đất phi nông nghiệp năm nay.", "D": "Bất động sản nằm trong khu vực quy hoạch công viên cây xanh."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Trong các loại tranh chấp bất động sản, loại nào thường phức tạp và khó giải quyết nhất liên quan đến yếu tố lịch sử và tình cảm?", "options": {"A": "Tranh chấp về việc nộp thuế, phí.", "B": "Tranh chấp thừa kế quyền sử dụng đất giữa các thành viên trong gia đình.", "C": "Tranh chấp do sai lệch diện tích đo đạc.", "D": "Tranh chấp về chất lượng công trình xây dựng."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Biện pháp nào là hữu hiệu nhất để phòng ngừa rủi ro mua phải bất động sản đã được bán cho nhiều người trước đó?", "options": {"A": "Yêu cầu người bán cam kết bằng lời nói.", "B": "Kiểm tra kỹ lịch sử giao dịch (nếu có thể), yêu cầu xem bản gốc giấy tờ pháp lý và thực hiện công chứng hợp đồng mua bán ngay khi có thể.", "C": "Đặt cọc một số tiền thật lớn.", "D": "Chỉ mua bất động sản của người quen."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Hợp đồng đặt cọc theo quy định có bắt buộc phải công chứng không?", "options": {"A": "Có", "B": "Không", "C": "Tùy từng giao dịch", "D": "Chỉ có tài sản hình thành trong tương lai là bắt buộc."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Trước khi cho khách hàng xem nhà nhân viên môi giới cần thông báo", "options": {"A": "Người bán", "B": "Công ty", "C": "Người mua", "D": "Cả A, B và C"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Người mua bất động sản đặt cọc 200 triệu đồng để mua căn nhà với trị giá 2,0 tỷ đồng. Chủ nhà đổi ý không bán. Theo pháp luật dân sự hiện hành, chủ nhà sẽ trả tiền đặt cọc và đền bù tiền thiệt hại cho người mua tổng cộng là:", "options": {"A": "200 triệu đồng", "B": "400 triệu đồng", "C": "800 triệu đồng", "D": "Không trả tiền bồi thường thiệt hại"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Mỗi lần các chuyên viên môi giới BĐS nên cho khách hàng xem BĐS từ:", "options": {"A": "Càng ít càng tốt", "B": "10 căn trở lên", "C": "1-3 căn nhà", "D": "Càng nhiều càng tốt"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Dấu hiệu giúp nhận biết thời điểm kết thúc đàm phán trước khi kết thúc thật sự", "options": {"A": "Khách hàng hỏi thông tin điều khoản mua bán; gật đầu chăm chú lắng nghe", "B": "Khách hàng yêu cầu xem giấy tờ pháp lý; gật đầu chăm chú lắng nghe điều khoản hợp đồng", "C": "Khách hàng hỏi thông tin về các loại BĐS tương tự, điều khoản thanh toán", "D": "Khách gật đầu chăm chú lắng nghe mọi thông tin, bàn tán với nhau"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Đâu là ví dụ về việc áp dụng kỹ năng \"nâng cao giá trị cảm nhận\" cho một căn hộ cũ cần sửa chữa?", "options": {"A": "Che giấu các khuyết điểm cần sửa chữa.", "B": "Phân tích tiềm năng cải tạo (\"chỉ cần sơn sửa lại là đẹp lung linh\"), vị trí tốt, giá trị đất tăng theo thời gian và so sánh với giá căn hộ mới cùng khu vực.", "C": "Từ chối dẫn khách xem vì nhà quá cũ.", "D": "Nhấn mạnh vào giá bán rất rẻ so với thị trường."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Điều kiện để cá nhân được cấp chứng chỉ hành nghề môi giới bất động sản?", "options": {"A": "Không phải là cán bộ, công chức, có trình độ đại học trở lên.", "B": "Kinh nghiệm 03 năm, có trình độ tốt nghiệp trung học phổ thông trở lên.", "C": "Có năng lực hành vi dân sự đầy đủ. Có trình độ tốt nghiệp trung học phổ thông trở lên. Đã qua sát hạch về kiến thức môi giới bất động sản.", "D": "Cả A, B và C"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Bộ Quy tắc đạo đức và ứng xử đối với các sàn giao dịch bất động sản Việt Nam năm 2024 do Hội môi giới bất động sản Việt Nam đề xuất và thông qua có bao nhiêu Điều:", "options": {"A": "10 điều", "B": "15 điều", "C": "22 điều", "D": "25 điều"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Nếu xảy ra tranh chấp hợp đồng đặt cọc giữa người mua và người bán người môi giới nên làm gì?", "options": {"A": "Ép bên vi phạm phải nhượng bộ và bồi thường", "B": "Giải quyết bằng hòa giải và hoàn lại tiền", "C": "Áp dụng theo những cam kết trong hợp đồng đặt cọc và bồi thường theo thỏa thuận hoặc đưa sự việc ra Pháp luật, đơn vị có thẩm quyền giải quyết nếu hai bên không tự giải quyết được", "D": "Tất cả các câu trên đều đúng"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Khách hàng mục tiêu trong marketing là gì?", "options": {"A": "Là những người quan tâm đến sản phẩm.", "B": "Là khách hàng có nhu cầu sản phẩm.", "C": "Là nhóm đối tượng khách hàng trong phân khúc thị trường mục tiêu mà doanh nghiệp bạn đang hướng tới", "D": "Tất cả đều sai."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Khi thành lập công ty môi giới bất động sản, việc đăng ký ngành nghề kinh doanh cần tuân thủ theo quy định của luật nào là chính yếu?", "options": {"A": "Bộ luật Dân sự.", "B": "Luật Đất đai.", "C": "Luật Doanh nghiệp và Luật Kinh doanh Bất động sản.", "D": "Luật Nhà ở."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Những biểu hiện nào sau đây cho phép xác định đối tượng khách hàng của bạn là “khách hàng kỹ tính”:", "options": {"A": "Né tránh, sợ bị gạt, không dám quyết định một mình", "B": "Có vẻ không đồng ý, hơi nghi ngờ, hay so sánh với sản phẩm khác của đối thủ", "C": "Rất nhiều kinh nghiệm và thời gian, thường nghi ngờ bạn đang lợi dụng họ", "D": "Phân tích kỹ mọi thông tin, quan tâm tới từng chi tiết nhỏ"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Nếu một Hợp đồng Dịch vụ Môi giới không quy định rõ \"thời điểm phát sinh quyền hưởng hoa hồng\" của nhà môi giới, điều gì có thể xảy ra?", "options": {"A": "Nhà môi giới có quyền đòi hoa hồng ngay khi ký hợp đồng dịch vụ.", "B": "Khách hàng có quyền từ chối trả hoa hồng.", "C": "Dễ phát sinh tranh chấp về việc khi nào nhà môi giới được coi là đã hoàn thành", "D": "Hợp đồng dịch vụ đó bị vô hiệu."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Một bất động sản có vị trí đẹp nhưng thiết kế bên trong lỗi thời, khó bán. Nhà môi giới nên tư vấn cho người bán chiến lược nào hiệu quả nhất?", "options": {"A": "Tập trung marketing vào tiềm năng cải tạo, cung cấp ý tưởng/bản vẽ thiết kế gợi ý và định giá hợp lý phản ánh cả hiện trạng lẫn tiềm năng.", "B": "Đầu tư cải tạo, sửa chữa lớn toàn bộ căn nhà trước khi bán.", "C": "Giữ nguyên hiện trạng và chỉ tập trung giảm giá sâu.", "D": "Chỉ quảng cáo các bất động sản khác đẹp hơn."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Bộ Quy tắc đạo đức và ứng xử đối với các nhà môi giới bất động sản Việt Nam năm 2024 do Hội môi giới bất động sản Việt Nam đề xuất và thông qua có bao nhiêu Điều:", "options": {"A": "10 điều", "B": "21 điều", "C": "22 điều", "D": "25 điều"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "\"Đâu là thách thức chính khi áp dụng công nghệ Blockchain vào quản lý giao dịch BĐS tại Việt Nam hiện nay?", "options": {"A": "Công nghệ Blockchain quá đơn giản.", "B": "Hành lang pháp lý chưa hoàn thiện, sự chấp nhận và tích hợp với hệ thống quản lý đất đai hiện hành còn hạn chế.", "C": "Thiếu chuyên gia công nghệ thông tin.", "D": "Chi phí lưu trữ dữ liệu quá thấp."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Vợ chồng anh Nam, chị Phương cùng đứng tên trên GCN quyền sử dụng đất và sở hữu nhà ở. Anh Nam muốn dùng căn nhà này để thế chấp vay vốn ngân hàng phục vụ kinh doanh riêng của mình. Anh Nam có thể tự mình ký hợp đồng thế chấp với ngân hàng không?", "options": {"A": "Có, vì anh là một trong hai đồng sở hữu.", "B": "Có, nếu việc kinh doanh riêng mang lại lợi ích cho gia đình.", "C": "Không, việc thế chấp tài sản chung là bất động sản phải có sự thỏa thuận bằng văn bản của cả vợ và chồng.", "D": "Chỉ cần chị Phương đồng ý bằng lời nói là đủ."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Khi kết thúc cuộc gặp khách hàng, nhân viên môi giới nên:", "options": {"A": "Chốt giao dịch ngay bằng mọi giá", "B": "Tóm tắt lại lợi ích chính và hẹn lịch theo dõi", "C": "Hỏi khách hàng về các đối thủ cạnh tranh", "D": "Giữ liên lạc nhưng không cần nhắc lại thông tin"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Để tạo dựng niềm tin với khách hàng, nhân viên môi giới cần:", "options": {"A": "Luôn hứa hẹn vượt quá khả năng", "B": "Cung cấp thông tin minh bạch, chính xác", "C": "Giảm giá thật nhiều để chốt nhanh", "D": "Giữ thái độ cứng rắn"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Nếu người mua phát hiện một lỗi tiềm ẩn nghiêm trọng của BĐS sau khi đã nhận nhà (ví dụ: thấm dột nặng vào mùa mưa), họ có quyền yêu cầu người bán chịu trách nhiệm không (theo Bộ luật Dân sự)?", "options": {"A": "Chỉ có quyền tự bỏ tiền ra sửa chữa.", "B": "Chỉ có quyền yêu cầu nhà môi giới chịu trách nhiệm.", "C": "Không, vì đã nhận nhà nghĩa là chấp nhận mọi rủi ro.", "D": "Có, nếu chứng minh được lỗi đó đã tồn tại trước thời điểm bàn giao và người bán đã cố tình che giấu hoặc không thông báo (trừ khi hợp đồng có thỏa thuận miễn trừ rõ ràng)."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Khi tư vấn cho khách hàng lựa chọn giữa việc mua căn hộ chung cư và nhà đất thổ cư, nhà môi giới cần tập trung phân tích dựa trên yếu tố nào là chính?", "options": {"A": "Chỉ tư vấn loại hình mà môi giới có nguồn hàng nhiều hơn.", "B": "Chỉ dựa vào sở thích cá nhân của nhà môi giới.", "C": "Phân tích ưu nhược điểm của từng loại hình dựa trên nhu cầu cụ thể, khả năng", "D": "Chỉ dựa vào giá bán của hai loại hình."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Việc sử dụng \"ngôn ngữ tích cực\" trong giao tiếp với khách hàng có tác dụng gì?", "options": {"A": "Khiến nhà môi giới trông thiếu chuyên nghiệp.", "B": "Làm cho vấn đề trở nên nghiêm trọng hơn.", "C": "Che giấu sự thật về những điểm yếu của BĐS.", "D": "Tạo cảm giác lạc quan, xây dựng, khuyến khích sự hợp tác và giảm thiểu xung"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Đâu là một ví dụ về việc áp dụng kỹ năng \"quản lý thời gian\" hiệu quả của nhà môi giới?", "options": {"A": "Dành cả ngày để lướt mạng xã hội.", "B": "Chỉ làm việc khi có khách hàng gọi đến.", "C": "Lập kế hoạch làm việc hàng ngày/tuần.", "D": "Luôn nhận lời mọi cuộc hẹn ngay cả khi trùng lịch."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Trong hợp đồng mua bán nhà ở hình thành trong tương lai, điều khoản về \"bảo lãnh ngân hàng\" có ý nghĩa gì đối với người mua?", "options": {"A": "Ngân hàng sẽ thay chủ đầu tư hoàn thiện căn hộ nếu cần.", "B": "Ngân hàng sẽ hoàn lại tiền cho người mua nếu chủ đầu tư không bàn giao nhà đúng cam kết theo các điều kiện trong thư bảo lãnh.", "C": "Đảm bảo giá bán căn hộ sẽ không tăng.", "D": "Đảm bảo người mua chắc chắn được vay vốn."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Yếu tố nào thể hiện tầm nhìn chiến lược của một nhà quản lý văn phòng môi giới bất động sản?", "options": {"A": "Đầu tư vào công nghệ, thương hiệu một cách bền vững.", "B": "Khả năng dự báo xu hướng thị trường, xác định cơ hội phát triển dài hạn,", "C": "Xây dựng đội ngũ kế cận", "D": "Cả A, B, C đều đúng"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Tình huống: Nhà môi giới A đang dẫn khách xem một căn nhà. Khách hàng rất thích vị trí nhưng chê bai gay gắt về thiết kế nội thất đã lỗi thời và tuyên bố chỉ mua nếu chủ nhà giảm giá mạnh để họ sửa chữa. Nhà môi giới biết chủ nhà là người lớn tuổi, rất yêu quý căn nhà và không muốn giảm giá. Hướng xử lý nào thể hiện kỹ năng đàm phán và tâm lý tốt nhất?", "options": {"A": "Từ chối làm việc tiếp với khách hàng vì cho rằng họ đòi hỏi quá đáng.", "B": "Ghi nhận ý kiến khách hàng, đồng cảm về nhu cầu sửa chữa, sau đó khéo léo chuyển hướng sang các ưu điểm khác (vị trí, kết cấu, tiềm năng) và đề xuất thương lượng một mức giá hợp lý hơn phản ánh cả ưu điểm lẫn nhược điểm.", "C": "Bảo vệ quan điểm của chủ nhà, nói rằng thiết kế đó rất đẹp và khách hàng không có mắt thẩm mỹ.", "D": "Đồng ý ngay với khách hàng và hứa sẽ ép chủ nhà giảm giá mạnh."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Tình huống: Khách hàng B (người mua) rất muốn mua căn hộ X nhưng còn thiếu khoảng 10% tài chính, đang chờ người thân gửi tiền về trong 1 tháng tới. Người bán cần bán gấp trong 2 tuần. Nhà môi giới nên tư vấn cho khách hàng B giải pháp nào khả thi và ít rủi ro nhất?", "options": {"A": "Khuyên khách hàng B vay nóng lãi suất cao để đủ tiền ngay.", "B": "Trao đổi thẳng thắn với người bán về tình hình của người mua, đề xuất phương án thương lượng (ví dụ: đặt cọc trước một phần, ký hợp đồng mua bán nhưng thỏa thuận thời gian thanh toán kéo dài hơn 2 tuần và có biện pháp bảo đảm cho người bán).", "C": "Đề nghị khách hàng B đặt cọc cao và cam kết thanh toán đủ trong 2 tuần, bất chấp rủi ro không nhận được tiền kịp.", "D": "Tìm một căn hộ khác rẻ hơn cho khách hàng"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Tình huống: Nhà môi giới C phát hiện Sổ hồng (GCN) của BĐS đang giới thiệu có ghi chú \"Thửa đất nằm trong quy hoạch mở rộng đường giao thông\" nhưng người bán lại khẳng định quy hoạch đó đã bị hủy bỏ và đưa ra một văn bản photocopy không rõ nguồn gốc. Hành động nào thể hiện sự cẩn trọng và đúng đắn nhất?", "options": {"A": "Yêu cầu người bán cung cấp văn bản gốc có dấu đỏ của cơ quan chức năng xác nhận hủy bỏ quy hoạch, hoặc tự mình/hướng dẫn người mua đến Phòng Quản lý Đô thị để kiểm tra thông tin quy hoạch mới nhất, chính xác nhất.", "B": "Tin lời người bán và thông tin trên văn bản photocopy.", "C": "Tư vấn người mua nên mua nhanh vì có thể quy hoạch bị hủy thật.", "D": "Thông báo cho người mua về ghi chú trên sổ và thông tin người bán cung cấp, để người mua tự quyết định."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Tình huống: Hợp đồng mua bán đã công chứng, bên mua đã thanh toán 95%. Khi chuẩn bị bàn giao nhà, phát hiện có một vụ cháy nhỏ xảy ra làm hư hỏng một phần nội thất. Trách nhiệm xử lý thuộc về ai nếu hợp đồng không quy định rõ về rủi ro này?", "options": {"A": "Bên bán vẫn phải chịu trách nhiệm sửa chữa hoặc bồi thường", "B": "Công ty bảo hiểm phải chịu (nếu có).", "C": "Nhà môi giới phải chịu trách nhiệm.", "D": "Bên mua phải chịu vì sắp nhận nhà."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Tình huống: Trong hợp đồng đặt cọc, có điều khoản \"nếu bên mua không được ngân hàng duyệt cho vay đủ 70% giá trị BĐS thì hợp đồng này tự động hủy và bên bán hoàn trả lại toàn bộ tiền cọc\". Đây là loại điều khoản gì?", "options": {"A": "Điều khoản về điều kiện có hiệu lực hoặc hủy bỏ hợp đồng", "B": "Điều khoản phạt vi phạm.", "C": "Điều khoản về bất khả kháng.", "D": "Điều khoản về bảo mật thông tin."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Tình huống: Là người quản lý, bạn muốn xây dựng một cơ chế đánh giá hiệu quả làm việc (KPIs) công bằng cho đội ngũ môi giới. Chỉ số nào sau đây KHÔNG nên là chỉ số duy nhất hoặc quan trọng nhất?", "options": {"A": "Số lượng khách hàng mới mang về.", "B": "Doanh số bán hàng cá nhân.", "C": "Mức độ hài lòng của khách hàng (thông qua khảo sát).", "D": "Số giờ làm việc tại văn phòng."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Tình huống: Khách hàng G (người bán) rất bận rộn và đề nghị nhà môi giới H thay mặt toàn bộ trong việc đàm phán giá cả và ký kết hợp đồng đặt cọc. Nhà môi giới H nên:", "options": {"A": "Từ chối vì sợ trách nhiệm.", "B": "Chỉ nhận ủy quyền bằng lời nói.", "C": "Yêu cầu khách hàng lập Hợp đồng ủy quyền bằng văn bản, công chứng theo quy định pháp luật, trong đó ghi rõ phạm vi ủy quyền (được phép đàm phán giá trong khoảng nào, được ký hợp đồng đặt cọc...).", "D": "Đồng ý ngay vì được khách hàng tin tưởng."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Tình huống: Nhà môi giới L đang làm việc với cả người mua và người bán (đại diện kép) cho cùng một BĐS. Để đảm bảo tính minh bạch và giảm thiểu xung đột lợi ích, việc nào là quan trọng nhất?", "options": {"A": "Chỉ tiết lộ thông tin có lợi cho người trả hoa hồng cao hơn.", "B": "Thông báo rõ ràng cho cả hai bên về vai trò đại diện kép của mình, có được sự đồng ý bằng văn bản và cam kết hành động công bằng, trung thực, cung cấp thông tin khách quan như nhau cho cả hai bên.", "C": "Đứng về phía người mua để giúp họ mua được giá rẻ.", "D": "Giữ bí mật hoàn toàn thông tin của mỗi bên đối với bên kia."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Nguyên tắc kinh doanh bất động sản là:", "options": {"A": "Công khai, minh bạch;", "B": "Không vi phạm điều cấm của luật", "C": "Tự do thỏa thuận trên cơ sở tôn trọng quyền và lợi ích hợp pháp của các bên thông qua hợp đồng,", "D": "Cả A, B, C đều đúng"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Người được cấp chứng chỉ hành nghề môi giới bất động sản cho người khác mượn, thuê chứng chỉ hành nghề môi giới Bất động sản để hành nghề thì sẽ:", "options": {"A": "Phạt tiền từ 40.000.000 đồng đến 60.000.000 đồng", "B": "Tước quyền sử dụng chứng chỉ hành nghề từ 03 tháng đến 06 tháng", "C": "Bao gồm cả A và B đều đúng", "D": "Cả A và B đều sai"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Tổ chức, cá nhân kinh doanh dịch vụ môi giới bất động sản đồng thời vừa là nhà môi giới vừa là một bên thực hiện hợp đồng trong một giao dịch kinh doanh bất động sản thì bị xử phạt bao nhiêu:", "options": {"A": "80.000.000 đồng đến 120.000.000 đ", "B": "20.000.000 đồng đến 30 triệu đồng", "C": "Không bị phạt tiền", "D": "40.000.000 đồng đến 60.000.000 đồng"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Đâu không phải là khoản \"hoa hồng\" trong môi giới bất động sản?", "options": {"A": "Khoản phí mà khách hàng phải trả khi ký hợp đồng nhờ môi giới bán nhà", "B": "Tiền giờ công", "C": "Phần trăm trên giá mua", "D": "Không có khoản nào kể trên được xem là \"hoa hồng\" trong môi giới bất động sản"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Doanh nghiệp kinh doanh dịch vụ môi giới bất động sản có các quyền nào:", "options": {"A": "Yêu cầu các tổ chức, cá nhân có liên quan cung cấp hồ sơ, thông tin bất động", "B": "Thu phí dịch vụ của khách hàng theo thỏa thuận của các bên", "C": "Từ chối môi giới bất động sản không đủ điều kiện đưa vào kinh doanh", "D": "Cả A, B, C đều đúng"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Yếu tố nào sau đây có ảnh hưởng GIÁN TIẾP nhưng lại mang tính quyết định đến sự sôi động hay trầm lắng của nghề môi giới bất động sản trong dài hạn?", "options": {"A": "Quy định về mẫu hợp đồng môi giới.", "B": "Số lượng các khóa đào tạo môi giới được mở.", "C": "Mức lệ phí cấp chứng chỉ hành nghề.", "D": "Tình hình kinh tế vĩ mô và chu kỳ của thị trường bất động sản."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Khi phân loại khách hàng mua bất động sản, nhóm \"Mua để đầu tư\" thường có đặc điểm gì?", "options": {"A": "Tìm kiếm bất động sản có tiềm năng tăng giá hoặc tạo dòng tiền cho thuê.", "B": "Quan tâm chính đến tiện ích sống và không gian cho gia đình.", "C": "Mục tiêu chính là bảo toàn vốn khỏi lạm phát.", "D": "Ưu tiên các yếu tố về phong thủy và lịch sử nhà."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Chỉ số \"Lợi nhuận / Giao dịch\" giúp nhà quản lý đánh giá điều gì?", "options": {"A": "Năng suất lao động của nhân viên.", "B": "Quy mô và chất lượng trung bình của các thương vụ thành công.", "C": "Tỷ suất lợi nhuận trên tổng doanh thu.", "D": "Chi phí hoạt động của văn phòng."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Khi mua nhà ở hình thành trong tương lai, người mua cần đặc biệt chú ý kiểm tra giấy tờ pháp lý nào của dự án?", "options": {"A": "Sổ hồng (GCN) của các căn đã bán trước đó.", "B": "Hợp đồng lao động của công nhân xây dựng.", "C": "Báo cáo tài chính của chủ đầu tư.", "D": "Giấy phép xây dựng, Văn bản đủ điều kiện bán nhà ở hình thành trong tương"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Tình huống: Hợp đồng đặt cọc đã ký, bên mua đã giao tiền cọc. Tuy nhiên, đến ngày ký hợp đồng công chứng, bên bán đột ngột đổi ý không bán nữa vì có người khác trả giá cao hơn. Nhà môi giới nên tư vấn cho bên mua (khách hàng của mình) như thế nào?", "options": {"A": "Khuyên bên mua chấp nhận mất cơ hội và tìm bất động sản khác.", "B": "Tư vấn bên mua về quyền lợi của mình theo hợp đồng đặt cọc (thường là yêu cầu bên bán trả lại tiền cọc và bồi thường một khoản tương đương tiền cọc), hỗ trợ họ thực hiện các bước pháp lý cần thiết (nếu cần).", "C": "Khuyên bên mua trả thêm tiền để cạnh tranh với người trả giá cao hơn.", "D": "Đổ lỗi cho bên bán và không làm gì thêm."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Khi tư vấn cho khách hàng về việc vay ngân hàng mua bất động sản, nhà môi giới KHÔNG nên làm điều gì?", "options": {"A": "Đưa ra cam kết chắc chắn về việc khách hàng sẽ được duyệt vay với lãi suất cụ thể.", "B": "Giới thiệu một số ngân hàng có chính sách tốt.", "C": "Giải thích quy trình cơ bản của việc vay vốn.", "D": "Hỗ trợ khách hàng chuẩn bị một số giấy tờ cơ bản (nếu được yêu cầu)."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Trong hợp đồng mua bán nhà ở hình thành trong tương lai, điều khoản nào bảo vệ người mua tốt nhất nếu chủ đầu tư chậm bàn giao nhà?", "options": {"A": "Điều khoản về thiết kế chi tiết căn hộ.", "B": "Điều khoản quy định rõ mức phạt vi phạm hợp đồng (lãi phạt chậm bàn giao) cho chủ đầu tư.", "C": "Điều khoản về phí quản lý vận hành tòa nhà.", "D": "Điều khoản về việc chủ đầu tư được phép thay đổi vật liệu xây dựng."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Quy trình tư vấn cho khách hàng về dự án bất động sản bao gồm?", "options": {"A": "Giới thiệu quy hoạch 1/500; thông báo giá, ký hợp đồng dịch vụ môi giới.", "B": "Giới thiệu hồ sơ dự án, đưa ra mức giá bán, ký hợp đồng dịch vụ môi giới.", "C": "Giới thiệu đầy đủ hồ sơ pháp lý của dự án, tư vấn cho khách hàng chi tiết đầy đủ các thông tin và dịch vụ kèm theo sản phẩm chào bán, giới thiệu chính xác các mức giá, các ưu đãi của dự án, hỗ trợ tài chính, ngân hàng (nếu có). Giải thích các điều khoản hợp đồng mua bán mẫu của dự án và đưa khách hàng xem mô hình dự án, căn hộ mẫu (nếu có).", "D": "Cả A, B và C đều đúng."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Để kiểm tra thông tin quy hoạch chi tiết của một thửa đất, nhà môi giới nên đến cơ quan nào?", "options": {"A": "Công an phường/xã.", "B": "Cơ quan Thuế.", "C": "UBND phường/xã.", "D": "Văn phòng Đăng ký đất đai."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Khi một bất động sản tạo ra dòng tiền thu nhập thụ động âm (ví dụ cho thuê không đủ bù các khoản chi và các khoản khấu hao đầu tư…). Nhằm làm cho nó trở thành một khoản đầu tư hấp dẫn đối với nhà đầu tư, nhà môi giới nên chứng minh thế nào?", "options": {"A": "Sẽ có những giảm trừ thích hợp.", "B": "Sẽ có một chút trì hoãn nhỏ trong việc bảo hành sửa chữa bất động sản này.", "C": "Sẽ có một sự giảm giá đáng kể.", "D": "Sẽ có một sự gia tăng đáng kể trong giá trị tài sản."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Khi một môi giới cùng một thẩm định viên thẩm định giá trị một căn nhà ở Block A, khu đô thị X, họ nên chọn cách tiếp cận nào dưới đây để đưa ra mô hình thẩm định giá BĐS phù hợp. Biết rằng, khách hàng dự định mua căn nhà này để cùng gia đình sinh sống lâu dài?", "options": {"A": "Cách tiếp cận thu nhập.", "B": "Cách tiếp cận so sánh.", "C": "Cách tiếp cận chi phí.", "D": "Tất cả các cách trên."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Trong môi giới, nghiệp vụ tư vấn vay vốn mua nhà thường được tiến hành thường xuyên và rất quan trọng. Bước đầu tiên nhà môi giới có nhiệm vụ tiếp xúc, tìm hiểu và hướng dẫn khách hàng làm thủ tục vay và những vấn đề liên quan. Trong giai đoạn này, anh ta không cần phải thực hiện nội dung nào sau đây?", "options": {"A": "Xác định năng lực tài chính của khách hàng (vốn pháp định, vốn tự có, nguồn tài trợ chủ yếu, điểm hòa vốn, khả năng sinh lợi…).", "B": "Tư vấn những vấn đề cụ thể mà khách hàng trình bày và tư cách pháp lý của khách hàng.", "C": "Xem xét tính khả thi của phương án sản xuất kinh doanh hay dự án đầu tư của khách hàng.", "D": "Tìm hiểu về tình hình hoạt động sản xuất kinh doanh của khách hàng (doanh thu, năng lực sản xuất đầu tư, khả năng đầu tư, thị trường tiêu thụ, mạng lưới phân phối…)."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Khi phân loại khách hàng mua bất động sản, nhóm \"Mua để ở\" thường có đặc điểm gì?", "options": {"A": "Quan tâm chính đến tiện ích sống và không gian cho gia đình.", "B": "Mục tiêu chính là bảo toàn vốn khỏi lạm phát.", "C": "Tìm kiếm các bất động sản tạo dòng tiền cho thuê.", "D": "Tìm kiếm bất động sản có tiềm năng tăng giá."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Khi tư vấn và xây dựng phương án tài chính cho một quyết định mua BĐS của khách hàng, việc gì sau đây người môi giới phải làm đầu tiên?", "options": {"A": "Đánh giá rủi ro có thể có, tiên liệu những khó khăn xảy ra và khả năng đối phó trên quan điểm dòng tiền.", "B": "Kiểm tra các số liệu để xác định mức độ phù hợp và tin cậy của chúng.", "C": "Xem xét quy mô đầu tư với khả năng huy động vốn có thể có.", "D": "Đề ra các giải pháp lựa chọn khác nhau."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Hợp đồng đặt cọc trong giao dịch bất động sản có ý nghĩa gì?", "options": {"A": "Là hợp đồng mua bán chính thức.", "B": "Là thỏa thuận ban đầu, ghi nhận việc bên mua giao tiền cọc để đảm bảo giao kết hợp đồng chính thức.", "C": "Là hợp đồng dịch vụ môi giới.", "D": "Là hợp đồng thuê bất động sản ngắn hạn."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Hoạt động nào KHÔNG thuộc Bước 4: Kết thúc thương vụ và Chăm sóc sau bán hàng?", "options": {"A": "Hỗ trợ thủ tục sang tên sổ đỏ (nếu có thỏa thuận).", "B": "Soạn thảo và đăng tin quảng cáo bất động sản.", "C": "Phối hợp bàn giao bất động sản.", "D": "Nhận phí hoa hồng môi giới."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Để kết thúc thương vụ môi giới, bạn nên:", "options": {"A": "Xem như khách hàng đồng ý, bắt đầu điền vào hợp đồng.", "B": "Tóm tắt tất cả chi tiết khiến khách hàng đồng ý từng điểm một.", "C": "Thay khách hàng đưa ra quyết định và để khách hàng điền vào hợp đồng.", "D": "Tùy từng đối tượng và bối cảnh mà chọn A, B, C hoặc kết hợp các phương án."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Các bước chuẩn bị tiền tiếp cận khách hàng bao gồm:", "options": {"A": "Liên lạc khách hàng, soạn thảo hợp đồng.", "B": "Xác định mục tiêu đàm phán, thu thập thông tin đối phương, soạn thảo sách", "C": "Xác định mục tiêu đàm phán, liên lạc khách hàng, soạn thảo hợp đồng.", "D": "Thu thập thông tin đối phương, liên lạc khách hàng, soạn thảo sách lược đàm"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Nhà môi giới phát hiện thông tin trên Sổ hồng (diện tích) có sai khác nhỏ so với đo đạc thực tế. Hành động nào thể hiện sự chuyên nghiệp và quản lý rủi ro tốt nhất?", "options": {"A": "Chỉ thông báo cho bên có lợi từ sự khác biệt đó.", "B": "Minh bạch thông báo cho cả bên mua và bên bán về sự khác biệt, giải thích về sai số cho phép (nếu có) và tư vấn các bên kiểm tra kỹ lưỡng hoặc đo đạc lại nếu cần.", "C": "Phớt lờ sự khác biệt vì cho rằng không đáng kể.", "D": "Tự ý sửa lại thông tin trên hồ sơ giới thiệu cho khớp với Sổ hồng."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Những điều cần tránh làm khi giới thiệu sản phẩm bất động sản là?", "options": {"A": "Giới thiệu bằng trực quan sống động.", "B": "Luôn sử dụng các từ và thuật ngữ chuyên môn.", "C": "Gợi ý những viễn cảnh tốt đẹp nếu khách hàng mua sản phẩm.", "D": "Cả đáp án B và C đúng."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Ngoài các giấy tờ pháp lý, kỹ thuật, việc lưu trữ \"ghi chú các buổi làm việc/khảo sát, thư chào giá, biên bản thương lượng\" trong hồ sơ thương vụ có ý nghĩa gì?", "options": {"A": "Để tính toán thời gian làm việc của môi giới.", "B": "Chỉ làm hồ sơ dày thêm, không cần thiết.", "C": "Để gửi báo cáo cho hiệp hội bất động sản.", "D": "Làm bằng chứng về quá trình làm việc, các thỏa thuận từng bước và cơ sở cho việc giải quyết tranh chấp (nếu có) về sau."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Trong Bước 3 (Giao dịch với khách hàng) của quy trình môi giới, sau khi các bên đã thống nhất các điều khoản cơ bản, bước tiếp theo quan trọng nhất là gì?", "options": {"A": "Chuyển toàn bộ tiền mua bán.", "B": "Đi đăng ký sang tên Sổ hồng.", "C": "Ký Hợp đồng Đặt cọc để ràng buộc trách nhiệm ban đầu.", "D": "Bàn giao ngay BĐS."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Tại sao nhà môi giới cần giúp khách hàng (đặc biệt là người mua lần đầu) hiểu rõ các điều khoản trong Hợp đồng Đặt cọc/Mua bán?", "options": {"A": "Vì khách hàng thường chủ quan, không đọc kỹ hoặc không hiểu hết các thuật ngữ pháp lý, có thể dẫn đến rủi ro hoặc tranh chấp không đáng có.", "B": "Để thể hiện mình là người soạn thảo hợp đồng giỏi.", "C": "Để kéo dài thời gian ký kết hợp đồng.", "D": "Để tính thêm phí tư vấn hợp đồng."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Để giới thiệu, chào bán BĐS thành công cần dựa trên các yếu tố:", "options": {"A": "Liên lạc trước, giao tiếp lịch sự, nắm được nhu cầu khách hàng.", "B": "Giao tiếp lịch sự, am hiểu thị trường BĐS, nắm được nhu cầu khách hàng.", "C": "Giao tiếp lịch sự, am hiểu thị trường BĐS, tìm được sản phẩm đúng nhu cầu khách hàng.", "D": "Có người giới thiệu, tìm được khách hàng tiềm năng, giao tiếp lịch sự."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Trong tình huống đàm phán căng thẳng, một bên đưa ra lời chỉ trích cá nhân đối với bên kia. Nhà môi giới nên phản ứng thế nào là tốt nhất?", "options": {"A": "Rời khỏi cuộc đàm phán vì cho rằng không thể tiếp tục.", "B": "Hùa theo lời chỉ trích để làm hài lòng một bên.", "C": "Ngắt lời và yêu cầu hai bên dừng đàm phán ngay lập tức.", "D": "Giữ bình tĩnh, khéo léo lái cuộc thảo luận quay trở lại vấn đề chính, nhắc nhở về mục tiêu chung và giữ thái độ tôn trọng đối với cả hai bên."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Trong quy trình môi giới, người môi giới BĐS cần thực hiện các nhiệm vụ sau:", "options": {"A": "Chứng thực, sao lưu các loại giấy tờ, tìm kiếm khách hàng.", "B": "Khảo sát thực địa, hồ sơ pháp lý, thẩm định giá, quảng bá, giới thiệu BĐS.", "C": "Đàm phán điều khoản, lập hợp đồng, thu phí môi giới.", "D": "Cả 3 câu trên đều đúng."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Khi thuyết phục khách hàng sử dụng dịch vụ môi giới của mình, yếu tố nào thường có sức nặng nhất", "options": {"A": "Sự am hiểu thị trường.", "B": "Năng lực chuyên môn,", "C": "Mạng lưới khách hàng và cam kết mang lại giá trị thực sự cho khách hàng.", "D": "Cả A, B, C đều đúng."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Nhà môi giới có nên từ chối làm việc với một khách hàng có yêu cầu phi thực tế hoặc không rõ ràng sau khi đã cố gắng tư vấn không?", "options": {"A": "Nên từ chối một cách lịch sự và chuyên nghiệp.", "B": "Không bao giờ, phải cố gắng đáp ứng mọi yêu cầu.", "C": "Nên tiếp tục làm việc nhưng không cần nỗ lực nhiều.", "D": "Nên báo cáo khách hàng này với hiệp hội BĐS."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Trong trường hợp nào thì việc sử dụng \"Hợp đồng Ủy quyền\" để mua bán bất động sản là hợp lệ và ít rủi ro nhất?", "options": {"A": "Người ủy quyền đang ở nước ngoài không thể về ký bán.", "B": "Người mua muốn nhờ người khác đứng tên hộ.", "C": "Người ủy quyền và người được ủy quyền là vợ chồng/cha mẹ con cái ruột, nội dung ủy quyền rõ ràng, hợp pháp và còn hiệu lực.", "D": "Hợp đồng ủy quyền được lập bằng giấy viết tay."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Đâu là hạn chế chính của việc chỉ dựa vào các mối quan hệ cá nhân để tìm kiếm khách hàng trong môi giới bất động sản?", "options": {"A": "Phí hoa hồng thường thấp hơn.", "B": "Khó xây dựng lòng tin với khách hàng.", "C": "Khách hàng từ mối quan hệ thường khó tính hơn.", "D": "Nguồn khách hàng bị giới hạn trong phạm vi mạng lưới quen biết, khó mở rộng quy mô kinh doanh."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Khi người môi giới đại diện cho bên bán làm việc với bên mua, phần nào sau đây không thuộc nhiệm vụ thực hiện của người môi giới đối với bên mua?", "options": {"A": "Nhiệm vụ ủy thác.", "B": "Tư vấn sửa chữa, thanh lý hợp đồng mua bán BĐS.", "C": "Tư vấn cho khách hàng để có sự hiểu rõ toàn diện về BĐS.", "D": "Cả A, B, C đều đúng."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Việc sử dụng các công cụ phân tích dữ liệu website giúp nhà môi giới bất động sản làm gì?", "options": {"A": "Tăng tốc độ tải trang web.", "B": "Hiểu rõ hành vi của người truy cập website từ đó tối ưu nội dung và chiến lược marketing online.", "C": "Thiết kế lại giao diện website", "D": "Tự động đăng tin BĐS."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Thái độ nào là KHÔNG phù hợp khi nhà môi giới nhận được một lời phàn nàn gay gắt từ khách hàng?", "options": {"A": "Đề xuất hướng giải quyết hoặc khắc phục (nếu có thể).", "B": "Lắng nghe chăm chú để hiểu rõ vấn đề.", "C": "Xin lỗi về trải nghiệm không tốt của khách hàng (ngay cả khi lỗi không hoàn toàn do mình).", "D": "Đổ lỗi ngược lại cho khách hàng hoặc bên thứ ba."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Điều gì tạo nên sự khác biệt cốt lõi giữa một nhà môi giới bất động sản đơn thuần và một nhà tư vấn bất động sản chuyên nghiệp?", "options": {"A": "Khả năng cung cấp giải pháp toàn diện, dựa trên sự thấu hiểu sâu sắc nhu cầu khách hàng, kiến thức thị trường và phân tích chuyên môn, thay vì chỉ kết nối mua bán.", "B": "Thời gian hoạt động trong nghề lâu hơn.", "C": "Mức phí hoa hồng cao hơn.", "D": "Số lượng giao dịch thành công."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Khi thị trường bất động sản có dấu hiệu trầm lắng, người bán không muốn giảm giá, nhà môi giới nên tập trung vào chiến lược nào?", "options": {"A": "Tạm dừng mọi hoạt động marketing.", "B": "Tăng cường marketing sáng tạo, nhấn mạnh các giá trị độc đáo của bất động sản", "C": "Yêu cầu người bán phải giảm giá bằng mọi cách.", "D": "Chuyển sang chỉ làm việc với người mua."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Đâu là rủi ro khi nhà môi giới quá tập trung vào việc \"chốt sale\" nhanh chóng mà bỏ qua bước thẩm định thông tin kỹ lưỡng?", "options": {"A": "Có thể dẫn đến giao dịch thất bại giữa chừng, tranh chấp pháp lý, mất uy tín và gây thiệt hại cho khách hàng.", "B": "Nhận được hoa hồng nhanh hơn.", "C": "Được khách hàng đánh giá cao vì sự nhanh nhẹn.", "D": "Tiết kiệm được chi phí hoạt động."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Để lập hồ sơ thương vụ môi giới BĐS, bên cung cần cung cấp:", "options": {"A": "Thông tin chủ sở hữu, các loại giấy tờ, hồ sơ pháp lý của BĐS.", "B": "Các giấy tờ liên quan đến thương vụ như giấy đặt cọc, phiếu thu chi…", "C": "Hợp đồng dịch vụ môi giới.", "D": "Cả A, B và C"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Việc sử dụng \"bằng chứng xã hội\" trong marketing BĐS có thể là hình thức nào?", "options": {"A": "Sử dụng lời chứng thực của khách hàng cũ hài lòng, hiển thị các giải thưởng, chứng nhận uy tín.", "B": "Che giấu thông tin về các giao dịch thất bại.", "C": "Đưa ra mức giá cao nhất thị trường.", "D": "Quảng cáo sai sự thật về tiện ích dự án."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Trong trường hợp thị trường bất động sản biến động mạnh, kỹ năng nào của nhà môi giới trở nên đặc biệt quan trọng?", "options": {"A": "Kỹ năng soạn thảo văn bản hành chính.", "B": "Kỹ năng thiết kế nội thất.", "C": "Kỹ năng chụp ảnh BĐS.", "D": "Kỹ năng phân tích thị trường, dự báo (ở mức độ nhất định) và tư vấn chiến lược kịp thời, linh hoạt cho khách hàng."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Việc từ chối cung cấp thông tin sai lệch theo yêu cầu của khách hàng thể hiện điều gì ở nhà môi giới?", "options": {"A": "Sự thiếu tự tin vào khả năng bán hàng.", "B": "Sự thiếu linh hoạt.", "C": "Sự cứng nhắc, không biết chiều khách.", "D": "Tính chính trực và tuân thủ đạo đức nghề nghiệp."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Khi quản lý một đội ngũ nhân viên môi giới, việc xây dựng cơ chế chia sẻ thông tin và hợp tác nội bộ hiệu quả mang lại lợi ích gì?", "options": {"A": "Giảm tổng doanh thu của công ty.", "B": "Tăng khả năng chốt giao dịch nhờ tận dụng được nguồn hàng và nguồn khách của nhau, tạo môi trường làm việc hợp tác.", "C": "Làm lộ thông tin khách hàng ra ngoài.", "D": "Tăng sự cạnh tranh gay gắt giữa các nhân viên."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Các bước trong tiếp cận khách hàng mua, thuê BĐS gồm:", "options": {"A": "Tìm khách hàng tiềm năng, liên lạc và thỏa thuận hợp đồng.", "B": "Tiếp cận khách hàng, giới thiệu sản phẩm, xử lý thắc mắc và kết thúc chào bán.", "C": "Tiếp cận khách hàng, giới thiệu sản phẩm.", "D": "Liên lạc, tiếp cận khách hàng, giới thiệu sản phẩm và thỏa thuận hợp đồng."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Kỹ năng \"quản lý kỳ vọng\" của khách hàng có nghĩa là gì?", "options": {"A": "Bỏ qua những kỳ vọng của khách hàng.", "B": "Đặt ra những kỳ vọng thực tế, rõ ràng cho khách hàng về quy trình, thời gian, kết quả có thể đạt được ngay từ đầu, tránh gây thất vọng về sau.", "C": "Yêu cầu khách hàng không nên có kỳ vọng gì.", "D": "Luôn hứa hẹn những điều vượt quá khả năng để làm khách hàng hài lòng ban đầu."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Giải đáp thắc mắc của khách hàng nhằm mục tiêu:", "options": {"A": "Giải thích khi khách hiểu sai, chứng minh khi khách nghi ngờ.", "B": "Phân tích để khách hàng thấy được lợi ích lâu dài, tìm hiểu nguyên nhân để ứng", "C": "Trao đổi để có các điều khoản thuận lợi hơn.", "D": "Đáp án A và B."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Khi gặp một khách hàng có kiến thức sâu về bất động sản và thị trường, nhà môi giới nên thể hiện vai trò của mình như thế nào?", "options": {"A": "Lảng tránh các câu hỏi chuyên sâu", "B": "Tranh luận để chứng tỏ mình giỏi hơn.", "C": "Chỉ đóng vai trò người dẫn đi xem nhà.", "D": "Thể hiện sự tôn trọng kiến thức của khách hàng, tập trung vào việc cung cấp giá trị gia tăng khác"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Khách hàng có vẻ chưa thích thú với sản phẩm bất động sản bạn giới thiệu, bạn sẽ:", "options": {"A": "Đưa thêm nhiều sản phẩm khác.", "B": "Tìm hiểu lý do họ không lựa chọn sản phẩm địa ốc này và lựa chọn sản phẩm phù hợp hơn để giới thiệu.", "C": "Hạ giá bán sản phẩm.", "D": "Tất cả đều sai."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Đâu là lợi ích của việc đa dạng hóa các kênh marketing cho văn phòng môi giới?", "options": {"A": "Tốn kém chi phí hơn.", "B": "Tiếp cận được nhiều đối tượng khách hàng khác nhau và giảm sự phụ thuộc vào một kênh duy nhất.", "C": "Khó quản lý và đo lường hiệu quả hơn.", "D": "Chỉ phù hợp với thị trường bất động sản cao cấp."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Tình huống: Hợp đồng mua bán có điều khoản \"Giá bán không bao gồm thuế, phí liên quan đến việc chuyển nhượng\". Vậy, lệ phí trước bạ sẽ do ai chịu trách nhiệm nộp?", "options": {"A": "Nhà môi giới.", "B": "Cơ quan công chứng.", "C": "Người mua.", "D": "Người bán."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Tình huống: Một bất động sản được đồng sở hữu bởi 3 anh em. Một người trong số đó liên hệ nhà môi giới N để bán. Nhà môi giới N cần yêu cầu giấy tờ gì để đảm bảo giao dịch hợp lệ?", "options": {"A": "Giấy khai sinh của cả 3 anh em.", "B": "Chỉ cần CMND/CCCD của người liên hệ.", "C": "Giấy chứng nhận quyền sử dụng đất và văn bản đồng ý/ủy quyền bán có chữ ký hợp lệ của cả 3 anh em (nên được công chứng/chứng thực).", "D": "Hợp đồng lao động của người liên hệ."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Tình huống: Trong hợp đồng thuê nhà, điều khoản \"Tiền thuê nhà sẽ được điều chỉnh hàng năm theo chỉ số giá tiêu dùng (CPI) do Tổng cục Thống kê công bố\" có lợi và bất lợi gì?", "options": {"A": "Chỉ làm hợp đồng thêm phức tạp.", "B": "Có lợi cho cả hai bên vì tạo ra cơ chế điều chỉnh giá khách quan, tránh tranh", "C": "Chỉ có lợi cho người thuê vì CPI thường tăng chậm.", "D": "Chỉ có lợi cho chủ nhà vì tiền thuê luôn tăng."}, "an
