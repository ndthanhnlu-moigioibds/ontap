swer": "B", "explanation": ""}, {"level": "1", "content": "Tình huống: Hợp đồng mua bán bất động sản có điều khoản \"Bên bán cam kết bất động sản không có bất kỳ tranh chấp nào\". Sau khi mua, bên mua phát hiện có tranh chấp ranh giới từ trước đó. Bên mua có quyền gì?", "options": {"A": "Phải tự mình giải quyết tranh chấp với hàng xóm.", "B": "Có quyền yêu cầu bên bán giải quyết dứt điểm tranh chấp hoặc yêu cầu hủy", "C": "Chỉ có quyền yêu cầu giảm giá bán.", "D": "Không có quyền gì vì đã ký hợp đồng."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Tình huống: Trong quá trình đàm phán, nhà môi giới O nhận thấy cả bên mua và bên bán đều có thiện chí nhưng gặp khó khăn trong việc tìm<br>tiếng nói chung về một vài điều khoản nhỏ. Nhà môi giới O nên đóng vai trò gì?", "options": {"A": "Đứng về phía bên trả hoa hồng cao hơn.", "B": "Tuyên bố đàm phán thất bại.", "C": "Đề xuất các giải pháp trung gian, các phương án thỏa hiệp công bằng cho các điều khoản nhỏ đó để giúp hai bên vượt qua điểm nghẽn và đi đến thỏa thuận cuối cùng.", "D": "Để hai bên tự giải quyết các vấn đề nhỏ đó."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Tình huống: Hợp đồng đặt cọc không ghi rõ về việc ai sẽ chịu chi phí công chứng hợp đồng mua bán. Theo thông lệ tại nhiều địa phương ở Việt Nam, chi phí này thường do ai chịu?", "options": {"A": "Nhà môi giới chịu.", "B": "Người bán chịu hoàn toàn.", "C": "Thường do người mua chịu, hoặc hai bên thỏa thuận chia đôi.", "D": "Người mua chịu hoàn toàn."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Mục nào sau đây không phải là một chiến lược đàm phán hay?", "options": {"A": "Đưa ra những điều kiện ưu đãi như thanh toán nhanh hoặc mong muốn đạt được sự giao dịch sớm", "B": "Bày tỏ thiện ý sớm để chứng tỏ rằng bạn đang thương thảo với mục đích tích cực", "C": "Áp dụng kỹ năng đàm phán win-win trong đó mỗi bên đều cảm thấy thỏa mãn.", "D": "Xác định tâm ý và những điều kiện mà khách hàng có thể chấp nhận được"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Khi thuyết phục người mua tăng giá, nhà môi giới dựa vào các yếu tố:", "options": {"A": "Ưu điểm của bất động sản.", "B": "Tín hiệu tốt trong tăng trưởng của nền kinh tế.", "C": "Nói thật những khuyết điểm bất động sản.", "D": "Tất cả đều sai."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Tương sinh đúng trong Ngũ hành theo quan niệm phong thủy:", "options": {"A": "Thủy sinh kim, kim sinh thổ, thổ sinh mộc, mộc sinh thủy, thủy sinh hỏa", "B": "Thủy sinh mộc, mộc sinh hỏa, hỏa sinh thổ, thổ sinh kim, kim sinh thủy", "C": "Thổ sinh hỏa, hỏa sinh kim, kim sinh thủy, thủy sinh mộc, mộc sinh thổ", "D": "Cả 3 câu trên đều đúng"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Mục đích của việc khám phá nhu cầu khách hàng trong mua bán bất động sản là:", "options": {"A": "Xác định nhu cầu mua bán", "B": "Khả năng thanh toán", "C": "Động lực của khách hàng", "D": "Tất cả đều đúng"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Những tiện ích của BĐS so với thời gian có thể liệt kê trong “kỹ thuật nắn” khi đàm phán về giá cả BĐS:", "options": {"A": "Tỉ giá quy đổi ra vàng tại thời điểm mua.", "B": "Các điểm đắc địa của BĐS, giá trị sử dụng tăng thêm do sử dụng vật tư cao cấp, giá trị tăng thêm của BĐS.", "C": "Môi trường sinh sống sạch sẽ, khu vực an ninh, giao thông tiện lợi, gần bệnh viện trường học.", "D": "Cả B và C."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Có thể sử dụng yếu tố nào để thuyết phục trong trường hợp khách hàng cho rằng giá BĐS là cao?", "options": {"A": "Yếu tố BĐS có giá trị tăng nhanh theo thời gian.", "B": "Yếu tố BĐS đảm bảo an toàn về mặt quy hoạch, pháp lý.", "C": "Yếu tố uy tín, chất lượng dịch vụ của công ty môi giới.", "D": "Đáp án A, B và C."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Nguyên tắc quan trọng nhất cần nắm để viết thư bán hàng bất động sản là:", "options": {"A": "Sử dụng các danh từ cụ thể và các động từ chủ động", "B": "Sử dụng ngôn ngữ chuyên môn", "C": "Nhấn mạnh một đặc điểm của sản phẩm", "D": "Làm nổi bật vai trò của khách hàng"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Điều nào thể hiện lập trường của đàm phán kiểu mềm?", "options": {"A": "Ôn hòa, trao đổi, lắng nghe các đề xuất, dung hòa lập trường của các bên.", "B": "Cứng rắn, không nhượng bộ, cố gắng bảo vệ lập trường đến cùng.", "C": "Lắng nghe các đề xuất nhưng không nhượng bộ, cố gắng bảo vệ lập trường của mình", "D": "Không cứng rắn, không nhượng bộ, dung hòa lập trường các bên"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Điều nào không phải là đặc điểm của phương pháp đàm phán nguyên tắc?", "options": {"A": "Cả 2 bên cùng có lợi", "B": "Tìm ra phương án đối tác có thể chấp thuận", "C": "Sự tín nhiệm không liên quan đến đàm phán", "D": "Ôn hòa với người, cứng rắn với công việc"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Một đàm phán được coi là thành công phải đảm bảo nguyên tắc:", "options": {"A": "Đôi bên cùng có lợi", "B": "Hòa bình, hữu nghị", "C": "Một trong hai bên đạt được mục đích", "D": "Không xảy ra xung đột"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Khi kinh doanh dịch vụ tư vấn đầu tư kinh doanh bất động sản, cần lưu ý vấn đề nào:", "options": {"A": "Tính thanh khoản của vốn đầu tư", "B": "Tỉ suất lợi nhuận trên vốn đầu tư", "C": "Lợi ích trên chi phí", "D": "Tất cả đều đúng"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Trong giai đoạn chuẩn bị đàm phán xúc tiến ký kết hợp đồng, cần xác định nhu cầu, mong muốn của khách hàng và sơ bộ định dạng đối tác. Theo đó, có thể tạm chia khách hàng \"sẵn sàng đánh đổi chi phí để lấy chất lượng mà họ đã biết rõ, họ ngại rủi ro có thể xảy ra nếu với những đối tác mới\" vào loại:", "options": {"A": "Khách hàng trung thành", "B": "Khách hàng trọng giá trị", "C": "Khách hàng trọng giá cả", "D": "Khách hàng trọng tiện lợi"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Khi đàm phán về giá, chủ bán khư khư không giảm giá bán, dù chỉ 1 xu, môi giới nên áp dụng chiến lược đàm phán nào?", "options": {"A": "Thắng-thua", "B": "Thua-thắng", "C": "Thắng-thắng", "D": "Thua-thua"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Bước đầu tiên trong quy trình mua nhà đất mà nhân viên kinh doanh bất động sản cần xác định với khách hàng là gì?", "options": {"A": "Hỏi về sở thích của họ", "B": "Hỏi về kinh nghiệm sở hữu bất động sản trước đây của họ", "C": "Hỏi về gia đình họ", "D": "Hỏi về tài chính của họ"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Marketing bất động sản mang nội dung nào:", "options": {"A": "Các chiến lược quảng cáo bất động sản", "B": "Xúc tiến bán hàng", "C": "Phương thức tiếp thị, trưng bày bất động sản", "D": "Cả A, B, C đều đúng"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Là một nhà môi giới bất động sản chuyên nghiệp, trong cách giao tiếp và ứng xử với đồng nghiệp cần phải:", "options": {"A": "Phải có thái độ lịch sự, tôn trọng, trung thực, thân thiện, hợp tác và tạo môi trường cạnh tranh lành mạnh.", "B": "Nhà môi giới phải cộng tác với nhà môi giới khác, cũng phải đảm bảo nguyên tắc vì quyền lợi tốt nhất cho khách hàng của mình. Sự hợp tác đó phải vô tư và không vì động cơ chia sẻ quyền lợi.", "C": "Tôn trọng quyền lựa chọn nhà môi giới của khách hàng; trong trường hợp khách hàng không muốn tiếp tục làm việc với mình và có nhu cầu chuyển sang làm việc với nhà môi giới khác thì không được có thái độ bôi nhọ, bất hợp tác hay những hành vi không tốt với nhà môi giới mà khách hàng lựa chọn, ngoại trừ việc yêu cầu khách hàng tuân thủ việc thanh lý hợp đồng đã ký.", "D": "Đáp án A, B và C."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Khi gọi khai thác khách hàng bán qua điện thoại, khi mới bắt đầu câu chuyện với khách hàng, người môi giới nên:", "options": {"A": "Hỏi chi tiết về thông tin bất động sản", "B": "Hỏi mục đích bán của khách hàng", "C": "Giới thiệu mình bên công ty bất động sản", "D": "Hỏi giá bán và tiến hành trả giá"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Là một nhà môi giới bất động sản chuyên nghiệp, trong giao tiếp và ứng xử với đối thủ cạnh tranh cần phải:", "options": {"A": "Chào hàng theo kiểu phá giá.", "B": "Thực hiện các hành vi không lành mạnh để ngăn cản đối thủ ký kết hợp đồng dịch vụ.", "C": "Tung tin, nói xấu, vu cáo đối thủ cạnh tranh.", "D": "Cả A, B, C đều sai"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Các thông tin cần nắm khi học dự án mới trước khi triển khai bán cho chủ đầu tư là gì?", "options": {"A": "Thông tin về chính sách bảo hành, nội thất và tiến độ thi công.", "B": "Thông tin về pháp lý dự án.", "C": "Thông tin về chủ đầu tư.", "D": "Cả A, B, C đều đúng"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Để đảm bảo thể hiện năng lực chuyên môn khi hành nghề, các nhà môi giới bất động sản phải:", "options": {"A": "Nhà môi giới phải thực hiện đúng quy trình nghiệp vụ khi làm việc.", "B": "Nhà môi giới phải đảm bảo nghiệp vụ và năng lực chuyên môn; khi tiến hành", "C": "Nhà môi giới phải cập nhật những thay đổi về tình hình thị trường và các quy", "D": "Cả A, B và C."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Là một nhà môi giới bất động sản chuyên nghiệp, trang phục và phong cách của anh/chị cần phải:", "options": {"A": "Trang phục phải lịch sự, nên đeo thẻ (có đầy đủ thông tin cá nhân và văn phòng", "B": "Khi giao tiếp, nhà môi giới phải giới thiệu về mình và đơn vị mình làm việc;", "C": "Cả A và B đều đúng.", "D": "Tất cả đều sai."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Các hỗ trợ nào được xem là hỗ trợ tăng thêm của người môi giới đối với khách hàng:", "options": {"A": "Hỗ trợ cho thuê lại, bán lại BĐS.", "B": "Hỗ trợ chứng thực các loại giấy tờ.", "C": "Hỗ trợ khảo sát thực địa nguồn BĐS.", "D": "Hỗ trợ thủ tục vay vốn ngân hàng."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Để tránh sự phản ứng, chống đối của khách hàng khi người môi giới tiếp xúc với khách hàng, với tư cách hành nghề môi giới chuyên nghiệp, môi giới viên cần tiếp cận khách hàng với mục tiêu:", "options": {"A": "Vì thích nghề môi giới bất động sản/vì phấn khích", "B": "Vì thách thức", "C": "Giúp khách hàng đạt mục tiêu tài chính của mình, thông qua đó đạt được các mục tiêu cá nhân", "D": "Vì tiền"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Nội dung nào sau đây không phải là nội dung môi giới bất động sản:", "options": {"A": "Tìm kiếm đối tác đáp ứng các điều kiện của khách hàng để tham gia đàm phán,", "B": "Đại diện theo ủy quyền để thực hiện các công việc đàm phán, ký kết hợp đồng.", "C": "Thu thập các tài liệu để tiến hành xác định giá bất động sản.", "D": "Cung cấp thông tin hỗ trợ cho các bên trong việc mua bán bất động sản."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Các chỉ tiêu nào cần đạt được trong quản lý kênh phân phối bán hàng?", "options": {"A": "Lợi nhuận", "B": "Thỏa mãn nhu cầu của khách hàng", "D": "Cả A, B, C đều đúng"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Chiến lược “kéo” áp dụng trong kinh doanh bất động sản được hiểu như thế nào:", "options": {"A": "Tạo ra sự đồng thuận về cảm nhận sản phẩm", "B": "Tạo ra sự nhận biết về thương hiệu và sự hấp dẫn khách hàng bằng các sản phẩm khác biệt", "C": "Truyền tải thông tin do chủ đầu tư thực hiện nhằm gây ảnh hưởng tới thái độ, hành vi và nhận thức của người mua", "D": "Tìm cách đẩy sản phẩm đến các nhà phân phối và khách hàng bằng các chương trình khuyến mãi, tặng quà, chiết khấu hoa hồng"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Trường hợp dự án bất động sản, công trình xây dựng đã thế chấp vay tiền ngân hàng thương mại, người môi giới bất động sản có nên tư vấn cho khách hàng vấn đề này không ?", "options": {"A": "Giữ bí mật, không cung cấp thông tin để bán được hàng.", "B": "Tư vấn đầy đủ thông tin để khách hàng nắm rõ trước khi ra quyết định giao dịch.", "C": "Tư vấn không cần đầy đủ để khách hàng tự tìm hiểu.", "D": "Không tư vấn vấn đề đó."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Khi đàm phán về giá, khách mua và chủ bán nhất quyết không tăng hay giảm giá mua-bán, dù chênh lệch giá mua bán chỉ khoảng 20 triệu đồng. Vụ giao dịch này có nguy cơ thất bại. Là môi giới trong trường hợp này, bạn nên áp dụng chiến thuật đàm phán nào?", "options": {"A": "Thắng-thua", "B": "Thua-thua.", "C": "Thua-thắng", "D": "Thắng-thắng"}, "answer": "", "explanation": ""}, {"level": "1", "content": "Phong cách đàm phán cạnh tranh được áp dụng trong trường hợp nào?", "options": {"A": "Khi không có quyền hạn quyết định, thiếu thông tin về các nội dung đàm phán", "B": "Khi phát sinh tình huống đột xuất, không nằm trong dự kiến đàm phán của các bên.", "C": "Khi các bên hướng đến mục tiêu chung, lợi ích chung.", "D": "Khi chủ thể đàm phán không đạt được mục tiêu, lợi ích riêng"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Kỹ năng nào giúp môi giới duy trì mối quan hệ với khách hàng cũ hiệu quả nhất?", "options": {"A": "Chăm sóc sau bán và cập nhật thông tin thị trường", "B": "Chỉ liên hệ khi có sản phẩm mới", "C": "Tập trung tìm khách hàng mới", "D": "Giảm phí môi giới cho mọi giao dịch"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Trong quy trình môi giới, bước nào giúp hạn chế rủi ro tranh chấp sau giao dịch?", "options": {"A": "Quảng bá sản phẩm rộng rãi", "B": "Thương lượng giá nhanh", "C": "Ký hợp đồng dịch vụ môi giới", "D": "Giải thích rõ quyền, nghĩa vụ và điều khoản hợp đồng"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Truyền thông marketing là gì?", "options": {"A": "Là một quá trình truyền tải thông tin do nhà sản xuất thực hiện nhằm gây ảnh hưởng tới thái độ, hành vi và nhận thức của người mua", "B": "Là một quá trình truyền tải thông tin do người mua thực hiện nhằm gây ảnh hưởng tới thái độ, hành vi và nhận thức của người bán", "C": "Là một quá trình truyền tải thông tin do người bán thực hiện nhằm gây ảnh hưởng tới thái độ, hành vi và nhận thức của người mua", "D": "Câu A, C đúng"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Khi môi giới phát hiện khách hàng không đủ năng lực tài chính để mua BĐS đang quan tâm, nên:", "options": {"A": "Vẫn tiếp tục thuyết phục mua", "B": "Đề xuất giải pháp tài chính hoặc sản phẩm phù hợp hơn", "C": "Chấm dứt tư vấn ngay", "D": "Chuyển khách cho môi giới khác"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Trong giao tiếp với khách hàng, việc tránh sử dụng thuật ngữ chuyên môn phức tạp nhằm mục đích gì?", "options": {"A": "Giảm thời gian tư vấn", "B": "Thể hiện sự thân thiện", "C": "Giúp khách dễ hiểu và tránh hiểu sai thông tin", "D": "Che giấu thông tin nhạy cảm"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Việc đầu tiên cần làm trong tiếp nhận than phiền từ khách hàng là:", "options": {"A": "Xác nhận vấn đề/sự kiện", "B": "Đưa ra giải pháp xử lý vấn đề", "C": "Khuyến khích khách hàng kể lại câu chuyện", "D": "Xác nhận lỗi của bên mua hay bên bán"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Trở ngại tâm lý của khách hàng khi tiếp xúc với người môi giới bất động sản là:", "options": {"A": "Sợ bị quấy rầy liên tục", "B": "Không an toàn khi tiếp xúc người lạ", "C": "Sợ tốn kém thời gian", "D": "Cả A và B đúng"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Hạn chế của đàm phán kiểu cứng là:", "options": {"A": "Lợi ích các bên giảm xuống, không đạt được những mục tiêu riêng của các bên.", "B": "Hy sinh nhiều lợi ích, tốn kém chi phí và thời gian cho việc thực hiện cam kết", "C": "Gây tình trạng căng thẳng, đàm phán dễ tan vỡ hoặc khó thực hiện sau này.", "D": "Mất lòng tin từ các đối tác dẫn đến mất quan hệ hợp tác quốc tế."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Có thể sử dụng yếu tố nào để thuyết phục trong trường hợp khách hàng cho rằng bất động sản là cao:", "options": {"A": "Yếu tố uy tín, chất lượng dịch vụ của công ty môi giới", "C": "Yếu tố bất động sản đảm bảo an toàn về mặt quy hoạch, pháp lý", "D": "Cả 3 câu trả lời trên đều đúng"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Khi chất lượng sản phẩm như nhau thì phải lấy yếu tố nào để cạnh tranh trên thị trường?", "options": {"A": "Dịch vụ khách hàng", "B": "Thông tin", "C": "Sản phẩm", "D": "Cả A, B và C đều sai"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Tình huống: Người mua đặt cọc 100 triệu đồng để mua căn nhà với giá 1.6 tỷ đồng. Người bán đổi ý không bán. Giả sử trong hợp đồng đặt cọc không có điều khoản phạt vi phạm, thì người bán phải trả tiền đặt cọc và đền bù tiền thiệt hại cho người mua theo luật, tổng cộng số tiền trả lại cộng với phạt vi phạm:", "options": {"A": "200 triệu đồng", "B": "Không phạt vi phạm", "C": "400 triệu đồng", "D": "100 triệu đồng"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Để tăng khả năng thành công khi môi giới, người môi giới cần hiểu khách hàng của mình là ai, theo đó, người môi giới cần:", "options": {"A": "Nói thật nhiều về dự án cho khách hàng", "B": "Lắng nghe khách hàng nói", "C": "Không để khách hàng nói quá nhiều", "D": "Cả A, B và C đều sai"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Chiến lược “Đẩy” áp dụng trong kinh doanh BĐS được hiểu như thế nào?", "options": {"A": "Tìm cách đưa sản phẩm đến các nhà phân phối và khách hàng bằng các chương", "B": "Tìm cách thu phục khách hàng mua sản phẩm", "C": "Tìm ra sự nhận biết về thương hiệu và sự hấp dẫn khách hàng bằng sản phẩm khác", "D": "Cả A,B,C đều đúng"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Điểm nào đặc biệt quan trọng đối với việc hoạch định chiến lược Marketing trong kinh doanh BĐS", "options": {"A": "Nhu cầu khách hàng", "B": "Chính sách nhà nước", "C": "Lợi thế cạnh tranh", "D": "Nguồn vốn"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Nguyên tắc của người môi giới muốn phát triển dài hạn là", "options": {"A": "Bằng mọi giá hướng đến thu nhập của bản thân", "B": "Làm đến đâu hay đến đó", "C": "Hướng đến khách hàng", "D": "Cả A, B và C đều sai"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Tiếp nhận sản phẩm từ Ban Giám đốc Công ty, việc đầu tiên người môi giới cần thực hiện", "options": {"A": "Lên kế hoạch marketing sản phẩm", "B": "Phân tích khách hàng", "C": "Phân tích và đánh giá sản phẩm", "D": "Lên kế hoạch tìm kiếm nguồn khách"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Khách hàng mua sản phẩm cho người môi giới là do", "options": {"A": "Sản phẩm phù hợp nhu cầu", "B": "Được người khác giới thiệu cho người môi giới", "C": "Nhân viên tư vấn rõ ràng, phục vụ nhiệt tình, chu đáo", "D": "Cả A và C đều đúng"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Căn nhà giao dịch với giá 3,5 tỷ đồng. Ngân hàng định giá 2,7 tỷ đồng và ngân hàng cho vay 70% giá trị của BĐS, vậy số tiền ngân hàng cho vay là:", "options": {"A": "1,75 tỷ đồng", "B": "1,32 tỷ đồng", "C": "1,89 tỷ đồng", "D": "2,45 tỷ đồng"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Phong cách đàm phán cùng có lợi, hai bên cùng nhất trí với nhau về mục tiêu chung, không giấu diếm thông tin về nhau, không làm phương hại lợi ích của hai bên... đó là cách đàm phán", "options": {"A": "Một bên chiến thắng một bên thất bại", "B": "Hai bên cùng thắng", "C": "Thỏa hiệp", "D": "Thua - Thua"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Thuật ngữ dùng để miêu tả số phần trăm của giá trị đã được định giá của một tài sản mà tổ chức tài chính sẽ cho vay gọi là", "options": {"A": "Tỷ lệ tài sản bị giữ lại (của người bán bất động sản)", "B": "Chứng nhận giá trị tài sản hợp lý", "C": "Tỷ lệ khoản vay trên giá trị tài sản", "D": "Khoản đầu tư vốn"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Xác định và đánh giá trước người mua:", "options": {"A": "Thực hiện việc kết thúc giao dịch", "B": "Xác định động cơ thúc đẩy của người mua", "C": "Giúp người đại diện biết mình nên giới thiệu căn nhà nào cho khách mua.", "D": "Tất cả A, B, C đều đúng"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Mục tiêu cuối cùng của quy trình môi giới bất động sản là gì?", "options": {"A": "Bán được sản phẩm nhanh nhất", "B": "Thu phí môi giới cao nhất", "C": "Hoàn tất giao dịch đúng pháp luật, thỏa mãn lợi ích các bên", "D": "Mở rộng mạng lưới khách hàng cá nhân"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Trong tư vấn bán hàng, yếu tố quyết định thành công của người môi giới chuyên nghiệp là:", "options": {"A": "Thái độ đối với khách hàng và đối với công việc", "B": "Năng lực truyền đạt ý tưởng và kiến thức một cách hiệu quả", "C": "Liên tục phát triển Tri thức nhà nghề, kỹ năng cá nhân và nghiệp vụ", "D": "Cả A, B, C đều đúng"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Một hợp đồng môi giới nói chung có thể bị hủy giữa hai bên nếu:", "options": {"A": "Người bán đi vắng vào ngày kết thúc hợp đồng", "B": "Có yêu cầu môi giới khác quan trọng hơn", "C": "Sự gian lận bị phát hiện", "D": "Một bên thay đổi quyết định"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Công tác chuẩn bị tiếp xúc khách hàng đóng vai trò như thế nào trong quy trình môi giới?", "options": {"A": "Tiền đề để tiếp xúc đạt hiệu quả.", "B": "Dẫn dắt và chủ động trong giao tiếp đàm phán.", "C": "Phòng ngừa các rủi ro trong giao dịch.", "D": "Cả A, B và C"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Tình huống: Trong hợp đồng mua bán nhà ở có quy định về đặc điểm chính của nhà ở mua bán như sau: Diện tích sử dụng căn hộ F là: 55,04 m2 (được tính theo kích thước thông thủy theo quy định của pháp luật về nhà ở). Diện tích này là tạm tính và có thể tăng lên hoặc giảm đi theo thực tế đo đạc tại thời điểm bàn giao căn hộ. Bên Mua có trách nhiệm thanh toán số tiền mua căn hộ cho bên Bán theo diện tích thực tế khi bàn giao căn hộ; Trong trường hợp diện tích thực tế bằng hoặc chênh lệch thấp hơn 3% so với diện tích ghi trong hợp đồng này thì hai bên không phải điều chỉnh lại gía bán căn hộ. Nếu diện tích thực tế chênh lệch vượt quá 3% so với diện tích ghi trong hợp đồng này thì giá bán của căn hộ sẽ được điều chỉnh lại theo diện tích đo đạc thực tế khi bàn giao căn hộ. Khi bàn giao cho khách hàng căn hộ F có diện tích là 51,24 m2, khách hàng được quyền:", "options": {"A": "Nhận căn hộ và thanh toán theo diện tích thực tế", "B": "Nhận căn hộ và thanh toán theo hợp đồng đã ký", "C": "Từ chối nhận căn hộ và yêu cầu chủ đầu tư đổi căn hộ khác có diện tích thương lượng", "D": "Yêu cầu chủ đầu tư bồi thường giá trị hợp đồng đã thanh toán"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Hành vi nào thể hiện kỹ năng quản lý thời gian tốt của môi giới?", "options": {"A": "Gặp khách bất cứ lúc nào khách yêu cầu", "B": "Chuẩn bị nội dung làm việc rõ ràng trước mỗi buổi gặp", "C": "Kéo dài thời gian tư vấn để tạo ấn tượng", "D": "Chỉ làm việc theo cảm hứng"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Để môi giới thành công, môi giới viên cần khắc phục 3 bất đồng, đó là các yếu tố sau, ngoại trừ:", "options": {"A": "Bất đồng trong giao tiếp", "B": "Bất đồng trong mục tiêu của công việc", "C": "Bất đồng về sự đối kháng", "D": "Bất đồng về sự tin tưởng"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Trong tình hình thị trường bất động sản bị đóng băng, khi một người dự định bán bất động sản của mình, anh ta nên quảng cáo ở đâu thì có lợi và tốn ít chi phí nhất?", "options": {"A": "Tự treo bảng trước nhà hoặc những nơi dễ nhìn thấy", "B": "Thông qua sàn giao dịch bất động sản hoặc các công ty môi giới", "C": "Thông qua phương tiện truyền thông đại chúng", "D": "Sử dụng tổng hợp các phương tiện"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Một nhà môi giới địa ốc hai đầu (hoặc hai mang) làm việc:", "options": {"A": "Như là một đại lý hoặc cộng tác viên cho công ty môi giới địa ốc", "B": "Làm việc cho cả người bán và người mua", "C": "Cơ bản cho người mua", "D": "Làm việc cơ bản cho người bán"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Khi nhận dịch vụ do người môi giới bất động sản cung cấp, người đầu tư mong chờ người môi giới giúp ra các quyết định:", "options": {"A": "Cho biết bất động sản nào nên mua/bán", "B": "Cho biết thông tin mới nhất về những gì đang diễn ra trên thị trường", "C": "Cho biết giá cả hợp lý nên mua/bán", "D": "Cho biết bất động sản nào nên mua/bán với giá cả và các dịch vụ kèm theo theo"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Ông Tân chưa có nhà ở, đang chuẩn bị mua một căn nhà với một khoản vay trả góp từ ngân hàng, và đang yêu cầu thẩm định căn nhà định mua đó. Việc thẩm định này có ý nghĩa gì thiết thực nhất cho ông Tân?", "options": {"A": "Xác định liệu giá trị của căn nhà có thể làm tài sản thế chấp có thỏa mãn điều kiện cho vay của ngân hàng hay không", "B": "Xác định liệu chủ nhà đã bán đúng giá thị trường hay không", "C": "Xác định xem ông Tân đã thực hiện một cuộc đầu tư tốt và sinh lợi", "D": "Xác định tình trạng thực tế của căn nhà có đáp ứng yêu cầu của ông Tân hay không"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Khi môi giới, nhà môi giới sẽ gặp nhiều điều kiện thuận lợi hơn khi nắm bắt được định hướng lâu dài về truyền thống và giá trị tư tưởng trong xã hội của khách hàng. Đặc điểm nào sau đây không thuộc phạm trù xã hội theo định hướng lâu dài?", "options": {"A": "Nêu cao đạo đức trong công việc", "B": "Đặt ra những chính sách dài hạn", "C": "Quan tâm đến những lợi ích lâu dài", "D": "Chú trọng áp dụng những tiến bộ kỹ thuật của khoa học công nghệ"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Câu phát biểu nào sau đây sai liên quan đến tố chất của nhà môi giới?", "options": {"A": "Ngôn ngữ rõ ràng, kỹ năng giao tiếp tốt", "B": "Lắng nghe tích cực", "C": "Nhà môi giới là người hiểu biết, thông minh nhưng ở mức độ cao hơn do tích lũy nhiều kiến thức và biết sử dụng chúng", "D": "Biết đặt câu hỏi tập trung, giải quyết thẳng vấn đề."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Một hợp đồng ký gửi nên xác định nghĩa vụ của tổ chức môi giới (văn phòng môi giới/sàn) và của khách hàng.", "options": {"A": "Ngày kết thúc hợp đồng mong đợi", "B": "Quan điểm đàm phán về giá và phương thức mua bán", "C": "Đại diện quyền bán bất động sản cho người bán", "D": "Hướng dẫn của khách hàng"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Khi khách hàng liên tục so sánh giá với BĐS rẻ hơn, môi giới nên làm gì?", "options": {"A": "Chỉ tập trung bảo vệ giá bán", "B": "Chê các sản phẩm giá rẻ", "C": "Làm rõ sự khác biệt về giá trị và rủi ro giữa các sản phẩm", "D": "Khuyên khách không nên mua"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Bán hàng tư vấn trong môi giới là phương pháp bán hàng được triển khai theo chiều rộng một cách logic trên các cơ sở sau, ngoại trừ:", "options": {"A": "Người môi giới phải cố gắng đáp ứng nhu cầu của khách hàng bằng các sản phẩm thích hợp", "B": "Người môi giới cố gắng đáp ứng nhu cầu của khách hàng một cách tốt nhất bằng các sản phẩm hay dịch vụ của mình", "C": "Phương pháp bán hàng truyền thống", "D": "Người môi giới cố gắng tìm hiểu những hàng hóa, sản phẩm khách hàng cần"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Đối với khách hàng, một dịch vụ môi giới bất động sản có chất lượng là:", "options": {"A": "Dịch vụ có chi phí thấp", "B": "Dịch vụ khác biệt so với đối thủ cạnh tranh", "C": "Dịch vụ khách hàng quan tâm và khác biệt với đối thủ cạnh tranh", "D": "Dịch vụ đáp ứng và vượt qua sự kỳ vọng của khách hàng."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Trong quy trình môi giới, việc xác minh thông tin chủ sở hữu BĐS nhằm mục đích gì?", "options": {"A": "Đảm bảo giao dịch đúng pháp luật và hạn chế rủi ro tranh chấp", "B": "Tăng tốc độ bán hàng", "C": "Thu phí môi giới nhanh hơn", "D": "Tạo lợi thế đàm phán giá"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Khi phát hiện bất động sản có vấn đề pháp lý chưa hoàn chỉnh, môi giới nên làm gì?", "options": {"A": "Giấu thông tin để không làm mất khách", "B": "Chuyển sang giới thiệu sản phẩm khác", "C": "Tự ý cam kết thay chủ nhà", "D": "Thông tin rõ cho khách và khuyến nghị giải pháp phù hợp"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Trong bước tiếp xúc ban đầu, môi giới nên ưu tiên điều gì nhất?", "options": {"A": "Giới thiệu toàn bộ danh sách sản phẩm", "B": "Xây dựng thiện cảm và sự tin cậy với khách hàng", "C": "Thuyết phục khách ký hợp đồng môi giới", "D": "Trao đổi chi tiết về giá cả"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Nội dung nào sau đây không được quy định trong hợp đồng mua bán, cho thuê, cho thuê mua nhà, công trình xây dựng:", "options": {"A": "Diện tích bất động sản", "B": "Giá bán của bất động sản", "C": "Hoa hồng môi giới bất động sản", "D": "Thông tin bên mua/bên thuê và bên bán/bên cho thuê"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Đâu là tiến trình cơ bản của cuộc đàm phán:", "options": {"A": "Giai đoạn chuẩn bị, Giai đoạn xúc tiến, Giai đoạn đàm phán, Giai đoạn kết thúc", "B": "Giai đoạn chuẩn bị, Giai đoạn đàm phán, Giai đoạn xúc tiến, Giai đoạn kết thúc", "C": "Giai đoạn chuẩn bị, Giai đoạn đàm phán, Giai đoạn kết thúc, Giai đoạn xúc tiến", "D": "Cả A, B, C đều sai"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Đâu là nguyên tắc có thể dẫn đến đàm phán trong kinh doanh thành công:", "options": {"A": "Nhà đàm phán có những định kiến với đối tác.", "B": "Nhà đàm phán luôn nói nhiều thay vì hỏi nhiều.", "C": "Nhà đàm phán phải xác định rõ mục tiêu đàm phán và luôn bám sát nó trong", "D": "Nhà đàm phán ngồi vào bàn đàm phán chỉ với 1 phương án duy nhất mà không"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Phát biểu nào sau đây là đúng?", "options": {"A": "Phương thức tính lãi kép là chỉ có vốn gốc sinh lãi trong mọi kỳ hạn", "B": "Phương thức tính lãi kép là vốn gốc nhập lãi vào cuối mỗi kỳ trở thành vốn gốc mới để sinh lợi cho kỳ kế tiếp.", "C": "Phương thức tính lãi kép là vốn gốc nhập lãi vào cuối kỳ đầu tiên, các kỳ tiếp theo chỉ có vốn gốc sinh lãi trong mọi kỳ hạn.", "D": "Cả A, B, C đều sai."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Thứ tự các bước trong thực hiện thương vụ môi giới là:", "options": {"A": "Ký hợp đồng khởi điểm - Ký hợp đồng công chứng - Ký hợp đồng đặt cọc - Giao nhận bất động sản.", "B": "Ký hợp đồng đặt cọc - Ký kết hợp đồng khởi điểm - Giao nhận bất động sản - Ký hợp đồng công chứng.", "C": "Ký hợp đồng khởi điểm - Ký hợp đồng đặt cọc - Ký hợp đồng công chứng - Giao nhận bất động sản.", "D": "Ký hợp đồng công chứng - Ký hợp đồng đặt cọc - Ký hợp đồng khởi điểm - Giao nhận bất động sản"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Trình tự các bước xử lý phản đối của khách hàng là:", "options": {"A": "Thăm dò để hiểu - thừa nhận phản đối - trả lời phản đối - thăm dò sự chấp thuận", "B": "Thừa nhận phản đối - thăm dò để hiểu - trả lời phản đối - thăm dò sự chấp thuận", "C": "Thừa nhận phản đối - trả lời phản đối - thăm dò để hiểu - thăm dò sự chấp thuận", "D": "Cả A, B, C đều sai"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Yếu tố nào ảnh hưởng đến marketing mà công ty có thể kiểm soát được?", "options": {"A": "Nhân viên bán hàng", "B": "Chính phủ", "C": "Các lực lượng xã hội", "D": "Đối thủ cạnh tranh"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Nội dung nào sau đây không thuộc nội dung của chiến lược xúc tiến bán hàng?", "options": {"A": "Quảng cáo", "B": "Chào hàng cá nhân.", "C": "Xác lập kênh phân phối.", "D": "Khuyến mãi."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Kỹ năng chăm sóc khách hàng sau giao dịch nhằm mục đích chính nào sau đây?", "options": {"A": "Yêu cầu khách giới thiệu thêm khách mới", "B": "Thu thêm phí dịch vụ", "C": "Xây dựng mối quan hệ lâu dài và uy tín cá nhân", "D": "Tránh trách nhiệm phát sinh"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Đâu là đặc điểm của giao tiếp kiểu Thắng - Thắng?", "options": {"A": "Cả hai bên giao tiếp đều kiên quyết giữ vững lập trường, mối quan hệ trở nên", "B": "Mục đích của giao tiếp là làm sao cố gắng đè bẹp đối phương bằng mọi cách.", "C": "Cả A, B đều đúng", "D": "Mọi người luôn mong muốn tìm lợi ích chung, làm cho các bên đều thỏa mãn nhu cầu của mình"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Đâu là đặc điểm của kiểu giao tiếp “Thua - Thua”?", "options": {"A": "Cả hai bên giao tiếp đều kiên quyết giữ vững lập trường, mối quan hệ trở nên", "B": "Mọi người luôn mong muốn tìm lợi ích chung, làm cho các bên đều thỏa mãn nhu cầu của mình", "C": "Cả A, B đều sai", "D": "Mục đích của giao tiếp là làm sao cố gắng đè bẹp đối phương bằng mọi cách."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Khi tiếp nhận sản phẩm từ một dự án khu căn hộ cao cấp, việc đầu tiên nhà môi giới nên làm là:", "options": {"A": "Lên kế hoạch tìm kiếm khách hàng tiềm năng", "B": "Lên kế hoạch chạy quảng cáo", "C": "Tìm hiểu về sản phẩm", "D": "Không phải các hoạt động trên"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Những điều cần tránh làm khi giới thiệu sản phẩm bất động sản là:", "options": {"A": "Luôn luôn dùng từ ngữ chuyên môn", "B": "Gợi ý những viễn cảnh tốt đẹp nếu khách hàng mua sản phẩm", "C": "Chỉ ra những lợi ích tăng thêm cho khách hàng.", "D": "Giới thiệu bằng trực quan sống động"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Điều cần tránh trong đàm phán kinh doanh là:", "options": {"A": "Biết sử dụng từ ngữ một cách khôn khéo, linh hoạt.", "B": "Chú ý lắng nghe đối tác.", "C": "Xác định rõ mục tiêu đàm phám và bám sát nó trong suốt quá trình đàm phán", "D": "Ngồi vào bàn đàm phán với định kiến"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Trong khi chào hàng hay giới thiệu bất động sản, vấn đề nào là quan trọng nhất cần được trình bày?", "options": {"A": "Sản phẩm sẽ đem lại lợi ích gì cho người mua.", "B": "Đặc điểm nổi bật trong thiết kế.", "C": "Giá cả sản phẩm bán ra.", "D": "Không phải các vấn đề trên"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Trong bốn tiêu chí sau, tiêu chí nào ảnh hưởng ít nhất đến quyết định mua bất động sản:", "options": {"A": "Mối quan hệ trong gia đình.", "B": "Vị trí của bất động sản.", "C": "Tiến trình đàm phán.", "D": "Giá cả của bất động sản."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Đâu là sai lầm khi viết email giới thiệu bất động sản cho khách hàng?", "options": {"A": "Giới thiệu rõ về sản phẩm.", "B": "Lựa chọn từ ngữ, cách xưng hô không phù hợp.", "C": "Nhấn mạnh đặc điểm nổi trội của sản phẩm.", "D": "Cả A, B, C đều sai."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Một nhà bất động sản giúp các khách hàng chọn lựa những phương án khác nhau (bao gồm mua, thuê, hoặc đầu tư bất động sản). Công việc nhà bất động sản đang làm là gì?", "options": {"A": "Môi giới bất động sản.", "B": "Định giá bất động sản.", "C": "Tư vấn bất động sản.", "D": "Đào tạo bất động sản."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Nhà môi giới bất động sản nên:", "options": {"A": "Phàn nàn về khách hàng cũ .", "B": "Tâng bốc quá sự thật về bất động sản giao dịch.", "C": "Thúc đẩy khách mua bằng cách cho rằng giá trị của bất động sản là hợp lý.", "D": "Giới thiệu bất động sản bằng trực quan sinh động."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Khi khách hàng yêu cầu so sánh nhiều bất động sản cùng  ý kiến phản hồi tiêu cực khi bạn đang trong buổi giao tiếp với khách, bạn nên:", "options": {"A": "Nổi giận và cố gắng bảo vệ quan điểm của mình.", "B": "Lắng nghe, ghi nhận và tìm cách cải thiện vấn đề", "C": "Bỏ về khi buổi giao tiếp chưa kết thúc.", "D": "Phủ nhận vấn đề, xin lỗi hoặc biện hộ cho sự thiếu hiểu biết của mình"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Để trình bày hiệu quả, tránh gây hiểu lầm cho đối phương trong quá trình đàm phán, nhà môi giới nên:", "options": {"A": "Lập luận đúng mực, lịch sự, tế nhị.", "B": "Trình bày với thái độ nhã nhặn, tự tin; tốc độ nói vừa phải; ngắn nhịp câu đúng", "C": "Sử dụng câu có cấu trúc ngắn gọn, các khái niệm và thuật ngữ đơn giản, rõ ràng.", "D": "Khi trình bày hướng về phía người ra quyết định"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Khi nào giao tiếp bằng văn bản phù hợp hơn giao tiếp trực tiếp?", "options": {"A": "Khi bạn muốn trình bày một ý tưởng ngắn gọn", "B": "Khi bạn muốn trình bày một ý tưởng phức tạp, đòi hỏi thời gian nghiên cứu", "C": "Khi bạn muốn đưa ra nhiều câu hỏi.", "D": "Khi bạn muốn nhanh chóng nhận được ý kiến trả lời về một vấn đề."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Để truyền tải một thông điệp hiệu quả khi giao tiếp trực tiếp, đâu là yếu tố chiếm vai trò quan trọng nhất:", "options": {"A": "Hình ảnh và cử chỉ.", "B": "Không phải các yếu tố trên.", "C": "Nội dung thông điệp.", "D": "Giọng nói."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Trong Quy trình môi giới bất động sản, yếu tố nào đặc biệt quan trọng cho sự thành công chốt giao dịch của một môi giới viên?", "options": {"A": "Tư vấn, tiếp thị, thương lượng", "B": "Thực hiện giao dịch", "C": "Khai thác khách hàng tiềm năng, tiếp nhận yêu cầu của khách hàng", "D": "Kết thúc giao dịch, duy trì và chăm sóc khách hàng"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Khi đàm phán về giá, chủ bán bất động sản khư khư không giảm answer": "D", "explanation": ""}, {"level": "1", "content": "Tiến trình ra quyết định mua một bất động sản của khách hàng, bắt đầu bằng:", "options": {"A": "Thu nhập.", "B": "Nhận thức được nhu cầu.", "C": "Tìm kiếm thông tin.", "D": "Lựa chọn các giải pháp."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Khi giới thiệu bán hàng, nhân viên môi giới BĐS cần tập trung vào 3 yếu tố chính nào?", "options": {"A": "Giá bán, đặc điểm sản phẩm, thời gian bảo hành.", "B": "Đặc điểm sản phẩm, giá bán, phương thức thanh toán.", "C": "Đặc điểm sản phẩm, lợi ích sản phẩm, đưa ra bằng chứng.", "D": "Đặc điểm sản phẩm, giá bán, khuyến mãi."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Tranh thủ sự tín nhiệm của bạn bè thân, đề nghị họ giới thiệu hoặc cung cấp danh sách khách hàng và được lặp lại nhiều lần là đặc điểm của cách tiếp cận khách hàng theo kiểu:", "options": {"A": "Tận dụng người tốt trong xã hội", "B": "Tiêu thụ lặp lại", "C": "Tiêu thụ trực tiếp", "D": "Giới thiệu dây chuyền"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Để tìm được nguồn BĐS phù hợp nhu cầu, thông tin cơ bản nhất cần thu<br>thập từ khách hàng là", "options": {"A": "Yêu cầu về giao thông, cơ sở hạ tầng kỹ thuật, giá cả … của BĐS", "B": "Mục tiêu sử dụng BĐS", "C": "Khả năng tài chính của khách hàng", "D": "Nghề nghiệp, độ tuổi của khách hàng"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Khi kết thúc thương vụ, người môi giới BĐS cần phải chú ý gì?", "options": {"A": "Theo dõi, hỗ trợ các bên trong việc hoàn chỉnh hồ sơ; xem tính hợp pháp của", "B": "Lấy tiền hoa hồng ngay, tránh bị \"luồn cò”", "C": "Tham gia ký hợp đồng thoả thuận, thời gian giao nhận tiền và ký hợp đồng mua bán, giao nhận BĐS, các điều khoản về vi phạm hợp đồng, các loại giấy tờ còn đang thiếu, tham gia vào quá trình thanh toán, nhận tiền hoa hồng", "D": "Hoàn thành nghĩa vụ, tìm kiếm khách hàng mới"}, "answer": "C", "explanation": ""}];
        let quizData = [];
        let currentIndex = 0;

        window.onload = function() {
            try {
                if(!allData || allData.length === 0) {
                    document.getElementById("quiz-container").innerHTML = "<h3 style='color:red; text-align:center;'>Lỗi: Không có dữ liệu câu hỏi!</h3>";
                    return;
                }
                quizData = getSampledQuestions(100);
                renderQuestion();
            } catch(e) {
                alert("Lỗi khởi tạo hệ thống: " + e.message);
            }
        };

        function getSampledQuestions(count) {
            const shuffle = (arr) => arr.sort(() => Math.random() - 0.5);
            const filterLvl = (l) => allData.filter(q => String(q.level) === String(l));
            
            let p1 = shuffle(filterLvl("1")); let p2 = shuffle(filterLvl("2"));
            let p3 = shuffle(filterLvl("3")); let p4 = shuffle(filterLvl("4")); let p5 = shuffle(filterLvl("5"));

            let n1 = Math.round(count * 0.25); let n2 = Math.round(count * 0.25);
            let n3 = Math.round(count * 0.20); let n4 = Math.round(count * 0.20);
            let n5 = count - (n1 + n2 + n3 + n4);

            let selected = [ ...p1.splice(0, n1), ...p2.splice(0, n2), ...p3.splice(0, n3), ...p4.splice(0, n4), ...p5.splice(0, n5) ];

            if(selected.length < count) {
                let remain = shuffle([...p1, ...p2, ...p3, ...p4, ...p5]);
                selected = [...selected, ...remain.splice(0, count - selected.length)];
            }
            return shuffle(selected).slice(0, count);
        }

        function renderQuestion() {
            try {
                if (!quizData[currentIndex]) return;
                const q = quizData[currentIndex];
                
                // Nhận diện CHỌN NHIỀU ĐÁP ÁN cực kỳ an toàn
                let qContentLower = q.content ? q.content.toLowerCase() : "";
                const isMulti = (q.answer && q.answer.includes(",")) || qContentLower.includes("(chọn 2");
                const multiHint = isMulti ? "<span class='q-hint'>* Câu hỏi này yêu cầu chọn nhiều đáp án</span>" : "";
                
                document.getElementById("progress-text").innerText = `Câu ${currentIndex + 1} / ${quizData.length}`;
                
                let optHtml = "";
                let hasOptions = false;
                
                ['A','B','C','D'].forEach(lbl => {
                    if(q.options && q.options[lbl]) {
                        hasOptions = true;
                        optHtml += `
                            <label class="option-item" id="label-${lbl}">
                                <input type="${isMulti ? 'checkbox' : 'radio'}" name="q_opt" value="${lbl}" onchange="updateSelection()">
                                <b>${lbl}.</b> ${q.options[lbl]}
                            </label>`;
                    }
                });

                if(!hasOptions) {
                    optHtml = "<div style='color:red; background:#ffebee; padding:10px; border-radius:5px;'><i>⚠️ Lỗi: Không trích xuất được đáp án. (Kiểm tra lại tính năng đánh số tự động trong Word).</i></div>";
                }

                // Chống gãy chuỗi vì ký tự ngắt dòng
                let safeContent = q.content || "";
                safeContent = safeContent.split('\n').join('<br>');

                document.getElementById("quiz-container").innerHTML = `
                    <div class="card">
                        <div class="q-meta">MỨC ĐỘ THỬ THÁCH: ${q.level || '1'}</div>
                        <div class="q-text">${safeContent}</div>
                        ${multiHint}
                        <div class="options">${optHtml}</div>
                        
                        <button id="btn-check" class="btn-check-inline" onclick="checkAnswer()">Kiểm tra đáp án</button>
                        
                        <div id="exp-box" class="exp-box"></div>
                    </div>`;
                window.scrollTo(0,0);
            } catch(e) {
                alert("Lỗi hiển thị câu hỏi: " + e.message);
            }
        }

        function updateSelection() {
            document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
            document.querySelectorAll('input:checked').forEach(el => el.parentElement.classList.add('selected'));
        }

        function checkAnswer() {
            try {
                const q = quizData[currentIndex];
                const box = document.getElementById("exp-box");
                const btn = document.getElementById("btn-check");
                
                const checkedInputs = document.querySelectorAll('input[name="q_opt"]:checked');
                const selectedVals = Array.from(checkedInputs).map(i => i.value).sort().join(",");
                
                if (!selectedVals) {
                    alert("⚠️ Vui lòng chọn phương án trước khi kiểm tra!");
                    return;
                }

                btn.style.display = "none";
                box.style.display = "block";

                let resultTitle = "";
                if (selectedVals === q.answer) {
                    resultTitle = `<div class="result-title" style="color: var(--success);">✔ CHÍNH XÁC!</div>`;
                    box.style.borderLeftColor = "var(--success)";
                } else {
                    resultTitle = `<div class="result-title" style="color: var(--error);">✘ SAI RỒI! (Bạn chọn: ${selectedVals})</div>`;
                    box.style.borderLeftColor = "var(--error)";
                }

                ['A','B','C','D'].forEach(lbl => {
                    const el = document.getElementById(`label-${lbl}`);
                    if(!el) return;
                    
                    if(q.answer && q.answer.includes(lbl)) {
                        el.classList.add('correct-ans');
                    } else if(selectedVals.includes(lbl)) {
                        el.classList.add('wrong-ans');
                    }
                    
                    const input = el.querySelector('input');
                    if(input) input.disabled = true;
                });

                box.innerHTML = `
                    ${resultTitle}
                    <div style="margin-bottom:12px; font-size:1.05em;"><b>Đáp án đúng:</b> <span style="color:var(--success); font-weight:bold">${q.answer || "Không rõ"}</span></div>
                    <div>${q.explanation || "<i>Hệ thống chưa cập nhật giải thích cho câu này.</i>"}</div>
                `;

                box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } catch(e) {
                alert("Lỗi xử lý đáp án: " + e.message);
            }
        }

        function nextQ() { if(currentIndex < quizData.length-1) { currentIndex++; renderQuestion(); } }
        function prevQ() { if(currentIndex > 0) { currentIndex--; renderQuestion(); } }
    </script>
</body>
</html>
