ions": {"A": "Luật Doanh nghiệp và Luật thuế GTGT", "B": "Luật Nhà ở và Luật thuế TNDN", "C": "Luật Đầu tư và Luật Đất đai.", "D": "Luật Thuế và Luật Chứng khoán."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Theo Luật kinh doanh bất động sản năm 2023, trường hợp các cá<br>nhân mua bán nhà ở với nhau thì hợp đồng mua bán đó có cần công chứng,<br>chứng thực không ?", "options": {"A": "Không cần thiết.", "B": "Tùy thỏa thuận giữa các bên.", "C": "Chỉ cần nếu giá trị giao dịch lớn.", "D": "Bắt buộc phải công chứng hoặc chứng thực."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Theo Luật Doanh nghiệp 2020, cá nhân nào dưới đây có quyền<br>thành lập doanh nghiệp Kinh doanh bất động sản?", "options": {"A": "Người đủ 18 tuổi trở lên, có đầy đủ năng lực hành vi dân sự, không bị cấm bởi", "B": "Cán bộ, công chức, viên chức", "C": "Người chưa đủ 18 tuổi", "D": "Người đang bị cấm hành nghề theo bản án có hiệu lực"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Cơ quan nào có thẩm quyền cấp Giấy chứng nhận đăng ký doanh<br>nghiệp ?", "options": {"A": "Ủy ban nhân dân cấp xã.", "B": "Bộ Tài chính.", "C": "Phòng Đăng ký kinh doanh thuộc Sở Tài chính.", "D": "Cơ quan thuế."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Thủ tục nào theo Luật Đầu tư 2020 thường áp dụng cho các dự án<br>BĐS quy mô lớn?", "options": {"A": "Chỉ cần xin Giấy phép xây dựng.", "B": "Chỉ cần thẩm định giá đất.", "C": "Chỉ cần đăng ký kinh doanh.", "D": "Chấp thuận chủ trương đầu tư."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Vốn pháp định tối thiểu để thành lập doanh nghiệp Kinh doanh bất<br>động sản là:", "options": {"A": "100 triệu đồng", "B": "20 tỷ đồng", "C": "10 tỷ đồng", "D": "Không còn yêu cầu vốn pháp định"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Văn bản pháp luật nào hiện đang là văn bản pháp luật có hiệu lực<br>cao nhất quy định về phòng chống rửa tiền tại Việt Nam?", "options": {"A": "Nghị định 19/2023/NĐ-CP", "B": "Luật Phòng, chống rửa tiền số 14/2022/QH15", "C": "Thông tư 09/2023/TT-NHNN", "D": "Bộ luật Hình sự 2015 (sửa đổi 2017)"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Theo Luật phòng, chống rửa tiền 2022, \"Rửa tiền\" được định nghĩa<br>là gì?", "options": {"A": "Hành vi sử dụng tài sản để tài trợ khủng bố.", "B": "Hành vi của tổ chức, cá nhân nhằm hợp pháp hóa nguồn gốc của tài sản do", "C": "Hành vi không báo cáo giao dịch đáng ngờ.", "D": "Hành vi che giấu nguồn gốc tài sản hợp pháp."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Doanh nghiệp Kinh doanh bất động sản phải báo cáo giao dịch có<br>giá trị lớn khi nào?", "options": {"A": "Khi giao dịch có dấu hiệu đáng ngờ, bất kể giá trị.", "B": "Chỉ khi giao dịch với khách hàng là người nước ngoài.", "C": "Khi thực hiện bất kỳ giao dịch bất động sản nào.", "D": "Khi giao dịch bằng tiền mặt hoặc ngoại tệ tiền mặt đạt từ 400 triệu trở lên trong"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Ai chịu trách nhiệm chính trong việc triển khai các biện pháp phòng<br>chống rửa tiền tại một doanh nghiệp Kinh doanh bất động sản?", "options": {"A": "Doanh nghiệp bất động sản đó.", "B": "Khách hàng.", "C": "Ngân hàng Nhà nước.", "D": "Nhân viên môi giới."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Việc đánh giá rủi ro phòng, chống rửa tiền của doanh nghiệp bất<br>động sản cần được cập nhật với tần suất như thế nào?", "options": {"A": "Hàng năm.", "B": "Chỉ khi có thay đổi lớn trong hoạt động kinh doanh.", "C": "Khi có yêu cầu từ ngân hàng nhà nước.", "D": "Định kỳ 05 năm một lần."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Tiêu chuẩn \"biết hoặc có cơ sở để biết\" trong Tội rửa tiền có thể<br>KHÔNG bao gồm trường hợp nào?", "options": {"A": "Thông tin được đăng tải rộng rãi trên phương tiện thông tin đại chúng.", "B": "Suy luận từ việc mua tài sản với giá rẻ bất thường.", "C": "Người phạm tội nguồn thông báo trực tiếp.", "D": "Nhận được tài sản từ người thân mà không nghi ngờ gì về nguồn gốc."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Khung hình phạt tù cơ bản theo khoản 1 điều 324 Luật Hình sự<br>2017 đối với cá nhân phạm tội rửa tiền là bao nhiêu:", "options": {"A": "05 năm đến 10 năm.", "B": "10 năm đến 15 năm.", "C": "01 năm đến 05 năm.", "D": "06 tháng đến 03 năm."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Hình phạt nào sau đây có thể được áp dụng đối với pháp nhân<br>thương mại phạm tội rửa tiền?", "options": {"A": "Phạt tù đối với người đại diện theo pháp luật.", "B": "Đình chỉ hoạt động vĩnh viễn.", "C": "Cải tạo không giam giữ.", "D": "Cảnh cáo."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Điều kiện nào KHÔNG phải là điều kiện bắt buộc để truy cứu trách<br>nhiệm hình sự pháp nhân thương mại về Tội rửa tiền?", "options": {"A": "Có sự chỉ đạo, điều hành hoặc chấp thuận của người có thẩm quyền của pháp", "B": "Hành vi phạm tội gây thiệt hại về tài sản cho Nhà nước.", "C": "Hành vi phạm tội được thực hiện nhân danh pháp nhân.", "D": "Hành vi phạm tội được thực hiện vì lợi ích của pháp nhân."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Việc tuân thủ các quy định phòng, chống rửa tiền của các doanh<br>nghiệp bất động sản mang lại lợi ích gì ngoài việc tránh bị xử phạt:", "options": {"A": "Giảm thời gian hoàn thành giao dịch.", "B": "Góp phần vào sự minh bạch và ổn định của hệ thống tài chính quốc gia.", "C": "Tăng lợi nhuận kinh doanh.", "D": "Giảm yêu cầu về vốn điều lệ."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Tại sao việc liệt kê cụ thể các \"hành vi bị nghiêm cấm\" tại Điều 8<br>Luật phòng, chống rửa tiền 2022 lại quan trọng hơn là chỉ cấm \"hành vi rửa<br>tiền\"?", "options": {"A": "Để giảm số lượng báo cáo giao dịch đáng ngờ (STR).", "B": "Để bao quát cả các hành vi tạo điều kiện, hỗ trợ hoặc cản trở công tác phòng,", "C": "Để phù hợp với quy định của Bộ luật Hình sự.", "D": "Để dễ dàng áp dụng hình phạt bổ sung."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Thông tin nào sau đây KHÔNG bắt buộc phải có trong quy định nội<br>bộ về phòng, chống rửa tiền của một đối tượng báo cáo (trừ doanh nghiệp<br>siêu nhỏ) theo hướng dẫn của Thông tư 09/2023/TT-NHNN?*", "options": {"A": "Danh sách chi tiết tất cả khách hàng và giao dịch đã thực hiện.", "B": "Quy trình báo cáo giao dịch có giá trị lớn (LCTR) và báo cáo giao dịch đáng", "C": "Quy định về đào tạo nhân viên và chỉ định cán bộ tuân thủ.", "D": "Chính sách quản lý rủi ro và phân loại khách hàng."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Việc loại trừ \"dịch vụ tư vấn bất động sản\" khỏi đối tượng báo cáo<br>phòng, chống rửa tiền có thể tạo ra kẽ hở nào?", "options": {"A": "Các công ty tư vấn không cần thực hiện xác minh danh tính đối với khách hàng", "B": "Không tạo ra kẽ hở nào vì hoạt động tư vấn không liên quan đến dòng tiền.", "C": "Các đối tượng có thể lợi dụng danh nghĩa \"tư vấn\" để cấu trúc các giao dịch", "D": "Các nhà tư vấn có thể trực tiếp nhận tiền mặt lớn mà không cần báo cáo."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Một người sử dụng tiền do tham ô mà có để mua một bất động sản<br>đứng tên con cái. Ai là người có thể bị truy cứu trách nhiệm hình sự về Tội<br>rửa tiền?", "options": {"A": "Không ai cả, vì đây là giao dịch trong gia đình.", "B": "Cả người tham ô (nếu họ thực hiện hành vi mua bán/che giấu) và người con", "C": "Chỉ người con đứng tên bất động sản.", "D": "Chỉ người thực hiện hành vi tham ô (nếu họ trực tiếp mua)."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Mối quan hệ giữa công tác phòng, chống rửa tiền và phòng, chống<br>tham nhũng là gì?", "options": {"A": "Chỉ cần chống tham nhũng thì sẽ không còn rửa tiền.", "B": "Rửa tiền thường là bước tiếp theo sau tham nhũng để hợp pháp hóa tài sản tham", "C": "Chống tham nhũng là điều kiện tiên quyết để chống rửa tiền.", "D": "Hai lĩnh vực hoàn toàn tách biệt."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Tại sao việc giám sát các giao dịch bất động sản bằng tiền mặt lại<br>được đặc biệt chú trọng trong công tác phòng, chống rửa tiền?", "options": {"A": "Vì pháp luật chỉ cho phép giao dịch BĐS bằng tiền mặt.", "B": "Vì giao dịch tiền mặt thường có giá trị thấp hơn.", "C": "Vì giao dịch tiền mặt dễ thực hiện hơn chuyển khoản.", "D": "Vì tiền mặt khó truy vết nguồn gốc và dễ dàng che giấu danh tính hơn so với"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Nếu Cục phòng, chống rửa tiền phân tích và phát hiện một mạng<br>lưới rửa tiền phức tạp từ các báo cáo giao dịch đáng ngờ, bước tiếp theo của<br>Cục là gì?", "options": {"A": "Ra quyết định xử phạt hành chính đối với các đối tượng báo cáo liên quan.", "B": "Công bố thông tin chi tiết lên trang web của ngân hàng nhà nước.", "C": "Chuyển giao thông tin, kết quả phân tích cho cơ quan điều tra có thẩm quyền để", "D": "Yêu cầu các đối tượng báo cáo tự điều tra nội bộ."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Biện pháp “trì hoãn giao dịch” được áp dụng khi nào?", "options": {"A": "Khi có căn cứ nghi ngờ giao dịch liên quan đến hành vi rửa tiền", "B": "Khi giao dịch được thực hiện theo lệnh của khách hàng", "C": "Khi khách hàng yêu cầu trì hoãn giao dịch", "D": "Khi giao dịch có giá trị nhỏ"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Một công ty bất động sản nhận được yêu cầu giao dịch qua trung<br>gian (đối tượng báo cáo) mà không rõ nguồn gốc thông tin của trung gian<br>này. Theo quy định, tổ chức cần:", "options": {"A": "Báo cáo giao dịch ngay mà không cần xác minh thông tin", "B": "Áp dụng biện pháp tạm thời (ví dụ: trì hoãn giao dịch) để kiểm tra thông tin của", "C": "Không cần kiểm tra vì trung gian đã được ủy quyền", "D": "Tiếp tục giao dịch và yêu cầu trung gian cung cấp thông tin sau"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Một doanh nghiệp cung cấp dịch vụ công chứng nhận được giao<br>dịch với giá trị lớn từ khách hàng, nhưng khách hàng không thể cung cấp<br>thông tin về nguồn gốc số tiền chuyển khoản. Trong tình huống này, hành<br>động đúng là:", "options": {"A": "Yêu cầu khách hàng ký cam kết sau giao dịch", "B": "Báo cáo giao dịch vì đây là dấu hiệu nghi ngờ rửa tiền", "C": "Tiếp tục cung cấp dịch vụ vì là giao dịch hợp pháp", "D": "Chỉ lưu trữ hồ sơ mà không cần báo cáo"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Luật nào là văn bản pháp luật nền tảng quy định các nguyên tắc<br>chung về xử phạt vi phạm hành chính tại Việt Nam?", "options": {"A": "Bộ luật Dân sự 2015", "B": "Luật kinh doanh bất động sản 2023", "C": "Luật Đất đai 2024", "D": "Luật Xử lý Vi phạm Hành chính 2020 (đã được sửa đổi, bổ sung một số điều"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Theo quy định chung, mức phạt tiền đối với tổ chức vi phạm hành<br>chính trong lĩnh vực đất đai và kinh doanh BĐS thường như thế nào so với cá<br>nhân có cùng hành vi?", "options": {"A": "Bằng một nửa cá nhân", "B": "Gấp đôi cá nhân", "C": "Bằng cá nhân", "D": "Gấp ba lần cá nhân"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Thời hiệu xử phạt vi phạm hành chính trong lĩnh vực đất đai theo<br>Nghị định 123/2024/NĐ-CP là bao lâu?", "options": {"A": "5 năm", "B": "2 năm", "C": "3 năm", "D": "1 năm"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Hành vi nào sau đây KHÔNG phải là vi phạm về chuyển mục đích<br>sử dụng đất theo Điều 8 - Điều 12 Nghị định 123/2024/NĐ-CP?", "options": {"A": "Chuyển đất ở sang đất nông nghiệp không được phép", "B": "Xây dựng nhà trên đất nông nghiệp khi chưa được phép", "C": "Tự ý chuyển đất trồng lúa sang đất trồng cây lâu năm", "D": "Chuyển đất nông nghiệp sang đất phi nông nghiệp không được phép"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Mức phạt tiền đối với hành vi chuyển mục đích sử dụng đất trái<br>phép KHÔNG phụ thuộc vào yếu tố nào sau đây?", "options": {"A": "Diện tích đất vi phạm", "B": "Thời điểm thực hiện hành vi vi phạm", "C": "Vị trí đất (nông thôn/đô thị)", "D": "Loại đất ban đầu và loại đất chuyển đến"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Biện pháp khắc phục hậu quả chính đối với hành vi chuyển mục<br>đích sử dụng đất trái phép là gì?", "options": {"A": "Tịch thu toàn bộ diện tích đất vi phạm", "B": "Buộc khôi phục lại tình trạng ban đầu của đất", "C": "Buộc nộp tiền sử dụng đất", "D": "Phạt tù người vi phạm"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Hình thức xử phạt bổ sung nào có thể áp dụng đối với tổ chức vi<br>phạm điều kiện hoạt động dịch vụ tư vấn đất đai?", "options": {"A": "Tước quyền sử dụng giấy phép/chứng chỉ hành nghề hoặc Đình chỉ hoạt động", "B": "Tịch thu phương tiện hành nghề", "C": "Buộc giải thể tổ chức", "D": "Phạt tiền gấp 3 lần"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Hình thức xử phạt bổ sung nào có thể áp dụng cho hành vi kinh<br>doanh BĐS không đủ điều kiện theo Điều 58 Nghị định 16/2022/NĐ-CP?", "options": {"A": "Buộc phá dỡ công trình", "B": "Tịch thu BĐS", "C": "Đình chỉ hoạt động kinh doanh BĐS từ 03 đến 06 tháng", "D": "Phạt tiền gấp đôi"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Biện pháp khắc phục hậu quả nào áp dụng cho hành vi thu tiền mua<br>BĐS hình thành trong tương lai vượt tỷ lệ quy định?", "options": {"A": "Buộc giảm giá bán BĐS", "B": "Buộc công khai thông tin", "C": "Buộc dừng thi công dự án", "D": "Buộc hoàn trả phần tiền thu vượt"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Hành vi không sử dụng đất trồng cây lâu năm liên tục trong bao lâu<br>thì bị coi là vi phạm (bỏ hoang đất)?", "options": {"A": "6 tháng", "B": "12 tháng", "C": "18 tháng", "D": "24 tháng"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Hành vi nào sau đây của sàn giao dịch BĐS bị phạt tiền từ 200 - 250<br>triệu đồng theo Điều 59 Khoản 3 Nghị định 16/2022/NĐ-CP?", "options": {"A": "Hoạt động không có quy chế", "B": "Đưa BĐS không đủ điều kiện lên sàn giao dịch", "C": "Thu phí dịch vụ sai quy định", "D": "Không thực hiện chế độ báo cáo"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Việc Bộ luật Dân sự 2015 quy định về hiệu lực của hợp đồng có ý<br>nghĩa gì đối với việc xử phạt hành chính trong kinh doanh BĐS?", "options": {"A": "Không liên quan đến xử phạt hành chính.", "B": "Thay thế hoàn toàn việc xử phạt hành chính.", "C": "Một hành vi vi phạm có thể vừa bị xử phạt hành chính, vừa dẫn đến hậu quả", "D": "Chỉ áp dụng nếu không có Nghị định xử phạt chuyên ngành"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Mức phạt đối với hành vi chuyển đất trồng lúa sang đất ở tại khu<br>vực đô thị (phường, thị trấn) so với cùng hành vi tại khu vực nông thôn (xã)<br>là như thế nào?", "options": {"A": "Bằng một nửa", "B": "Gấp đôi", "C": "Bằng nhau", "D": "Gấp ba lần"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Theo Nghị định 16/2022/NĐ-CP, nguyên tắc xử phạt vi phạm hành<br>chính trong lĩnh vực xây dựng, bất động sản là gì?", "options": {"A": "Chỉ xử phạt khi có đơn tố cáo", "B": "Mỗi hành vi vi phạm chỉ bị xử phạt một lần", "C": "Chỉ xử phạt cá nhân", "D": "Chỉ áp dụng hình thức phạt tiền"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Hành vi cản trở việc sử dụng đất của người khác bằng cách đào bới,<br>xây tường, làm hàng rào có mức phạt tiền như thế nào so với việc chỉ đặt vật<br>liệu gây cản trở?", "options": {"A": "Thấp hơn", "B": "Cao hơn", "C": "Bằng nhau", "D": "Tùy thuộc vào loại vật liệu"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Theo Nghị định 16/2022/NĐ-CP, biện pháp khắc phục hậu quả<br>trong xử phạt vi phạm hành chính có thể bao gồm nội dung nào sau đây?", "options": {"A": "Buộc bồi thường thiệt hại dân sự", "B": "Buộc nộp thuế bổ sung", "C": "Buộc truy cứu trách nhiệm hình sự", "D": "Buộc khôi phục lại tình trạng ban đầu"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Biện pháp khắc phục hậu quả nào áp dụng cho trường hợp sử dụng<br>giấy tờ giả trong thủ tục hành chính về đất đai?", "options": {"A": "Hủy bỏ kết quả thực hiện thủ tục hành chính đã thực hiện", "B": "Buộc làm lại giấy tờ thật", "C": "Buộc nộp lại số lợi bất hợp pháp", "D": "Buộc xin lỗi công khai"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Việc kết hợp giữa phạt tiền và các biện pháp khắc phục hậu quả cụ<br>thể (buộc khôi phục, buộc thực hiện thủ tục...) trong hệ thống xử phạt Việt<br>Nam phản ánh mục tiêu gì?", "options": {"A": "Chỉ nhằm tối đa hóa nguồn thu từ tiền phạt.", "B": "Vừa răn đe, trừng phạt, vừa khắc phục hậu quả và lập lại trật tự quản lý.", "C": "Tạo thêm công việc cho các cơ quan hành chính.", "D": "Giảm gánh nặng cho hệ thống tòa án."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Hành vi nào của cá nhân môi giới BĐS bị áp dụng hình thức xử<br>phạt bổ sung là tước chứng chỉ hành nghề (3-6 tháng)?", "options": {"A": "Môi giới đồng thời là một bên trong hợp đồng", "B": "Không có chứng chỉ hành nghề", "C": "Chứng chỉ hành nghề hết hạn", "D": "Cho người khác mượn/thuê chứng chỉ hành nghề"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Hành vi cho người khác mượn hoặc sử dụng chứng chỉ hành nghề<br>môi giới bất động sản của người khác bị xử phạt như thế nào?", "options": {"A": "Không bị xử phạt", "B": "Chỉ bị nhắc nhở", "C": "Bị phạt tiền và bị thu hồi chứng chỉ", "D": "Chỉ bị đình chỉ hoạt động sàn giao dịch"}, "answer": "", "explanation": ""}, {"level": "1", "content": "Hành vi xây dựng sai nội dung giấy phép xây dựng được cấp sẽ bị<br>xử lý theo nguyên tắc nào sau đây?", "options": {"A": "Không xử phạt nếu không thay đổi công năng", "B": "Bị xử phạt vi phạm hành chính và buộc khắc phục theo quy định", "C": "Chỉ bị xử phạt nếu có khiếu nại", "D": "Chỉ xử phạt chủ đầu tư, không áp dụng biện pháp khác"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Theo Nghị định 16/2022/NĐ-CP, hành vi xây dựng công trình không<br>có giấy phép xây dựng trong trường hợp phải có giấy phép được xử lý như<br>thế nào?", "options": {"A": "Chỉ bị nhắc nhở bằng văn bản", "B": "Không bị xử phạt nếu công trình đã hoàn thành", "C": "Bị xử phạt vi phạm hành chính và áp dụng biện pháp khắc phục hậu quả", "D": "Chỉ bị xử phạt khi gây thiệt hại cho bên thứ ba"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Việc kết hợp giữa phạt tiền và các biện pháp khắc phục hậu quả cụ<br>thể (buộc khôi phục, buộc thực hiện thủ tục...) trong hệ thống xử phạt Việt<br>Nam phản ánh mục tiêu gì?", "options": {"A": "Chỉ nhằm tối đa hóa nguồn thu từ tiền phạt.", "B": "Vừa răn đe, trừng phạt, vừa khắc phục hậu quả và lập lại trật tự quản lý.", "C": "Tạo thêm công việc cho các cơ quan hành chính.", "D": "Giảm gánh nặng cho hệ thống tòa án."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Hành vi xây dựng hàng rào kiên cố lấn sang phần đất lưu không<br>hành lang an toàn giao thông đường bộ có thể bị xử phạt theo quy định nào?", "options": {"A": "Có thể bị xử phạt về hành vi lấn chiếm đất (đất công do Nhà nước quản lý.", "B": "Chỉ theo pháp luật về xây dựng.", "C": "Chỉ bị yêu cầu tháo dỡ.", "D": "Chỉ theo pháp luật về giao thông đường bộ."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Hành vi không công khai hoặc công khai không đầy đủ thông tin về<br>dự án bất động sản theo quy định pháp luật sẽ bị xử lý như thế nào?", "options": {"A": "Bị xử phạt vi phạm hành chính", "B": "Không bị xử phạt nếu khách hàng không yêu cầu", "C": "Chỉ bị xử phạt khi gây thiệt hại", "D": "Chỉ bị nhắc nhở bằng văn bản"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Định nghĩa: “Bất động sản là các tài sản bao gồm: Đất đai; Nhà,<br>công trình xây dựng gắn liền với đất đai, kể các tài sản gắn kiền với nhà, công<br>trình xây dựng đ "}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Tổ chức nào chịu trách nhiệm chính trong việc ban hành hệ thống<br>Chuẩn mực thẩm định giá Việt Nam?", "options": {"A": "Chính phủ", "B": "Bộ Nông nghiệp và Môi trường", "C": "Bộ Tài chính", "D": "Bộ Xây dựng"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Theo quy định tại Luật Đất đai 2024, phương thức xây dựng Bảng<br>giá đất chi tiết đến từng thửa đất (dự kiến áp dụng từ 01/01/2026) sẽ dựa trên<br>việc xác định các yếu tố nào?", "options": {"A": "Đơn giá bồi thường do Nhà nước quy định.", "B": "Giá đất trung bình của toàn tỉnh/thành phố.", "C": "Vùng giá trị và các thửa đất chuẩn đại diện trong vùng.", "D": "Giá giao dịch thành công gần nhất của chính thửa đất đó."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Thông tin nào sau đây KHÔNG được Luật Đất đai 2024 (Điều 158)<br>liệt kê là căn cứ trực tiếp để định giá đất?", "options": {"A": "Thời hạn sử dụng đất còn lại.", "B": "Giá đất trong Bảng giá đất do UBND cấp tỉnh ban hành.", "C": "Mục đích sử dụng đất được giao, cho thuê, công nhận.", "D": "Giá đất thị trường trúng đấu giá quyền sử dụng đất."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Nguyên tắc đạo đức \"Năng lực chuyên môn và Tính thận trọng\" đòi<br>hỏi thẩm định viên về giá phải làm gì?", "options": {"A": "Duy trì kiến thức, kỹ năng chuyên môn cần thiết và hành động cẩn trọng, tuân", "B": "Chỉ nhận thực hiện công việc thuộc lĩnh vực mình có chuyên môn và kinh", "C": "Luôn đưa ra mức giá trị cao nhất có thể.", "D": "Bảo mật tuyệt đối mọi thông tin của khách hàng."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Trường hợp nào sau đây bắt buộc phải sử dụng \"Giá đất cụ thể\"<br>thay vì \"Bảng giá đất\" theo Luật Đất đai 2024?", "options": {"A": "Tính thuế sử dụng đất nông nghiệp.", "B": "Tính lệ phí trước bạ nhà đất.", "C": "Tính tiền thuê đất trả tiền hàng năm đối với hộ gia đình.", "D": "Tính tiền sử dụng đất khi Nhà nước giao đất có thu tiền sử dụng đất cho tổ chức"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Theo Luật Giá 2023, việc Nhà nước định giá đối với hàng hóa, dịch<br>vụ cụ thể phải tuân theo nguyên tắc nào?", "options": {"A": "Phù hợp với giá thế giới.", "B": "Đảm bảo lợi nhuận cao nhất cho nhà sản xuất.", "C": "Thấp hơn giá thị trường để hỗ trợ người tiêu dùng.", "D": "Bù đắp chi phí sản xuất, kinh doanh hợp lý, lợi nhuận phù hợp thị trường, cân"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Việc Luật Đất đai 2024 yêu cầu Bảng giá đất phải được điều chỉnh,<br>sửa đổi, bổ sung hàng năm (áp dụng từ 01/01/2026) nhằm mục đích gì?", "options": {"A": "Giảm khối lượng công việc cho cơ quan định giá.", "B": "Tạo sự ổn định tuyệt đối cho thị trường.", "C": "Tăng nguồn thu thuế đất đột biến hàng năm.", "D": "Giúp Bảng giá đất phản ánh kịp thời hơn những biến động của giá thị trường so"}, "answer": "D", "explanation": ""}];
        let quizData = [];
        let currentIndex = 0;

        window.onload = function() {
            try {
                if(!allData || allData.length === 0) {
                    document.getElementById("quiz-container").innerHTML = "<h3 style='color:red; text-align:center;'>Lỗi: Không có dữ liệu câu hỏi!</h3>";
                    return;
                }
                quizData = getSampledQuestions(100);
                renderQuestion();
            } catch(e) {
                alert("Lỗi khởi tạo hệ thống: " + e.message);
            }
        };

        function getSampledQuestions(count) {
            const shuffle = (arr) => arr.sort(() => Math.random() - 0.5);
            const filterLvl = (l) => allData.filter(q => String(q.level) === String(l));
            
            let p1 = shuffle(filterLvl("1")); let p2 = shuffle(filterLvl("2"));
            let p3 = shuffle(filterLvl("3")); let p4 = shuffle(filterLvl("4")); let p5 = shuffle(filterLvl("5"));

            let n1 = Math.round(count * 0.25); let n2 = Math.round(count * 0.25);
            let n3 = Math.round(count * 0.20); let n4 = Math.round(count * 0.20);
            let n5 = count - (n1 + n2 + n3 + n4);

            let selected = [ ...p1.splice(0, n1), ...p2.splice(0, n2), ...p3.splice(0, n3), ...p4.splice(0, n4), ...p5.splice(0, n5) ];

            if(selected.length < count) {
                let remain = shuffle([...p1, ...p2, ...p3, ...p4, ...p5]);
                selected = [...selected, ...remain.splice(0, count - selected.length)];
            }
            return shuffle(selected).slice(0, count);
        }

        function renderQuestion() {
            try {
                if (!quizData[currentIndex]) return;
                const q = quizData[currentIndex];
                
                // Nhận diện CHỌN NHIỀU ĐÁP ÁN cực kỳ an toàn
                let qContentLower = q.content ? q.content.toLowerCase() : "";
                const isMulti = (q.answer && q.answer.includes(",")) || qContentLower.includes("(chọn 2");
                const multiHint = isMulti ? "<span class='q-hint'>* Câu hỏi này yêu cầu chọn nhiều đáp án</span>" : "";
                
                document.getElementById("progress-text").innerText = `Câu ${currentIndex + 1} / ${quizData.length}`;
                
                let optHtml = "";
                let hasOptions = false;
                
                ['A','B','C','D'].forEach(lbl => {
                    if(q.options && q.options[lbl]) {
                        hasOptions = true;
                        optHtml += `
                            <label class="option-item" id="label-${lbl}">
                                <input type="${isMulti ? 'checkbox' : 'radio'}" name="q_opt" value="${lbl}" onchange="updateSelection()">
                                <b>${lbl}.</b> ${q.options[lbl]}
                            </label>`;
                    }
                });

                if(!hasOptions) {
                    optHtml = "<div style='color:red; background:#ffebee; padding:10px; border-radius:5px;'><i>⚠️ Lỗi: Không trích xuất được đáp án. (Kiểm tra lại tính năng đánh số tự động trong Word).</i></div>";
                }

                // Chống gãy chuỗi vì ký tự ngắt dòng
                let safeContent = q.content || "";
                safeContent = safeContent.split('\n').join('<br>');

                document.getElementById("quiz-container").innerHTML = `
                    <div class="card">
                        <div class="q-meta">MỨC ĐỘ THỬ THÁCH: ${q.level || '1'}</div>
                        <div class="q-text">${safeContent}</div>
                        ${multiHint}
                        <div class="options">${optHtml}</div>
                        
                        <button id="btn-check" class="btn-check-inline" onclick="checkAnswer()">Kiểm tra đáp án</button>
                        
                        <div id="exp-box" class="exp-box"></div>
                    </div>`;
                window.scrollTo(0,0);
            } catch(e) {
                alert("Lỗi hiển thị câu hỏi: " + e.message);
            }
        }

        function updateSelection() {
            document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
            document.querySelectorAll('input:checked').forEach(el => el.parentElement.classList.add('selected'));
        }

        function checkAnswer() {
            try {
                const q = quizData[currentIndex];
                const box = document.getElementById("exp-box");
                const btn = document.getElementById("btn-check");
                
                const checkedInputs = document.querySelectorAll('input[name="q_opt"]:checked');
                const selectedVals = Array.from(checkedInputs).map(i => i.value).sort().join(",");
                
                if (!selectedVals) {
                    alert("⚠️ Vui lòng chọn phương án trước khi kiểm tra!");
                    return;
                }

                btn.style.display = "none";
                box.style.display = "block";

                let resultTitle = "";
                if (selectedVals === q.answer) {
                    resultTitle = `<div class="result-title" style="color: var(--success);">✔ CHÍNH XÁC!</div>`;
                    box.style.borderLeftColor = "var(--success)";
                } else {
                    resultTitle = `<div class="result-title" style="color: var(--error);">✘ SAI RỒI! (Bạn chọn: ${selectedVals})</div>`;
                    box.style.borderLeftColor = "var(--error)";
                }

                ['A','B','C','D'].forEach(lbl => {
                    const el = document.getElementById(`label-${lbl}`);
                    if(!el) return;
                    
                    if(q.answer && q.answer.includes(lbl)) {
                        el.classList.add('correct-ans');
                    } else if(selectedVals.includes(lbl)) {
                        el.classList.add('wrong-ans');
                    }
                    
                    const input = el.querySelector('input');
                    if(input) input.disabled = true;
                });

                box.innerHTML = `
                    ${resultTitle}
                    <div style="margin-bottom:12px; font-size:1.05em;"><b>Đáp án đúng:</b> <span style="color:var(--success); font-weight:bold">${q.answer || "Không rõ"}</span></div>
                    <div>${q.explanation || "<i>Hệ thống chưa cập nhật giải thích cho câu này.</i>"}</div>
                `;

                box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } catch(e) {
                alert("Lỗi xử lý đáp án: " + e.message);
            }
        }

        function nextQ() { if(currentIndex < quizData.length-1) { currentIndex++; renderQuestion(); } }
        function prevQ() { if(currentIndex > 0) { currentIndex--; renderQuestion(); } }
    </script>
