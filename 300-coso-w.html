    <script>
        const allData = [{"level": "1", "content": "Luật Nhà ở 2023 (Luật số 27/2023/QH15) định nghĩa \"Nhà ở\" như thế nào?", "options": {"A": "Công trình xây dựng với mục đích để ở và phục vụ nhu cầu sinh hoạt của gia đình, cá nhân.", "B": "Công trình được sử dụng cho cả mục đích ở và sản xuất công nghiệp.", "C": "Mọi công trình xây dựng có mái che và tường bao.", "D": "Chỉ bao gồm các căn hộ trong dự án nhà ở thương mại."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Khái niệm \"Nhà ở có mục đích sử dụng hỗn hợp\" theo Điều 3 Luật Nhà ở 2023 là gì?", "options": {"A": "Nhà ở được sử dụng vào mục đích để ở và mục đích khác không bị pháp luật cấm.", "B": "Nhà ở được nhiều hộ gia đình cùng chung sống.", "C": "Nhà ở có thể chuyển đổi mục đích sử dụng theo mùa.", "D": "Nhà ở chỉ dùng làm văn phòng kết hợp kho bãi."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Định nghĩa \"Nhà chung cư\" theo Điều 3 Luật Nhà ở 2023 bao gồm đặc điểm nào?", "options": {"A": "Phải có ít nhất 5 tầng và 100 căn hộ.", "B": "Chỉ bao gồm các tòa nhà văn phòng cho thuê.", "C": "Có từ 02 tầng trở lên, nhiều căn hộ, có lối đi, cầu thang chung, phần sở hữu riêng, phần sở hữu chung.", "D": "Luôn thuộc sở hữu toàn dân do Nhà nước quản lý."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "\"Nhà ở hình thành trong tương lai\" theo Điều 3 Luật Nhà ở 2023 là nhà ở:", "options": {"A": "Đã được cấp Giấy chứng nhận nhưng chưa bàn giao.", "B": "Là các mô hình nhà ở thông minh trong dự án.", "C": "Đã hoàn thiện phần thô và đang trong giai đoạn hoàn thiện nội thất.", "D": "Đang trong quá trình đầu tư xây dựng trong dự án thực hiện bởi chủ đầu tư và chưa được nghiệm thu bàn giao đưa vào sử dụng."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Việc công nhận quyền sở hữu nhà ở được Nhà nước thực hiện thông qua hình thức nào theo Luật Nhà ở 2023?", "options": {"A": "Thông qua hợp đồng mua bán có công chứng.", "B": "Thông qua biên bản bàn giao nhà giữa các bên.", "C": "Thông qua việc cấp Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất (trừ nhà ở thuộc tài sản công).", "D": "Thông qua việc đăng ký tạm trú, thường trú."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Theo Điều 12 Luật Nhà ở 2023, thời điểm xác lập quyền sở hữu nhà ở đối với trường hợp mua bán nhà ở (không phải từ chủ đầu tư dự án) là khi nào, nếu không có thỏa thuận khác?", "options": {"A": "Khi hai bên ký hợp đồng đặt cọc.", "B": "Khi hoàn tất thủ tục sang tên Giấy chứng nhận.", "C": "Sau 30 ngày kể từ ngày ký hợp đồng công chứng.", "D": "Khi bên mua thanh toán đủ tiền và nhận bàn giao nhà ở."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Theo Điều 8 Luật Nhà ở 2023, đối tượng nào sau đây được phép sở hữu nhà ở tại Việt Nam?", "options": {"A": "Người nước ngoài nhập cảnh bằng visa du lịch.", "B": "Chỉ công dân Việt Nam có hộ khẩu thường trú.", "C": "Chỉ các doanh nghiệp đăng ký Kinh doanh bất động sản.", "D": "Tổ chức, cá nhân trong nước; Người Việt Nam định cư ở nước ngoài; Tổ chức, cá nhân nước ngoài (nếu đáp ứng điều kiện)."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Người Việt Nam định cư ở nước ngoài có quốc tịch Việt Nam có quyền sở hữu nhà ở tại Việt Nam như thế nào theo Luật Nhà ở 2023?", "options": {"A": "Có đầy đủ quyền sở hữu nhà ở như cá nhân trong nước.", "B": "Chỉ được sở hữu nhà ở thông qua thừa kế.", "C": "Chỉ được sở hữu 1 căn nhà duy nhất.", "D": "Phải có dự án đầu tư tại Việt Nam."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Theo Luật Nhà ở 2023 và Luật Đất đai 2024, người gốc Việt Nam định cư ở nước ngoài (không có quốc tịch Việt Nam) có quyền sở hữu nhà ở:", "options": {"A": "Chỉ được thuê dài hạn.", "B": "Gắn liền với quyền sử dụng đất ở theo quy định của pháp luật đất đai.", "C": "Chỉ được sở hữu nhà ở xã hội.", "D": "Hoàn toàn không được phép."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Điều 20 Luật Nhà ở 2023 quy định tổ chức, cá nhân nước ngoài không được sở hữu nhà ở tại đâu?", "options": {"A": "Tại các khu vực cần bảo đảm quốc phòng, an ninh.", "B": "Tại các thành phố trực thuộc trung ương.", "C": "Tại các dự án nhà ở xã hội.", "D": "Tại các khu vực nông thôn, miền núi."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Số lượng căn hộ tối đa trong một tòa nhà chung cư mà các tổ chức, cá nhân nước ngoài được phép sở hữu là bao nhiêu phần trăm (%) tổng số căn hộ theo Điều 19 Luật Nhà ở 2023?", "options": {"A": "20%", "B": "49%", "C": "10%", "D": "30%"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Theo Điều 20 Luật Nhà ở 2023, thời hạn sở hữu nhà ở tối đa của cá nhân nước ngoài tại Việt Nam là bao nhiêu năm (kể từ ngày cấp Giấy chứng nhận)?", "options": {"A": "Bằng thời hạn của dự án đầu tư.", "B": "50 năm, có thể gia hạn thêm một lần không quá 50 năm.", "C": "30 năm, không gia hạn.", "D": "70 năm."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Chủ đầu tư được phép nhận tiền đặt cọc cho việc mua bán nhà ở hình thành trong tương lai với mức tối đa bao nhiêu % giá bán khi nhà ở đã đủ điều kiện kinh doanh theo Luật kinh doanh bất động sản 2023?", "options": {"A": "1%", "B": "10%", "C": "5%", "D": "Không giới hạn nếu khách hàng đồng ý."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Theo Điều 89 Luật Nhà ở 2023, bên mua/thuê mua nhà ở xã hội có sẵn không được bán lại nhà ở trong thời hạn tối thiểu là bao nhiêu năm?", "options": {"A": "3 năm kể từ ngày ký hợp đồng.", "B": "10 năm kể từ ngày cấp Giấy chứng nhận.", "C": "1 năm kể từ ngày nhận nhà.", "D": "5 năm kể từ ngày thanh toán đủ tiền."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Theo Điều 76 Luật Nhà ở 2023, đối tượng nào được bổ sung vào danh sách hưởng chính sách hỗ trợ về nhà ở xã hội so với luật cũ?", "options": {"A": "Hộ gia đình có 3 thế hệ cùng chung sống.", "B": "Người cao tuổi neo đơn.", "C": "Sinh viên tốt nghiệp loại giỏi.", "D": "Doanh nghiệp, hợp tác xã, liên hiệp hợp tác xã trong khu công nghiệp (mua, thuê nhà lưu trú công nhân)."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Ai có trách nhiệm quản lý, sử dụng kinh phí bảo trì phần sở hữu chung sau khi Ban quản trị nhà chung cư được thành lập theo Luật Nhà ở 2023?", "options": {"A": "Đơn vị quản lý vận hành được toàn quyền sử dụng.", "B": "UBND cấp xã nơi có nhà chung cư.", "C": "Chủ đầu tư tiếp tục quản lý.", "D": "Ban quản trị quản lý thông qua tài khoản riêng và sử dụng theo kế hoạch được Hội nghị nhà chung cư thông qua."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Trường hợp nào sau đây nhà chung cư thuộc diện phải phá dỡ để cải tạo, xây dựng lại theo Chương V Luật Nhà ở 2023?", "options": {"A": "Nhà chung cư có tỷ lệ trống trên 50%.", "B": "Nhà chung cư hết niên hạn sử dụng theo thiết kế và có kết luận kiểm định không còn an toàn.", "C": "Nhà chung cư xuống cấp nhẹ, cần sơn sửa lại.", "D": "Nhà chung cư được xây dựng trước năm 2000."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Theo Luật Nhà ở 2023, việc phân biệt giữa \"nhà ở có sẵn\" và \"nhà ở hình thành trong tương lai\" có ý nghĩa pháp lý quan trọng như thế nào đối với hoạt động Kinh doanh bất động sản?", "options": {"A": "Chỉ quyết định loại thuế áp dụng khi giao dịch.", "B": "Chi phối việc áp dụng các điều kiện bán, cho thuê mua khác nhau theo Luật kinh doanh bất động sản 2023 (ví dụ: điều kiện móng, bảo lãnh ngân hàng, lịch thanh toán).", "C": "Chỉ ảnh hưởng đến việc cấp Giấy chứng nhận.", "D": "Chỉ liên quan đến thủ tục nghiệm thu công trình."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Ngoài việc được phép nhập cảnh vào Việt Nam, cá nhân nước ngoài muốn mua nhà ở thương mại trong dự án cần đáp ứng thêm điều kiện nào theo quy định tại Nghị định 95/2024/NĐ-CP?", "options": {"A": "Phải có người Việt Nam bảo lãnh.", "B": "Phải có tài khoản ngân hàng tại Việt Nam.", "C": "Phải cam kết không thuộc diện hưởng ưu đãi, miễn trừ ngoại giao, lãnh sự.", "D": "Phải chứng minh có thu nhập ổn định tại Việt Nam."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Việc xác định một dự án nhà ở thương mại có nằm trong khu vực hạn chế sở hữu đối với người nước ngoài vì lý do quốc phòng, an ninh thường phụ thuộc vào yếu tố nào ngoài quy định chung tại Nghị định 95/2024/NĐ- CP?", "options": {"A": "Ý kiến của đa số cư dân trong dự án.", "B": "Giá bán của các căn hộ trong dự án.", "C": "Quyết định của chủ đầu tư dự án.", "D": "Các bản đồ quy hoạch chi tiết và văn bản xác định cụ thể của chính quyền cấp tỉnh."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Trong trường hợp trưng mua, trưng dụng nhà ở vì lý do quốc phòng, an ninh, lợi ích quốc gia, Nhà nước có nghĩa vụ gì đối với chủ sở hữu theo Luật Nhà ở 2023?", "options": {"A": "Phải tuân thủ quy định về bồi thường, hỗ trợ, tái định cư.", "B": "Không có nghĩa vụ bồi thường nếu vì lý do quốc phòng, an ninh.", "C": "Bồi thường theo giá thị trường tại thời điểm trưng mua/trưng dụng.", "D": "Chỉ thông báo trước 30 ngày."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Yêu cầu về bảo lãnh ngân hàng khi bán, cho thuê mua nhà ở hình thành trong tương lai theo Luật kinh doanh bất động sản 2023 có thể ảnh hưởng tiêu cực đến chủ đầu tư như thế nào?", "options": {"A": "Tăng uy tín của chủ đầu tư trên thị trường.", "B": "Giúp chủ đầu tư huy động vốn dễ dàng hơn.", "C": "Giảm thiểu rủi ro pháp lý cho chủ đầu tư.", "D": "Tạo thêm gánh nặng chi phí (phí bảo lãnh) và thủ tục hành chính, có thể ảnh hưởng lợi nhuận hoặc giá bán."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Hợp đồng mua bán, thuê mua nhà ở hình thành trong tương lai có bắt buộc phải tuân thủ hợp đồng mẫu không?", "options": {"A": "Có, phải tuân thủ hợp đồng mẫu do Chính phủ quy định", "B": "Chỉ bắt buộc nếu giá trị hợp đồng trên 5 tỷ đồng.", "C": "Chỉ bắt buộc đối với dự án Nhà ở xã hội.", "D": "Không bắt buộc, các bên tự thỏa thuận."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Việc xác định tình trạng \"chưa có nhà ở thuộc sở hữu của mình\" để xét duyệt mua nhà ở xã hội (NOXH) theo Nghị định 100/2024/NĐ-CP dựa trên căn cứ nào?", "options": {"A": "Việc người đứng đơn và vợ/chồng (nếu có) không có tên trên Giấy chứng nhận nhà ở, đất ở nào tại tỉnh/thành phố đó.", "B": "Lời cam đoan của người nộp đơn.", "C": "Xác nhận của tổ trưởng dân phố.", "D": "Kết quả kiểm tra trên hệ thống đăng ký kinh doanh."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Giá dịch vụ quản lý vận hành nhà chung cư sau khi có Ban quản trị được quyết định như thế nào?", "options": {"A": "Do Đơn vị quản lý vận hành tự đưa ra và thu của cư dân.", "B": "Do Hội nghị nhà chung cư quyết định trên cơ sở thỏa thuận với Đơn vị quản lý vận hành.", "C": "Do UBND cấp tỉnh ấn định hàng năm", "D": "Do chủ đầu tư quyết định cố định."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Nghĩa vụ bảo lãnh của chủ đầu tư khi bán, cho thuê mua nhà ở hình thành trong tương lai theo Luật kinh doanh bất động sản 2023 là gì?", "options": {"A": "Phải có bảo lãnh của Bộ Tài chính.", "B": "Phải có bảo lãnh của ngân hàng thương mại đủ năng lực về nghĩa vụ tài chính của mình.", "C": "Phải mua bảo hiểm cho toàn bộ dự án.", "D": "Phải ký quỹ tại Ngân hàng Nhà nước."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Việc thanh toán lần đầu trong hợp đồng mua bán nhà ở hình thành trong tương lai được giới hạn ở mức nào theo Điều 25 Luật kinh doanh bất động sản 2023?", "options": {"A": "Không quá 15% giá trị hợp đồng (đã bao gồm tiền đặt cọc).", "B": "Không quá 30% giá trị hợp đồng (chưa bao gồm tiền đặt cọc).", "C": "Không quá 30% giá trị hợp đồng (đã bao gồm tiền đặt cọc).", "D": "Không quá 70% giá trị hợp đồng (đã bao gồm tiền đặt cọc)."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Một trong những ưu đãi dành cho chủ đầu tư dự án nhà ở xã hội theo Luật Nhà ở 2023 là:", "options": {"A": "Được phép bán 30% sản phẩm theo giá thương mại.", "B": "Được miễn tiền sử dụng đất, tiền thuê đất đối với toàn bộ diện tích đất của dự án.", "C": "Được miễn toàn bộ thuế trong suốt quá trình hoạt động.", "D": "Không phải xin phép xây dựng."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Cá nhân xây dựng \"chung cư mini\" có từ 02 tầng và quy mô dưới 20 căn hộ để cho thuê phải đáp ứng yêu cầu tối thiểu nào về PCCC và hạ tầng theo Điều 57 Luật Nhà ở 2023?", "options": {"A": "Không yêu cầu gì đặc biệt.", "B": "Phải đáp ứng yêu cầu về PCCC theo quy định đối với nhà ở nhiều tầng nhiều căn hộ và đảm bảo đường giao thông cho xe chữa cháy tiếp cận.", "C": "Chỉ cần trang bị bình chữa cháy mini cho mỗi căn hộ.", "D": "Phải có hệ thống báo cháy tự động như nhà chung cư lớn."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Việc quản lý vận hành nhà ở nhiều tầng nhiều căn hộ của cá nhân (\"chung cư mini\") phải tuân thủ theo quy định nào?", "options": {"A": "Do chủ nhà tự đặt ra quy định riêng.", "B": "Theo thỏa thuận dân sự giữa chủ nhà và người thuê.", "C": "Theo Quy chế quản lý, sử dụng nhà chung cư do Bộ Xây dựng ban hành.", "D": "Theo quy định quản lý nhà ở trợ giá của địa phương."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Luật kinh doanh bất động sản 2023 có hiệu lực thi hành từ ngày nào?", "options": {"A": "01/01/2025", "B": "28/11/2023", "C": "01/08/2024", "D": "01/01/2015"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Hành vi nào sau đây bị nghiêm cấm theo Luật kinh doanh bất động sản 2023?", "options": {"A": "Công khai đầy đủ thông tin về dự án bất động sản", "B": "Kinh doanh bất động sản đủ điều kiện theo quy định.", "C": "Giả mạo tài liệu, cố ý làm sai lệch thông tin về bất động sản.", "D": "Thu tiền đặt cọc mua nhà hình thành trong tương lai không quá 5% giá bán."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Điều kiện về vốn chủ sở hữu đối với doanh nghiệp kinh doanh BĐS làm chủ đầu tư dự án có quy mô sử dụng đất dưới 20 ha theo Luật kinh doanh bất động sản 2023 là gì?", "options": {"A": "Không quy định cụ thể.", "B": "Không thấp hơn 15% tổng vốn đầu tư", "C": "Không thấp hơn 20% tổng vốn đầu tư.", "D": "Tối thiểu 20 tỷ đồng."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Luật kinh doanh bất động sản 2023 yêu cầu các bên phải ghi thông tin nào vào hợp đồng kinh doanh BĐS một cách chính xác?", "options": {"A": "Giá thỏa thuận nhưng không cần công khai.", "B": "Giá giao dịch thực tế.", "C": "Chỉ cần ghi giá tham khảo trên thị trường.", "D": "Giá tính thuế theo bảng giá đất của Nhà nước."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Phương thức thanh toán bắt buộc đối với giao dịch giữa chủ đầu tư, doanh nghiệp kinh doanh BĐS với khách hàng theo Luật kinh doanh bất động sản 2023 là gì (trừ trường hợp quy mô nhỏ)?", "options": {"A": "Vàng hoặc ngoại tệ", "B": "Chuyển khoản qua ngân hàng", "C": "Tiền mặt", "D": "Bất kỳ phương thức nào các bên thỏa thuận"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Thông tin về bất động sản, dự án bất động sản phải được công khai vào thời điểm nào theo Luật kinh doanh bất động sản 2023?", "options": {"A": "Chỉ khi có yêu cầu của khách hàng.", "B": "Trong quá trình xây dựng.", "C": "Trước khi đưa bất động sản, dự án bất động sản vào kinh doanh.", "D": "Sau khi ký hợp đồng mua bán."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Điều kiện hành nghề của cá nhân môi giới bất động sản theo Luật Kinh doanh Bất động sản 2023 có thay đổi quan trọng nào so với Luật Kinh doanh Bất động sản 2014?", "options": {"A": "Chỉ cần đăng ký thuế là đủ.", "B": "Không cần chứng chỉ hành nghề nữa.", "C": "Phải hành nghề trong một doanh nghiệp kinh doanh dịch vụ bất động sản, không được hoạt động độc lập.", "D": "Phải có bằng đại học chuyên ngành bất động sản."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Luật kinh doanh bất động sản 2023 có bắt buộc mọi giao dịch bất động sản phải thực hiện qua sàn giao dịch không?", "options": {"A": "Chỉ các giao dịch nhà ở hình thành trong tương lai phải qua sàn.", "B": "Có, tất cả giao dịch phải qua sàn.", "C": "Không bắt buộc, việc giao dịch qua sàn là tự nguyện.", "D": "Chỉ các giao dịch có yếu tố nước ngoài phải qua sàn."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Hành vi nào liên quan đến chứng chỉ hành nghề môi giới BĐS bị nghiêm cấm theo Luật kinh doanh bất động sản 2023?", "options": {"A": "Yêu cầu nhân viên môi giới phải có chứng chỉ.", "B": "Thi lấy chứng chỉ hành nghề môi giới BĐS.", "C": "Cấp và sử dụng chứng chỉ hành nghề môi giới BĐS không đúng quy định.", "D": "Sử dụng chứng chỉ hết hạn để hành nghề."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Khi chuyển nhượng toàn bộ dự án BĐS, bên nhận chuyển nhượng có phải làm lại hồ sơ dự án, quy hoạch, giấy phép xây dựng không nếu không thay đổi nội dung dự án?", "options": {"A": "Phải làm lại quy hoạch chi tiết 1/500", "B": "Chỉ cần làm lại giấy phép xây dựng.", "C": "Không, không phải làm lại nếu không có thay đổi nội dung.", "D": "Có, phải làm lại toàn bộ thủ tục từ đầu."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Theo Luật kinh doanh bất động sản 2023, tổ chức, cá nhân kinh doanh BĐS được phép kinh doanh BĐS ở đâu?", "options": {"A": "Trên toàn lãnh thổ Việt Nam.", "B": "Chỉ tại các khu đô thị đã được quy hoạch.", "C": "Chỉ trong phạm vi tỉnh/thành phố nơi đăng ký kinh doanh.", "D": "Ngoài phạm vi khu vực bảo vệ theo quy định của pháp luật về quốc phòng, an ninh."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Trường hợp nào chủ đầu tư dự án BĐS KHÔNG được thu tiền đặt cọc theo Luật kinh doanh bất động sản 2023?", "options": {"A": "Khi giá trị đặt cọc dưới 1% giá bán.", "B": "Khi nhà ở, công trình xây dựng chưa đủ điều kiện đưa vào kinh doanh.", "C": "Khi đã nhận đủ tiền đặt cọc từ 10 khách hàng đầu tiên.", "D": "Khi dự án chưa hoàn thành giải phóng mặt bằng"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Điều kiện \"hoàn thành nghĩa vụ tài chính về đất đai\" đối với BĐS hình thành trong tương lai và quyền sử dụng đất có hạ tầng trước khi đưa vào kinh doanh nhằm mục đích chính là gì?", "options": {"A": "Đơn giản hóa thủ tục cấp Giấy chứng nhận cho người mua sau này.", "B": "Đảm bảo Nhà nước thu đủ thuế, phí và quyền sử dụng đất của chủ đầu tư đối với dự án là hợp pháp trước khi bán cho khách hàng.", "C": "Khuyến khích chủ đầu tư đẩy nhanh tiến độ xây dựng.", "D": "Đảm bảo chủ đầu tư có đủ lợi nhuận từ dự án"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Việc cá nhân môi giới BĐS phải hoạt động trong một doanh nghiệp dịch vụ BĐS theo Luật kinh doanh bất động sản 2023 nhằm mục đích gì?", "options": {"A": "Buộc các môi giới phải chia sẻ hoa hồng với doanh nghiệp.", "B": "Tăng doanh thu cho các sàn giao dịch BĐS.", "C": "Chuyên nghiệp hóa hoạt động môi giới, tăng trách nhiệm giải trình, dễ quản lý và giám sát hơn.", "D": "Giảm số lượng môi giới trên thị trường."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Loại hình công trình xây dựng nào được Luật kinh doanh bất động sản 2023 bổ sung, làm rõ là đối tượng được phép kinh doanh?", "options": {"A": "Bao gồm cả công trình có công năng phục vụ du lịch, lưu trú (như condotel, officetel), giáo dục, y tế, thể thao, văn hóa, thương mại, dịch vụ, công nghiệp, hỗn hợp.", "B": "Chỉ công trình do Nhà nước đầu tư.", "C": "Chỉ các công trình xây dựng có sẵn, không bao gồm hình thành trong tương lai.", "D": "Chỉ nhà ở và văn phòng."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Sự khác biệt về yêu cầu công chứng, chứng thực hợp đồng mua bán nhà ở giữa giao dịch có doanh nghiệp kinh doanh bất động sản tham gia và giao dịch chỉ giữa các cá nhân là gì theo Luật kinh doanh bất động sản 2023?", "options": {"A": "Mọi hợp đồng đều bắt buộc công chứng/chứng thực.", "B": "Không có sự khác biệt, đều không bắt buộc.", "C": "Giao dịch giữa các cá nhân với nhau thì bắt buộc công chứng/chứng thực, giao dịch có doanh nghiệp tham gia thì theo yêu cầu của các bên.", "D": "Giao dịch có doanh nghiệp tham gia thì bắt buộc, giao dịch giữa cá nhân thì không."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Người Việt Nam định cư ở nước ngoài mà KHÔNG phải là công dân Việt Nam được kinh doanh BĐS tại Việt Nam dưới hình thức nào theo Luật kinh doanh bất động sản 2023?", "options": {"A": "Được kinh doanh mọi hình thức như công dân Việt Nam.", "B": "Chủ yếu được đầu tư xây dựng dự án để bán/cho thuê/cho thuê mua, thuê nhà/công trình để cho thuê lại, nhận chuyển nhượng dự án.", "C": "Chỉ được kinh doanh dịch vụ BĐS.", "D": "Chỉ được mua nhà ở để ở, không được kinh doanh."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Nếu một cá nhân chỉ bán duy nhất 01 căn nhà thuộc sở hữu hợp pháp của mình trong năm, giá trị 10 tỷ đồng, thì có phải thành lập doanh nghiệp kinh doanh bất động sản không?", "options": {"A": "Phải thành lập nếu căn nhà đó nằm trong dự án BĐS.", "B": "Có, vì giá trị trên 300 triệu đồng.", "C": "Có, vì hoạt động bán nhà là kinh doanh BĐS.", "D": "Không, vì đây là bán tài sản không nhằm mục đích kinh doanh / dưới mức quy mô nhỏ."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Sàn giao dịch BĐS có trách nhiệm gì đối với hồ sơ pháp lý của BĐS được đưa vào kinh doanh tại sàn?", "options": {"A": "Chỉ cần niêm yết thông tin do chủ đầu tư cung cấp", "B": "Không có trách nhiệm kiểm tra, chỉ là nơi trung gian.", "C": "Phải kiểm tra hồ sơ pháp lý, nếu đủ điều kiện mới được giới thiệu cho khách hàng.", "D": "Chỉ chịu trách nhiệm nếu khách hàng khiếu nại."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Trình tự, thủ tục đầu tư xây dựng dự án BĐS phải tuân thủ quy định của những luật nào?", "options": {"A": "Chỉ Luật kinh doanh bất động sản.", "B": "Luật kinh doanh bất động sản và Luật Xây dựng.", "C": "Luật kinh doanh bất động sản, Luật Quy hoạch, Luật Đầu tư, Luật Đất đai, Luật Xây dựng, Luật Nhà ở và pháp luật có liên quan.", "D": "Chỉ Luật Đầu tư và Luật Đất đai."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Tại sao việc yêu cầu \"hoàn thành việc đầu tư xây dựng hạ tầng kỹ thuật thiết yếu\" trước khi kinh doanh quyền sử dụng đất lại quan trọng trong việc quản lý phát triển đô thị?", "options": {"A": "Tăng giá trị cho các lô đất nền.", "B": "Ngăn chặn tình trạng hình thành các khu dân cư tự phát thiếu hạ tầng đồng bộ, đảm bảo điều kiện sống cơ bản và kết nối khu vực.", "C": "Giúp việc cấp Giấy chứng nhận cho người mua dễ dàng hơn.", "D": "Đảm bảo chủ đầu tư thu hồi vốn nhanh hơn."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Việc thu thập thông tin về \"số liệu điều tra, thống kê về nhà ở\", \"số liệu cấp GCN\" trong cơ sở dữ liệu quốc gia về nhà ở nhằm mục đích gì?", "options": {"A": "Xác định các cá nhân sở hữu nhiều nhà đất để áp thuế, tăng thu ngân sách.", "B": "Phục vụ công tác quy hoạch đô thị chi tiết.", "C": "Cung cấp cái nhìn tổng quan, định lượng về tình hình nhà ở, thị trường và hiệu", "D": "Chỉ để báo cáo thành tích của ngành xây dựng."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Nếu Luật Đất đai, Luật Nhà ở có quy định khác với Luật kinh doanh<br>bất động sản về cùng một vấn đề liên quan đến kinh doanh BĐS, nguyên tắc<br>áp dụng pháp luật là gì?", "options": {"A": "Các bên tự thỏa thuận luật áp dụng.", "B": "Luôn ưu tiên áp dụng Luật kinh doanh bất động sản hơn Luật Đất đai, Luật Nhà", "C": "Tùy trường hợp cụ thể, ưu tiên áp dụng luật chuyên ngành trực tiếp điều chỉnh", "D": "Áp dụng dụng luật được ban hành sau cùng, có thời gian hiệu lực gần nhất"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Việc Luật kinh doanh bất động sản 2023 quy định hợp đồng mẫu và<br>yêu cầu công khai hợp đồng mẫu trước khi áp dụng mang lại lợi ích gì cho<br>người mua BĐS?", "options": {"A": "Biết trước các điều khoản chính, giảm thiểu rủi ro bị cài cắm các điều khoản", "B": "Được miễn phí công chứng hợp đồng.", "C": "Có thể yêu cầu chủ đầu tư thay đổi hoàn toàn hợp đồng mẫu.", "D": "Giúp người mua có thể tự soạn thảo hợp đồng theo ý mình"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Cơ sở dữ liệu về thị trường BĐS địa phương KHÔNG bao gồm thông<br>tin nào sau đây?", "options": {"A": "Số lượng chứng chỉ môi giới BĐS được cấp trong kỳ tại địa phương.", "B": "Thông tin chi tiết về thu nhập cá nhân của các nhà môi giới BĐS.", "C": "Thông tin về các dự án BĐS trên địa bàn (giao dịch, tồn kho).", "D": "Hoạt động của các tổ chức kinh doanh dịch vụ BĐS tại địa phương."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Mục đích của việc yêu cầu chủ đầu tư thông báo và nhận được văn<br>bản trả lời chấp thuận của Sở Xây dựng trước khi bán nhà ở hình thành<br>trong tương lai là gì?", "options": {"A": "Để xác nhận chính thức từ cơ quan quản lý nhà nước rằng nhà ở đó đã đáp ứng", "B": "Chỉ là thủ tục mang tính hình thức.", "C": "Để Sở Xây dựng thu phí quản lý.", "D": "Để Sở Xây dựng giới thiệu khách hàng tiềm năng cho chủ đầu tư."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Việc Luật kinh doanh bất động sản 2023 không còn quy định về vốn<br>pháp định tối thiểu (như Luật kinh doanh bất động sản 2014 từng có) mà<br>thay bằng tỷ lệ vốn chủ sở hữu/tổng mức đầu tư có ý nghĩa gì?", "options": {"A": "Giảm yêu cầu về vốn cho tất cả doanh nghiệp BĐS.", "B": "Tăng yêu cầu về vốn cho tất cả doanh nghiệp BĐS.", "C": "Chuyển trách nhiệm quản lý vốn từ cơ quan nhà nước sang các ngân hàng", "D": "Giúp yêu cầu về vốn trở nên linh hoạt, phù hợp hơn với quy mô và rủi ro của"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Cơ quan nào có trách nhiệm chính trong việc xây dựng, quản lý, vận<br>hành Hệ thống thông tin, cơ sở dữ liệu về nhà ở và thị trường BĐS ở cấp<br>Trung ương?", "options": {"A": "Bộ Thông tin và Truyền thông.", "B": "Văn phòng Chính phủ.", "C": "Bộ Xây dựng.", "D": "Bộ Nông nghiệp và Môi trường"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Việc phải kê khai nộp thuế theo quy định của pháp luật có áp dụng<br>đối với cá nhân kinh doanh BĐS quy mô nhỏ không?", "options": {"A": "Có, mặc dù không phải lập doanh nghiệp nhưng vẫn phải kê khai và nộp thuế.", "B": "Chỉ áp dụng nếu có lãi trên 100 triệu đồng/năm.", "C": "Không, vì được miễn thành lập doanh nghiệp.", "D": "Chỉ áp dụng nếu bán BĐS có giá trị trên 1 tỷ đồng."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Đâu là hệ quả pháp lý quan trọng nhất khi một cá nhân môi giới BĐS<br>hoạt động mà không có chứng chỉ hành nghề hoặc không thuộc một doanh<br>nghiệp dịch vụ BĐS?", "options": {"A": "Hoạt động đó là bất hợp pháp, vi phạm quy định của Luật kinh doanh bất động", "B": "Khách hàng có quyền từ chối trả hoa hồng.", "C": "Chỉ bị phạt tiền nếu bị phát hiện.", "D": "Không có hệ quả gì nếu giao dịch thành công"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Nguyên tắc cốt lõi nào chi phối pháp luật đất đai Việt Nam?", "options": {"A": "Đất đai thuộc sở hữu toàn dân do Nhà nước đại diện chủ sở hữu và thống nhất", "B": "Đất đai thuộc sở hữu tư nhân.", "C": "Đất đai thuộc sở hữu của cộng đồng dân cư.", "D": "Đất đai thuộc sở hữu của các tổ chức kinh tế."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Theo Luật Đất đai 2024, \"Chuyển mục đích sử dụng đất\" được hiểu<br>là gì?", "options": {"A": "Việc Nhà nước thu lại quyền sử dụng đất.", "B": "Việc đăng ký quyền sử dụng đất lần đầu.", "C": "Việc chuyển giao quyền sử dụng đất cho người khác.", "D": "Việc thay đổi mục đích sử dụng đất được pháp luật cho phép."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Quỹ phát triển đất (QPTĐ) là gì?", "options": {"A": "Tổ chức tín dụng chuyên cho vay thế chấp bất động sản.", "B": "Quỹ bảo hiểm rủi ro trong Kinh doanh bất động sản.", "C": "Quỹ tài chính nhà nước ngoài ngân sách do UBND cấp tỉnh thành lập để ứng", "D": "Quỹ đầu tư tư nhân vào đất đai."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Tổ chức kinh tế trong nước được Nhà nước cho thuê đất trả tiền<br>hằng năm có được chuyển nhượng quyền sử dụng đất không?", "options": {"A": "Có, được chuyển nhượng tự do.", "B": "Chỉ được chuyển nhượng sau khi đã trả hết tiền thuê.", "C": "Chỉ được chuyển nhượng cho Nhà nước.", "D": "Không, trừ trường hợp chuyển nhượng quyền thuê trong hợp đồng thuê đất."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Hình thức nào KHÔNG phải là hình thức chính để Nhà nước<br>giao/cho thuê đất theo Luật Đất đai 2024?", "options": {"A": "Giao đất, cho thuê đất thông qua đấu thầu lựa chọn nhà đầu tư.", "B": "Giao đất, cho thuê đất không thông qua đấu giá, đấu thầu.", "C": "Giao đất, cho thuê đất thông qua đấu giá quyền sử dụng đất.", "D": "Giao đất, cho thuê đất thông qua thỏa thuận trực tiếp với người sử dụng đất."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Khi chuyển mục đích sử dụng đất thuộc trường hợp phải xin phép,<br>người sử dụng đất có nghĩa vụ gì?", "options": {"A": "Chỉ cần nộp đơn xin phép.", "B": "Phải thực hiện nghĩa vụ tài chính theo quy định", "C": "Không cần thực hiện nghĩa vụ gì thêm.", "D": "Phải trả lại đất cho Nhà nước."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Trường hợp nào sau đây là căn cứ thu hồi đất để phát triển kinh tế -<br>xã hội vì lợi ích quốc gia, công cộng theo Điều 79 Luật Đất đai 2024?", "options": {"A": "Người sử dụng đất tự nguyện trả lại đất.", "B": "Sử dụng đất sai mục đích đã được giao, cho thuê.", "C": "Đất không được sử dụng liên tục trong thời hạn quy định.", "D": "Thực hiện dự án xây dựng khu công nghiệp, cụm công nghiệp."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Nguyên tắc bồi thường về đất khi Nhà nước thu hồi đất là gì?", "options": {"A": "Bồi thường bằng việc giao đất cùng mục đích sử dụng; nếu không có đất thì bồi", "B": "Chỉ bồi thường cho đất ở, không bồi thường cho đất nông nghiệp.", "C": "Bồi thường theo giá đất trong Bảng giá đất hàng năm.", "D": "Luôn bồi thường bằng tiền mặt."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Theo Luật Đất đai 2024, việc đăng ký đất đai có bắt buộc không?", "options": {"A": "Bắt buộc đối với mọi người sử dụng đất và người được giao đất để quản lý.", "B": "Chỉ bắt buộc đối với đất ở.", "C": "Chỉ bắt buộc đối với tổ chức.", "D": "Không bắt buộc, chỉ thực hiện khi có yêu cầu."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Khoản thu nào sau đây KHÔNG phải là nguồn thu ngân sách nhà<br>nước từ đất đai theo Điều 153 Luật Đất đai 2024?", "options": {"A": "Thuế thu nhập từ chuyển quyền sử dụng đất.", "B": "Tiền thuê đất.", "C": "Lợi nhuận từ Kinh doanh bất động sản của doanh nghiệp.", "D": "Tiền sử dụng đất."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Phương pháp định giá đất nào dựa trên việc chuyển đổi dòng thu<br>nhập ròng hàng năm dự kiến từ việc sử dụng đất thành giá trị hiện tại?", "options": {"A": "Phương pháp thu nhập.", "B": "Phương pháp hệ số điều chỉnh giá đất.", "C": "Phương pháp so sánh.", "D": "Phương pháp thặng dư."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Bảng giá đất theo Luật Đất đai 2024 được UBND cấp tỉnh xây dựng<br>và ban hành với tần suất nào (áp dụng từ 01/01/2026)?", "options": {"A": "3 năm một lần.", "B": "5 năm một lần.", "C": "Hàng năm.", "D": "Khi có biến động lớn về giá."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Tổ chức kinh tế thực hiện dự án cải tạo, xây dựng lại nhà chung cư<br>thuộc trường hợp:", "options": {"A": "Được Nhà nước giao đất không thu tiền sử dụng đất", "B": "Được Nhà nước giao đất có thu tiền sử dụng đất", "C": "Được Nhà nước cho thuê đất thu tiền thuê đất một lần cho cả thời gian thuê", "D": "Được Nhà nước cho thuê đất thu tiền thuê đất hàng năm"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Biện pháp khắc phục hậu quả nào có thể được áp dụng đối với hành<br>vi lấn, chiếm đất?", "options": {"A": "Buộc chuyển mục đích sử dụng đất.", "B": "Chỉ phạt tiền.", "C": "Tịch thu toàn bộ tài sản của người vi phạm.", "D": "Buộc khôi phục tình trạng ban đầu của đất và buộc trả lại đất."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Trước khi cơ quan nhà nước có thẩm quyền giải quyết tranh chấp<br>đất đai (trừ một số trường hợp đặc thù), thủ tục nào là bắt buộc phải thực<br>hiện tại UBND cấp xã?", "options": {"A": "Thanh tra đất đai.", "B": "Hòa giải.", "C": "Nộp đơn khởi kiện.", "D": "Xin cấp Giấy chứng nhận."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Việc Luật Đất đai 2024 loại bỏ \"Hộ gia đình\" khỏi danh sách đối<br>tượng sử dụng đất mới có ý nghĩa gì đối với các Giấy chứng nhận đã cấp cho<br>hộ gia đình trước đây?", "options": {"A": "Chỉ có chủ hộ mới có quyền quyết định đối với đất đó.", "B": "Phải làm thủ tục chuyển đổi sang tên cá nhân ngay lập tức.", "C": "Các Giấy chứng nhận đó vẫn có giá trị pháp lý cho đến khi có giao dịch mới", "D": "Các Giấy chứng nhận đó không còn giá trị pháp lý."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "\"Đất chăn nuôi tập trung\" theo phân loại của Luật Đất đai 2024<br>được định nghĩa dựa trên yếu tố nào?", "options": {"A": "Khoảng cách tối thiểu đến khu dân cư.", "B": "Việc xây dựng trang trại chăn nuôi quy mô lớn theo quy định của pháp luật về", "C": "Số lượng vật nuôi tối thiểu.", "D": "Diện tích tối thiểu."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Nguyên tắc nào được nhấn mạnh trong việc lập quy hoạch, kế hoạch<br>sử dụng đất theo Luật Đất đai 2024?", "options": {"A": "Ưu tiên tối đa cho phát triển công nghiệp.", "B": "Tăng cường công khai, minh bạch và đảm bảo sự tham gia của tổ chức, cộng", "C": "Giữ nguyên hiện trạng sử dụng đất.", "D": "Chỉ dựa trên nhu cầu của các nhà đầu tư lớn."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Hợp đồng nào sau đây KHÔNG bắt buộc phải công chứng/chứng<br>thực theo Luật Đất đai 2024, trừ khi các bên có yêu cầu?", "options": {"A": "Hợp đồng góp vốn bằng quyền sử dụng đất.", "B": "Hợp đồng tặng cho quyền sử dụng đất giữa cá nhân với cá nhân.", "C": "Hợp đồng cho thuê quyền sử dụng đất giữa hai tổ chức kinh tế.", "D": "Hợp đồng thế chấp quyền sử dụng đất tại tổ chức tín dụng."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Điều kiện về năng lực tài chính của người được giao đất, cho thuê đất<br>để thực hiện dự án đầu tư nhằm mục đích gì?", "options": {"A": "Đảm bảo nộp đủ tiền sử dụng đất, tiền thuê đất.", "B": "Đảm bảo có đủ vốn để thực hiện dự án đúng tiến độ.", "C": "Để xác định thời hạn giao đất, cho thuê đất.", "D": "Để tính toán mức miễn, giảm tiền sử dụng đất."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Trường hợp nào sau đây thuộc diện \"Giao đất không thu tiền sử<br>dụng đất\" theo Điều 118 luật đất đai 2024?", "options": {"A": "Đất xây dựng trụ sở cơ quan nhà nước, đơn vị vũ trang.", "B": "Tổ chức kinh tế có vốn đầu tư nước ngoài làm dự án khu công nghiệp.", "C": "Tổ chức kinh tế làm dự án nhà ở thương mại.", "D": "Cá nhân được giao đất ở trong hạn mức."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Việc xây dựng Bảng giá đất hàng năm (thay vì 5 năm) đặt ra thách<br>thức lớn nhất là gì cho các địa phương?", "options": {"A": "Làm tăng chi phí hành chính không đáng kể.", "B": "Yêu cầu phải có nguồn lực, cơ sở dữ liệu giá đất thị trường đầy đủ, cập nhật và", "C": "Gây khó khăn cho người dân trong việc tra cứu.", "D": "Khó khăn trong việc in ấn và phát hành bảng giá mới."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Vai trò của Hội đồng thẩm định giá đất cụ thể là gì?", "options": {"A": "Quyết định cuối cùng về giá đất cụ thể.", "B": "Trực tiếp đi khảo sát và đưa ra mức giá đất cụ thể.", "C": "Thu thập thông tin giá đất trên thị trường.", "D": "Thẩm định phương án giá đất cụ thể do cơ quan nông nghiệp & môi trường lập"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Thời hiệu xử phạt vi phạm hành chính trong lĩnh vực đất đai là bao<br>lâu?", "options": {"A": "2 năm.", "B": "1 năm.", "C": "Không có thời hiệu.", "D": "6 tháng."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Đối với người sử dụng đất là cá nhân, việc nắm rõ quy trình và quyền<br>lợi khi Nhà nước thu hồi đất có ý nghĩa gì?", "options": {"A": "Để có thể tự thỏa thuận giá bồi thường với chủ đầu tư dự án.", "B": "Giúp họ đòi hỏi mức bồi thường cao hơn quy định.", "C": "Giúp họ trì hoãn việc bàn giao đất cho Nhà nước.", "D": "Để chủ động bảo vệ quyền lợi hợp pháp của mình về bồi thường, hỗ trợ, tái"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Tổ chức, cá nhân Kinh doanh bất động sản (trừ quy mô nhỏ, không<br>thường xuyên) phải đáp ứng điều kiện nào về chủ thể theo Luật kinh doanh<br>bất động sản 2023?", "options": {"A": "Bắt buộc phải là công ty cổ phần.", "B": "Có thể hoạt động dưới danh nghĩa cá nhân nếu có đủ vốn.", "C": "Chỉ cần đăng ký hộ kinh doanh cá thể.", "D": "Phải thành lập doanh nghiệp hoặc hợp tác xã, liên hiệp hợp tác xã."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Chủ đầu tư dự án bất động sản có quy mô sử dụng đất dưới 20 ha<br>phải đảm bảo vốn chủ sở hữu tối thiểu là bao nhiêu phần trăm tổng vốn đầu<br>tư theo Luật kinh doanh bất động sản 2023?", "options": {"A": "15%", "B": "10%", "C": "25%", "D": "20%"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Cá nhân Kinh doanh bất động sản quy mô nhỏ theo Luật kinh doanh<br>bất động sản 2023 có bắt buộc phải thành lập doanh nghiệp không?", "options": {"A": "Bắt buộc phải thành lập doanh nghiệp TNHH.", "B": "Không bắt buộc thành lập doanh nghiệp nhưng phải kê khai, nộp thuế.", "C": "Chỉ cần có chứng chỉ hành nghề môi giới.", "D": "Bắt buộc phải thành lập hợp tác xã."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Hành vi nào sau đây bị nghiêm cấm trong Kinh doanh bất động sản<br>theo Luật kinh doanh bất động sản 2023?", "options": {"A": "Công khai thông tin về dự án bất động sản.", "B": "Sử dụng hợp đồng theo mẫu do Chính phủ quy định.", "C": "Kinh doanh bất động sản không đủ điều kiện theo quy định.", "D": "Thu tiền đặt cọc không quá 5% giá bán nhà ở hình thành trong tương lai đủ"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Giấy tờ nào sau đây KHÔNG bắt buộc phải có trong hồ sơ đề nghị<br>cấp Giấy phép xây dựng cho dự án theo Luật Xây dựng và Nghị định<br>175/2024/NĐ-CP?", "options": {"A": "Giấy tờ chứng minh quyền sử dụng đất.", "B": "Đơn đề nghị cấp GPXD.", "C": "Giấy chứng nhận thẩm duyệt thiết kế về PCCC (nếu có yêu cầu).", "D": "Hợp đồng mua bán nhà ở hình thành trong tương lai."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Chủ đầu tư có được phép đưa công trình vào khai thác, sử dụng ngay<br>sau khi tự tổ chức nghiệm thu hoàn thành không?", "options": {"A": "Được phép đối với mọi công trình.", "B": "Chỉ cần có biên bản nghiệm thu của nhà thầu thi công.", "C": "Phải có văn bản chấp thuận kết quả nghiệm thu của cơ quan chuyên môn về xây", "D": "Chỉ được phép đối với công trình nhà ở riêng lẻ."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Điều kiện nào là bắt buộc đối với nhà chung cư hình thành trong<br>tương lai trước khi chủ đầu tư được phép bán hoặc cho thuê mua theo Luật<br>kinh doanh bất động sản 2023?", "options": {"A": "Hoàn thành xây dựng phần mái.", "B": "Hoàn thành sơn, trang trí mặt ngoài.", "C": "Có biên bản nghiệm thu đã hoàn thành xong phần móng.", "D": "Có giấy chứng nhận quyền sở hữu cho từng căn hộ."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Nhà đầu tư trong nước tự nguyện xin cấp Giấy chứng nhận đăng ký<br>đầu tư (IRC) thì quy trình thủ tục sẽ như thế nào so với nhà đầu tư nước<br>ngoài?", "options": {"A": "Phức tạp hơn do phải chứng minh nguồn gốc vốn trong nước.", "B": "Tương tự, nhưng không phải đáp ứng các điều kiện tiếp cận thị trường dành", "C": "Đơn giản hơn nhiều, chỉ cần nộp đơn và giấy đăng ký kinh doanh.", "D": "Bắt buộc phải thông qua đấu thầu lựa chọn nhà đầu tư."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Tổng Liên đoàn Lao động Việt Nam được phép đầu tư xây dựng nhà<br>ở xã hội bằng nguồn tài chính nào và cho đối tượng nào thuê theo Luật Nhà ở<br>2023?", "options": {"A": "Bằng vốn ngân sách nhà nước, cho mọi đối tượng thuê.", "B": "Bằng nguồn tài chính công đoàn, cho công nhân, người lao động thuộc đối", "C": "Bằng vốn vay ưu đãi, cho cán bộ công đoàn thuê.", "D": "Bằng vốn xã hội hóa, cho đoàn viên công đoàn có thu nhập cao thuê."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Luật kinh doanh bất động sản 2023 KHÔNG áp dụng cho trường<br>hợp chuyển nhượng bất động sản nào sau đây?", "options": {"A": "Cho thuê lại văn phòng thương mại.", "B": "Chuyển nhượng quyền sử dụng đất đã có hạ tầng trong dự án.", "C": "Bán, chuyển nhượng tài sản là bất động sản theo quyết định của tòa án khi giải", "D": "Chuyển nhượng nhà ở hình thành trong tương lai."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Trường hợp nào nhà đầu tư KHÔNG phải thực hiện ký quỹ bảo đảm<br>thực hiện dự án khi được Nhà nước giao đất, cho thuê đất?", "options": {"A": "Dự án đầu tư xây dựng nhà ở xã hội.", "B": "Nhà đầu tư nhận chuyển nhượng quyền sử dụng đất, tài sản gắn liền với đất từ", "C": "Dự án có sử dụng công nghệ cao.", "D": "Dự án đầu tư tại địa bàn có điều kiện kinh tế - xã hội khó khăn."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Khi lập dự án đầu tư bất động sản, nhà đầu tư phải có quyền sử dụng<br>đất hợp pháp hoặc:", "options": {"A": "Có chứng nhận đủ năng lực tài chính", "B": "Được Nhà nước cam kết giao đất, cho thuê đất", "C": "Có thỏa thuận nguyên tắc với chính quyền địa phương", "D": "Có cam kết bảo lãnh ngân hàng về tài chính"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Một trong các tiêu chí để lựa chọn nhà đầu tư dự án bất động sản là<br>gì?", "options": {"A": "Phương án đầu tư dự án khả thi và hiệu quả nhất", "B": "Mức giá bán sản phẩm cao nhất", "C": "Thời gian thi công càng nhanh càng tốt", "D": "Kết nối quan hệ với cơ quan quản lý"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Vốn chủ sở hữu của doanh nghiệp đầu tư dự án Kinh doanh bất<br>động sản được xác định dựa trên tài liệu nào sau đây?", "options": {"A": "Báo cáo tài chính đã được kiểm toán", "B": "Cam kết góp vốn của cổ đông", "C": "Giấy chứng nhận đăng ký doanh nghiệp", "D": "Hợp đồng vay vốn với ngân hàng"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Thủ tục cuối cùng trong quá trình thực hiện một dự án đầu tư Kinh<br>doanh bất động sản là:", "options": {"A": "Ký hợp đồng thi công giai đoạn cuối", "B": "Nghiệm thu đưa công trình vào sử dụng và cấp sổ cho khách hàng", "C": "Thực hiện báo cáo tài chính dự án", "D": "Xin phép chuyển nhượng quyền sử dụng đất"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Trách nhiệm của chủ đầu tư trong giai đoạn thực hiện dự án không<br>bao gồm nội dung nào sau đây?", "options": {"A": "Bảo đảm tiến độ và chất lượng công trình", "B": "Tự ý điều chỉnh quy hoạch chi tiết 1/500", "C": "Cung cấp thông tin dự án cho khách hàng", "D": "Ký hợp đồng mua bán theo mẫu đã đăng ký"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Chủ thể nào có trách nhiệm công khai thông tin dự án bất động sản<br>đưa vào kinh doanh?", "options": {"A": "Cơ quan quản lý nhà nước về xây dựng", "B": "Người mua bất động sản", "C": "Chủ đầu tư dự án bất động sản", "D": "Sàn giao dịch bất động sản trung gian"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Chủ đầu tư phải công khai thông tin dự án bất động sản từ thời<br>điểm nào sau đây?", "options": {"A": "Sau khi ký hợp đồng mua bán", "B": "Trước khi huy động vốn, chào bán, cho thuê hoặc cho thuê mua bất động sản", "C": "Sau khi nghiệm thu toàn bộ dự án", "D": "Sau khi hoàn thành xây dựng phần móng"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Chủ đầu tư không được phép chuyển nhượng quyền sở hữu nhà ở<br>thương mại trong trường hợp nào?", "options": {"A": "Sau khi hoàn công nhưng chưa nghiệm thu", "B": "Nhà ở đang bị thế chấp, chưa được giải chấp hoặc không có thỏa thuận với bên", "C": "Sau khi ký hợp đồng đặt cọc", "D": "Sau khi bàn giao nhưng chưa có sổ hồng"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Trình tự thực hiện một dự án đầu tư Kinh doanh bất động sản gồm<br>các bước nào sau đây?", "options": {"A": "Lập dự án → Giao đất → Thiết kế kỹ thuật → Thi công", "B": "Lập dự án → Thẩm định, chấp thuận chủ trương đầu tư → Giao đất/cho thuê", "C": "Chấp thuận chủ trương đầu tư → Giao đất → Xây dựng → Bán sản phẩm", "D": "Giao đất → Nộp tiền sử dụng đất → Lập dự án → Xây dựng"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Quyền sở hữu bất động sản theo Bộ luật Dân sự 2015 bao gồm<br>những quyền năng cơ bản nào", "options": {"A": "Quyền sử dụng và quyền định đoạt.", "B": "Quyền khai thác và quyền chuyển nhượng.", "C": "Quyền chiếm hữu, quyền sử dụng và quyền định đoạt.", "D": "Quyền chiếm hữu và quyền sử dụng."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Theo Bộ luật Dân sự 2015, \"tài sản hình thành trong tương lai\" có<br>thể là đối tượng của giao dịch dân sự không", "options": {"A": "Có, bao gồm cả bất động sản chưa hình thành hoặc chưa xác lập quyền sở hữu", "B": "Chỉ áp dụng cho động sản, không áp dụng cho bất động sản.", "C": "Không, chỉ tài sản hiện có mới được giao dịch.", "D": "Chỉ khi có sự đồng ý của cơ quan nhà nước có thẩm quyền."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Hình thức bắt buộc đối với hợp đồng mua bán bất động sản theo<br>quy định chung của Bộ luật Dân sự 2015 là gì", "options": {"A": "Bằng thông điệp dữ liệu điện tử.", "B": "Phải lập thành văn bản, có công chứng hoặc chứng thực (trừ trường hợp luật có", "C": "Chỉ cần lập thành văn bản.", "D": "Bằng lời nói."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Hợp đồng tặng cho bất động sản có hiệu lực kể từ thời điểm nào nếu<br>bất động sản đó phải đăng ký quyền sở hữu", "options": {"A": "Kể từ thời điểm bên được tặng cho nhận tài sản.", "B": "Kể từ thời điểm các bên ký hợp đồng.", "C": "Kể từ thời điểm đăng ký quyền sở hữu.", "D": "Kể từ thời điểm hợp đồng được công chứng/chứng thực."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Bên thuê bất động sản có được phép cho thuê lại không", "options": {"A": "Không được phép trong mọi trường hợp.", "B": "Được phép nếu có sự đồng ý bằng văn bản của bên cho thuê.", "C": "Được phép tự do mà không cần sự đồng ý.", "D": "Chỉ được phép khi thời hạn thuê còn trên 1 năm."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Di sản thừa kế theo Bộ luật Dân sự 2015 bao gồm những gì", "options": {"A": "Chỉ bất động sản của người chết.", "B": "Chỉ phần tài sản của người chết trong tài sản chung với người khác.", "C": "Chỉ tài sản riêng của người chết.", "D": "Tài sản riêng của người chết và phần tài sản của người chết trong tài sản chung"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Hình thức di chúc nào được khuyến nghị để đảm bảo tính pháp lý<br>và tránh tranh chấp đối với di sản là bất động sản", "options": {"A": "Di chúc có người làm chứng nhưng không công chứng/chứng thực.", "B": "Di chúc miệng.", "C": "Di chúc viết tay không có người làm chứng.", "D": "Di chúc bằng văn bản có công chứng hoặc chứng thực."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Công ty ký hợp đồng đặt cọc mua bất động sản với bên bán là cá<br>nhân. Sau đó cá nhân bán cho người khác. Công ty có thể đòi lại tài sản hoặc<br>kiện được không", "options": {"A": "Không vì hợp đồng đặt cọc không phải hợp đồng chính thức", "B": "Có, vì cá nhân đã vi phạm cam kết đặt cọc", "C": "Không, vì tài sản đã thuộc về người khác", "D": "Có, nếu có thỏa thuận rõ ràng về hủy đặt cọc"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Thời hạn SỞ HỮU nhà chung cư theo Luật Nhà ở 2023 được xác<br>định như thế nào", "options": {"A": "Không quy định thời hạn sở hữu, chỉ có thời hạn sử dụng theo hồ sơ thiết kế và", "B": "Có thời hạn theo thiết kế của tòa nhà (ví dụ 50 năm, 70 năm).", "C": "Phụ thuộc vào thỏa thuận trong hợp đồng mua bán.", "D": "Có thời hạn theo thời hạn sử dụng đất của dự án."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Mục đích chính của việc yêu cầu công chứng, chứng thực đối với các<br>giao dịch bất động sản là gì", "options": {"A": "Tạo công việc cho các công chứng viên.", "B": "Tăng nguồn thu cho ngân sách nhà nước.", "C": "Làm chậm quá trình giao dịch để các bên suy nghĩ kỹ hơn.", "D": "Đảm bảo tính pháp lý, an toàn, minh bạch, hạn chế tranh chấp và tăng cường"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Hậu quả pháp lý trực tiếp của việc một giao dịch dân sự về bất động<br>sản có mục đích hoặc nội dung vi phạm điều cấm của luật hoặc trái đạo đức<br>xã hội là gì", "options": {"A": "Giao dịch chỉ bị hạn chế hiệu lực.", "B": "Chỉ bên vi phạm phải chịu trách nhiệm.", "C": "Các bên phải thỏa thuận lại nội dung.", "D": "Giao dịch bị coi là vô hiệu."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Di chúc miệng chỉ được công nhận hợp pháp trong điều kiện nào<br>sau đây", "options": {"A": "Người lập di chúc trên 70 tuổi và không biết chữ.", "B": "Người lập di chúc minh mẫn và có ít nhất 1 người làm chứng.", "C": "Tính mạng người lập di chúc bị cái chết đe dọa và không thể lập di chúc bằng", "D": "Di chúc được ghi âm và có xác nhận của người thân."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Công chứng viên hoặc người có thẩm quyền chứng thực tại UBND<br>cấp xã có được phép công chứng, chứng thực di chúc nếu con của họ là người<br>được hưởng thừa kế theo di chúc đó không", "options": {"A": "Không được phép.", "B": "Được phép nếu người lập di chúc đồng ý.", "C": "Chỉ không được phép nếu chính họ là người hưởng thừa kế.", "D": "Được phép nếu giá trị di sản không lớn."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Hoa lợi, lợi tức phát sinh từ tài sản riêng của vợ hoặc chồng trong<br>thời kỳ hôn nhân được xác định là tài sản gì, trừ khi có thỏa thuận khác", "options": {"A": "Là tài sản chung của vợ chồng.", "B": "Chia đôi giữa vợ và chồng.", "C": "Luôn là tài sản riêng của người có tài sản đó.", "D": "Thuộc sở hữu nhà nước."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Yếu tố nào sau đây được coi là \"lao động có thu nhập\" khi Tòa án<br>xem xét công sức đóng góp của vợ, chồng vào việc tạo lập, duy trì tài sản<br>chung khi ly hôn", "options": {"A": "Chỉ việc đóng góp bằng tài sản riêng.", "B": "Chỉ công việc được trả lương theo hợp đồng lao động.", "C": "Lao động trong gia đình (nội trợ, chăm sóc con cái...).", "D": "Chỉ công việc tạo ra tiền bạc trực tiếp."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Giao dịch chuyển đổi quyền sử dụng đất nông nghiệp giữa các hộ<br>gia đình, cá nhân có bắt buộc phải công chứng, chứng thực theo Luật Đất đai<br>2024 không", "options": {"A": "Bắt buộc phải chứng thực tại UBND xã.", "B": "Bắt buộc phải công chứng.", "C": "Không bắt buộc, nhưng có thể công chứng/chứng thực theo yêu cầu.", "D": "Chỉ bắt buộc nếu giá trị đất lớn."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Hợp đồng thế chấp nhà ở hình thành trong tương lai cho tổ chức tín<br>dụng có bắt buộc phải công chứng, chứng thực theo Luật Nhà ở 2023 không", "options": {"A": "Không bắt buộc công chứng, chứng thực.", "B": "Chỉ bắt buộc nếu giá trị vay lớn hơn giá trị nhà.", "C": "Bắt buộc phải công chứng.", "D": "Bắt buộc phải chứng thực."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Văn bản ủy quyền liên quan đến việc thực hiện các quyền đối với<br>bất động sản có thể được công chứng ở đâu", "options": {"A": "Tại tổ chức hành nghề công chứng nơi người ủy quyền hoặc người được ủy", "B": "Tại tổ chức hành nghề công chứng nơi người ủy quyền cư trú hoặc nơi có bất", "C": "Chỉ tại tổ chức hành nghề công chứng nơi có bất động sản.", "D": "Tại bất kỳ tổ chức hành nghề công chứng nào trên toàn quốc."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Thỏa thuận đặt cọc để mua nhà ở hình thành trong tương lai theo<br>Luật KD BĐS 2023 phải bao gồm nội dung gì về giá", "options": {"A": "Giá sẽ được xác định khi ký hợp đồng mua bán chính thức.", "B": "Chỉ cần ghi khoảng giá tham khảo.", "C": "Phải ghi rõ giá bán hoặc giá cho thuê mua dự kiến tại thời điểm ký thỏa thuận", "D": "Không cần ghi giá, chỉ cần ghi số tiền cọc."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Việc Luật Đất đai 2024 không còn quy định \"hộ gia đình\" là đối<br>tượng sử dụng đất mới có ý nghĩa gì", "options": {"A": "Đơn giản hóa chủ thể quan hệ pháp luật đất đai cho phù hợp với BLDS, các", "B": "Buộc các thành viên hộ gia đình phải tách sổ đỏ riêng.", "C": "Thu hồi lại đất đã cấp cho hộ gia đình trước đây.", "D": "Không có ý nghĩa gì quan trọng."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Người gốc Việt Nam định cư ở nước ngoài (không còn quốc tịch Việt<br>Nam) có được phép đầu tư xây dựng nhà ở để bán, cho thuê theo Luật Đất<br>đai 2024 không", "options": {"A": "Không, chỉ công dân Việt Nam định cư ở nước ngoài mới được.", "B": "Chỉ được đầu tư vào dự án nhà ở xã hội.", "C": "Có, được phép đầu tư xây dựng nhà ở, công trình xây dựng để bán, cho thuê,", "D": "Chỉ được mua nhà ở để ở."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Nếu một cá nhân mua căn hộ chung cư sau khi kết hôn và không<br>dùng tài sản riêng, cũng không được tặng cho riêng hay thừa kế riêng, thì<br>việc thế chấp căn hộ này sau đó cần sự đồng ý của ai", "options": {"A": "Chỉ cần người đứng tên trên hợp đồng mua bán.", "B": "Cần sự thỏa thuận bằng văn bản của cả hai vợ chồng.", "C": "Chỉ cần người đứng tên trên Giấy chứng nhận (nếu đã có).", "D": "Chỉ cần thông báo cho người vợ/chồng còn lại."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Khi phân chia di sản là bất động sản theo pháp luật, nếu hàng thừa<br>kế thứ nhất còn đầy đủ (vợ, 2 con), thì những người ở hàng thừa kế thứ hai<br>(ví dụ: anh trai của người chết) có được hưởng thừa kế không", "options": {"A": "Chỉ được hưởng nếu di sản có giá trị rất lớn.", "B": "Không, vì những người ở hàng sau chỉ được hưởng nếu không còn ai ở hàng", "C": "Có, được chia một phần nhỏ hơn.", "D": "Có, nếu được những người hàng thứ nhất đồng ý."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Một người lập di chúc truất quyền hưởng di sản của người con chưa<br>thành niên. Di chúc này có hợp pháp về mặt nội dung truất quyền không", "options": {"A": "Chỉ hợp pháp nếu người con đó hư hỏng, bất hiếu.", "B": "Có, người lập di chúc có toàn quyền định đoạt.", "C": "Không, vì con chưa thành niên thuộc diện người thừa kế không phụ thuộc vào", "D": "Chỉ hợp pháp nếu người con đó đã có tài sản riêng đủ sống."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Nếu hợp đồng thế chấp bất động sản đã được công chứng nhưng<br>chưa đăng ký giao dịch bảo đảm, thì hiệu lực của hợp đồng này như thế nào", "options": {"A": "Chỉ có hiệu lực về mặt hình thức.", "B": "Vô hiệu hoàn toàn.", "C": "Chỉ có hiệu lực khi có tranh chấp xảy ra.", "D": "Có hiệu lực giữa các bên thế chấp và nhận thế chấp, nhưng chưa có hiệu lực đối"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Việc công chứng Hợp đồng góp vốn bằng BĐS giữa một doanh<br>nghiệp và một cá nhân có bắt buộc theo Luật Đất đai 2024 không", "options": {"A": "Bắt buộc.", "B": "Không bắt buộc nếu doanh nghiệp là doanh nghiệp kinh doanh bất động sản..", "C": "Không bắt buộc trong mọi trường hợp.", "D": "Chỉ bắt buộc nếu cá nhân góp vốn."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Biện pháp nào giúp giảm thiểu rủi ro cho khách hàng khi ký Hợp<br>đồng đặt cọc mua BĐS hình thành trong tương lai", "options": {"A": "Yêu cầu công chứng Hợp đồng đặt cọc với giá trị cao.", "B": "Chuyển tiền đặt cọc qua tài khoản của công chứng viên.", "C": "Yêu cầu môi giới cam kết bằng văn bản.", "D": "Chỉ ký Hợp đồng đặt cọc trực tiếp với chủ đầu tư và yêu cầu xem hồ sơ pháp lý"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Điểm khác biệt cơ bản nhất về trách nhiệm giữa công chứng viên<br>khi công chứng hợp đồng và người thực hiện chứng thực khi chứng thực hợp<br>đồng là gì", "options": {"A": "Công chứng viên không chịu trách nhiệm nếu các bên cung cấp thông tin sai.", "B": "Công chứng viên chịu trách nhiệm về cả nội dung và hình thức, người chứng", "C": "Người chứng thực chịu trách nhiệm cao hơn về nội dung.", "D": "Cả hai đều chỉ chịu trách nhiệm về hình thức ký kết."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Trường hợp nào sau đây vẫn bắt buộc phải công chứng hoặc chứng<br>thực theo quy định của Luật Đất đai 2024", "options": {"A": "Hợp đồng cho thuê quyền sử dụng đất giữa hai doanh nghiệp.", "B": "Hợp đồng chuyển đổi quyền sử dụng đất nông nghiệp.", "C": "Hợp đồng chuyển nhượng quyền sử dụng đất mà một bên là doanh nghiệp kinh", "D": "Văn bản về thừa kế quyền sử dụng đất giữa các cá nhân."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Doanh nghiệp kinh doanh bất động sản có thể lựa chọn công chứng<br>hợp đồng, giao dịch bất động sản tại tổ chức hành nghề công chứng nào", "options": {"A": "Tại Phòng Công chứng hoặc Văn phòng công chứng trong phạm vi tỉnh/thành", "B": "Chỉ tại Văn phòng công chứng nơi có bất động sản", "C": "Chỉ tại Phòng Công chứng nơi doanh nghiệp đặt trụ sở chính.", "D": "Tại bất kỳ Phòng Công chứng hoặc Văn phòng công chứng nào trên toàn quốc."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Thời hạn công chứng hợp đồng, giao dịch thông thường không quá<br>bao nhiêu ngày kể từ ngày nhận đủ hồ sơ hợp lệ?", "options": {"A": "Không quá 01 ngày làm việc.", "B": "Không quá 02 ngày làm việc.", "C": "Không quá 10 ngày làm việc.", "D": "Không quá 05 ngày làm việc."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Khi doanh nghiệp công chứng hợp đồng, người ký thay mặt doanh<br>nghiệp nếu không phải người đại diện theo pháp luật cần có giấy tờ gì", "options": {"A": "Thẻ nhân viên của doanh nghiệp.", "B": "Giấy xác nhận tình trạng hôn nhân.", "C": "Giấy giới thiệu của doanh nghiệp.", "D": "Văn bản ủy quyền hợp lệ"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Đối với công ty cổ phần, việc công chứng hợp đồng chuyển nhượng<br>bất động sản có giá trị lớn có thể cần thêm giấy tờ gì từ doanh nghiệp", "options": {"A": "Báo cáo tài chính quý gần nhất.", "B": "Quyết định hoặc Nghị quyết của Đại hội đồng cổ đông/Hội đồng quản trị phê", "C": "Biên bản họp công đoàn công ty.", "D": "Danh sách cổ đông sáng lập."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Việc chuyển nhượng hợp đồng mua bán nhà ở hình thành trong<br>tương lai giữa cá nhân có bắt buộc phải công chứng hoặc chứng thực không", "options": {"A": "Chỉ bắt buộc nếu giá trị trên 1 tỷ đồng.", "B": "Không bắt buộc.", "C": "Bắt buộc phải công chứng hoặc chứng thực.", "D": "Chỉ cần xác nhận của chủ đầu tư."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Doanh nghiệp có thu nhập từ chuyển nhượng bất động sản phải nộp<br>loại thuế nào", "options": {"A": "Chỉ Thuế Thu nhập doanh nghiệp (TNDN).", "B": "Chỉ Lệ phí trước bạ.", "C": "Chỉ Thuế Giá trị gia tăng (GTGT).", "D": "Cả Thuế GTGT và Thuế TNDN, lệ phí trước bạ"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Lệ phí công chứng hợp đồng kinh doanh Bất động sản được tính<br>dựa trên cơ sở nào", "options": {"A": "Số lượng trang của hợp đồng.", "B": "Giá trị tài sản hoặc giá trị hợp đồng/giao dịch theo biểu phí quy định.", "C": "Diện tích Bất động sản.", "D": "Thỏa thuận tự do giữa các bên và công chứng viên."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Khi công chứng Hợp đồng chuyển nhượng dự án BĐS, văn bản<br>chấp thuận của cơ quan nhà nước có thẩm quyền cần được cung cấp ở giai<br>đoạn nào", "options": {"A": "Sau khi đã ký hợp đồng công chứng.", "B": "Trước khi các bên ký kết hợp đồng công chứng.", "C": "Chỉ cần khi làm thủ tục đăng ký biến động.", "D": "Không cần thiết nếu các bên tự thỏa thuận."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Lợi ích chính của công chứng điện tử đối với doanh nghiệp bất động<br>sản là gì", "options": {"A": "Giảm yêu cầu về năng lực tài chính của doanh nghiệp.", "B": "Miễn hoàn toàn phí công chứng.", "C": "Tiết kiệm thời gian, chi phí đi lại, tăng tốc độ giao dịch.", "D": "Không cần phải nộp thuế thu nhập doanh nghiệp."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Rủi ro nào thường gặp nhất đối với hợp đồng đặt cọc mua BĐS, kể<br>cả khi có công chứng", "options": {"A": "Công chứng viên thu phí đặt cọc quá cao.", "B": "Bên bán không giao BĐS đúng hạn.", "C": "Đặt cọc trá hình huy động vốn cho dự án chưa đủ điều kiện hoặc đặt cọc qua", "D": "Hợp đồng đặt cọc quá dài."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Hình thức giải quyết tranh chấp nào yêu cầu phải có thỏa thuận<br>trước của các bên", "options": {"A": "Khiếu nại lên Sở Tư pháp.", "B": "Hòa giải tại UBND xã.", "C": "Tòa án nhân dân.", "D": "Trọng tài thương mại."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Ưu điểm nổi bật của việc giải quyết tranh chấp bằng Trọng tài<br>thương mại so với Tòa án là gì", "options": {"A": "Thủ tục nhanh chóng, linh hoạt, bảo mật, trọng tài viên có chuyên môn cao.", "B": "Phán quyết có thể bị kháng cáo lên Tòa án cấp cao.", "C": "Chi phí luôn rẻ hơn.", "D": "Không cần nộp bất kỳ khoản phí nào."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Nhược điểm của giải quyết tranh chấp bằng Trọng tài thương mại<br>là gì", "options": {"A": "Phán quyết không có giá trị thi hành.", "B": "Chỉ giải quyết được tranh chấp giữa các cá nhân.", "C": "Thời gian giải quyết quá dài.", "D": "Phải có thỏa thuận trọng tài thương mại; phạm vi áp dụng còn hạn chế, một số"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Tại sao doanh nghiệp nên cân nhắc đưa điều khoản lựa chọn Trọng<br>tài thương mại vào hợp đồng kinh doanh BĐS", "options": {"A": "Để tránh phải công chứng hợp đồng.", "B": "Để thể hiện sự giàu có của doanh nghiệp.", "C": "Để có phương thức giải quyết tranh chấp nhanh chóng, bảo mật, chuyên môn", "D": "Vì Tòa án không giải quyết tranh chấp BĐS."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Khi công chứng Hợp đồng chuyển nhượng dự án BĐS, văn bản<br>chấp thuận của cơ quan nhà nước có thẩm quyền cần được cung cấp ở giai<br>đoạn nào", "options": {"A": "Chỉ cần khi làm thủ tục đăng ký biến động.", "B": "Không cần thiết nếu các bên tự thỏa thuận.", "C": "Trước khi các bên ký kết hợp đồng công chứng.", "D": "Sau khi đã ký hợp đồng công chứng."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Giá trị pháp lý của văn bản công chứng điện tử theo Luật Công<br>chứng 2024 so với văn bản công chứng giấy là như thế nào", "options": {"A": "Thấp hơn văn bản giấy.", "B": "Chỉ có giá trị khi được in ra và đóng dấu.", "C": "Tương đương văn bản giấy.", "D": "Cao hơn văn bản giấy."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Hậu quả pháp lý chính nếu một hợp đồng kinh doanh BĐS thuộc<br>trường hợp bắt buộc công chứng nhưng các bên không thực hiện công chứng", "options": {"A": "Hợp đồng chỉ có hiệu lực một phần.", "B": "Hợp đồng có thể bị Tòa án tuyên vô hiệu do vi phạm về hình thức.", "C": "Các bên chỉ bị phạt hành chính.", "D": "Hợp đồng vẫn có hiệu lực nhưng không được đăng ký biến động."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Trường hợp nào công chứng viên được phép công chứng giao dịch<br>bất động sản ngoài phạm vi tỉnh/thành phố nơi đặt trụ sở", "options": {"A": "Hợp đồng mua bán nhà ở giá trị lớn.", "B": "Hợp đồng thế chấp quyền sử dụng đất.", "C": "Văn bản ủy quyền liên quan đến việc thực hiện quyền đối với bất động sản.", "D": "Hợp đồng góp vốn bằng bất động sản."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Hồ sơ pháp lý quan trọng nào chứng minh nhà ở hình thành trong<br>tương lai đủ điều kiện bán mà chủ đầu tư cần cung cấp khi công chứng Hợp<br>đồng mua bán", "options": {"A": "Giấy chứng nhận đăng ký doanh nghiệp của chủ đầu tư.", "B": "Biên bản nghiệm thu đã hoàn thành xong phần móng của tòa nhà.", "C": "Hợp đồng hợp tác đầu tư với nhà thầu xây dựng.", "D": "Chứng thư thẩm định giá bất động sản."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Nếu một Văn phòng công chứng gây thiệt hại cho doanh nghiệp do<br>lỗi của công chứng viên, trách nhiệm bồi thường thuộc về ai", "options": {"A": "Sở Tư pháp nơi VPCC đăng ký hoạt động.", "B": "Chỉ công chứng viên gây ra lỗi.", "C": "Văn phòng công chứng nơi công chứng viên đó hành nghề (và tổ chức này có", "D": "Hiệp hội công chứng viên Việt Nam."}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Hạn chế của việc công chứng trong việc đảm bảo chất lượng thực tế<br>của BĐS hình thành trong tương lai là gì", "options": {"A": "Công chứng viên không kiểm tra hồ sơ pháp lý.", "B": "Công chứng viên chỉ chứng nhận tính hợp pháp của giao dịch trên giấy tờ tại", "C": "Phí công chứng quá cao làm tăng giá BĐS.", "D": "Hợp đồng công chứng không có giá trị pháp lý đối với BĐS hình thành trong"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Trong giao dịch mua bán nhà đất giữa vợ và chồng (quan hệ hôn<br>nhân), loại thuế nào được miễn theo quy định", "options": {"A": "Thuế giá trị gia tăng", "B": "Thuế thu nhập cá nhân", "C": "Thuế môn bài", "D": "Thuế sử dụng đất phi nông nghiệp"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Thuế sử dụng đất phi nông nghiệp đối với đất ở theo quy định hiện<br>hành được tính theo mức nào sau đây", "options": {"A": "Từ 0,03% đến 0,15%", "B": "Từ 1% đến 2%", "C": "Từ 0,2% đến 0,5%", "D": "Từ 0,01% đến 0,03%"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Một doanh nghiệp bất động sản phải nộp Thuế Giá Trị Gia Tăng<br>(VAT) với mức thuế suất 10%. Cách tính VAT trong hoạt động Kinh doanh<br>bất động sản là:", "options": {"A": "Tính trên lợi nhuận sau thuế", "B": "Tính trên giá trị tài sản cố định", "C": "Tính trên tổng doanh thu trước trừ chi phí", "D": "Tính trên giá trị tăng thêm"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Trong một giao dịch mua bán bất động sản, hai bên sử dụng “vi<br>bằng” thay cho hợp đồng công chứng. Hệ quả của việc này là:", "options": {"A": "Vi bằng giúp giảm chi phí giao dịch mà không có rủi ro pháp lý", "B": "Vi bằng chỉ áp dụng đối với giao dịch thương mại, không phải bất động sản", "C": "Người mua có thể không được đảm bảo quyền sử dụng tài sản do không có căn", "D": "Vi bằng có giá trị pháp lý như hợp đồng công chứng"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Ai là đối tượng phải nộp phí thẩm định hồ sơ cấp giấy chứng nhận<br>quyền sử dụng đất", "options": {"A": "Người xin cấp giấy chứng nhận lần đầu hoặc khi có nhu cầu cấp đổi, cấp lại", "B": "Tất cả hộ gia đình đang sử dụng đất", "C": "Người thuê đất trả tiền thuê hàng năm", "D": "Chỉ doanh nghiệp xin cấp giấy chứng nhận"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Trong thủ tục cấp giấy chứng nhận quyền sử dụng đất lần đầu, nếu<br>người nộp hồ sơ không thực hiện đầy đủ nghĩa vụ tài chính về đất đai, kết<br>quả sẽ là:", "options": {"A": "Giấy chứng nhận quyền sử dụng đất vẫn được cấp, nhưng có ghi chú", "B": "Quy trình cấp giấy chứng nhận quyền sử dụng đất bị dừng lại cho đến khi", "C": "Người nộp hồ sơ được gia hạn thời gian nộp mà không ảnh hưởng đến tiến trình", "D": "Cơ quan đăng ký sẽ tự động tính toán và điều chỉnh nghĩa vụ tài chính"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Một doanh nghiệp bất động sản nộp hồ sơ khai thuế quá thời hạn<br>quy định. Hành vi này có thể dẫn đến:", "options": {"A": "Không bị xử phạt nếu số thuế nộp đúng", "B": "Được miễn phạt nếu lý do khách quan", "C": "Chỉ bị cảnh cáo mà không có hình thức phạt nào khác", "D": "Bị xử phạt hành chính về thuế do vi phạm kê khai và nộp thuế đúng hạn"}, "answer": "", "explanation": ""}, {"level": "1", "content": "Mức thu phí đối với việc công chứng hợp đồng giao dịch bất động<br>sản trị giá từ 100 triệu đến 1 tỷ đồng là bao nhiêu %", "options": {"A": "0,1% giá trị tài sản", "B": "0,5% giá trị tài sản", "C": "1% giá trị tài sản", "D": "0,2% giá trị tài sản"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Trong một giao dịch mua bán nhà giữa anh H và chị L (quan hệ hôn<br>nhân), bên bán có bị tính Thuế thu nhập cá nhân theo mức 2% không", "options": {"A": "Có, vì thuế TNCN áp dụng cho mọi giao dịch chuyển nhượng", "B": "Có, nhưng thuế TNCN được tính theo biểu lũy tiến", "C": "Không, vì giao dịch giữa người có quan hệ hôn nhân được miễn thuế TNCN", "D": "Cả A, B, C đều sai"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Nếu bên mua nhà đất sử dụng số liệu diện tích không chính xác (do<br>nhầm lẫn giữa diện tích xây dựng và diện tích đất) để tính lệ phí trước bạ, kết<br>quả là:", "options": {"A": "Cơ quan thuế sẽ tự động hiệu chỉnh số liệu dựa trên hồ sơ địa chính", "B": "Sai sót này chỉ ảnh hưởng đến hồ sơ giao dịch mà không ảnh hưởng số tiền", "C": "Lệ phí trước bạ được tính chính xác theo quy định", "D": "Số lệ phí trước bạ kê khai sẽ sai lệch, có thể dẫn đến truy thu lệ phí nộp thiếu"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Theo quy định pháp luật, thuế suất Thuế Thu nhập cá nhân<br>(TNCN) đối với thu nhập từ chuyển nhượng bất động sản hiện hành là bao<br>nhiêu?", "options": {"A": "2% trên giá chuyển nhượng", "B": "10% trên thu nhập tính thuế", "C": "Áp dụng biểu thuế lũy tiến từng phần", "D": "5% trên giá trị chuyển nhượng"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Đâu là những loại thuế chính mà các doanh nghiệp kinh doanh bất<br>động sản phải nộp ?", "options": {"A": "Lệ phí Môn bài", "B": "Thuế thu nhập doanh nghiệp", "C": "Thuế Thu nhập cá nhân (TNCN)", "D": "Cả B và C đều đúng"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Lệ phí trước bạ khi mua bán bất động sản được tính dựa trên cơ sở<br>nào?", "options": {"A": "Giá đất theo bảng giá đất của tỉnh, thành phố", "B": "Giá đất được ghi trong Giấy chứng nhận quyền sử dụng đất", "C": "Giá trị tính lệ phí trước bạ theo quy định của pháp luật", "D": "Giá trị hợp đồng mua bán"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Mức phạt tiền chậm nộp thuế được tính như thế nào?", "options": {"A": "0,03% mỗi ngày trên số tiền thuế chậm nộp", "B": "0,05% mỗi ngày trên số tiền thuế chậm nộp", "C": "0,01% mỗi ngày trên số tiền thuế chậm nộp", "D": "0,07% mỗi ngày trên số tiền thuế chậm nộp"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Lệ phí trước bạ có phải là một loại thuế không", "options": {"A": "Không, là một loại phí dịch vụ công", "B": "Có, là một loại thuế trực thu", "C": "Có, là một loại thuế gián thu", "D": "Không, là một loại lệ phí hành chính"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Thu nhập từ chuyển nhượng bất động sản của doanh nghiệp có<br>được bù trừ lỗ từ các hoạt động kinh doanh khác không?", "options": {"A": "Không, phải xác định và kê khai riêng", "B": "Tùy thuộc vào quyết định của cơ quan thuế", "C": "Được bù trừ nếu lỗ từ hoạt động kinh doanh chính", "D": "Có, được bù trừ hoàn toàn"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Thu nhập từ thừa kế/quà tặng bất động sản giữa cha mẹ và con nuôi<br>có được miễn thuế thu nhập cá nhân không?", "options": {"A": "Tùy thuộc vào thời gian sở hữu", "B": "Không", "C": "Tùy thuộc vào giá trị tài sản", "D": "Có"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Thuế suất Thuế GTGT 10% trong kinh doanh bất động sản được<br>tính trên cơ sở nào?", "options": {"A": "Giá trị gia tăng của sản phẩm", "B": "Giá trị đất theo bảng giá đất", "C": "Giá trị hợp đồng chuyển nhượng", "D": "Giá trị đất được trừ"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Cơ quan nào có thẩm quyền ban hành Bảng giá đất để làm căn cứ<br>tính thuế?", "options": {"A": "Ủy ban nhân dân cấp tỉnh", "B": "Quốc hội", "C": "Bộ Nông nghiệp và Môi trường", "D": "Chính phủ"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Hành vi khai sai giá trị chuyển nhượng bất động sản để trốn thuế<br>được coi là vi phạm hành chính hay hình sự?", "options": {"A": "Chỉ là vi phạm dân sự", "B": "Vi phạm hình sự", "C": "Cả hai, tùy mức độ vi phạm", "D": "Cả hai, vừa xử lý hình sự vừa xử phạt hành chính"}, "answer": "C", "explanation": ""}, {"level": "1", "content": "Đối với doanh nghiệp kinh doanh dịch vụ bất động sản (sàn giao<br>dịch), loại thuế chính phải nộp là gì?", "options": {"A": "Thuế Thu nhập doanh nghiệp và Thuế thu nhập cá nhân", "B": "Thuế Giá trị gia tăng và Thuế Môn bài", "C": "Thuế Thu nhập cá nhân và Thuế Môn bài", "D": "Thuế Thu nhập doanh nghiệp và Thuế Giá trị gia tăng"}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Lệ phí công chứng đối với hợp đồng chuyển nhượng bất động sản<br>giữa cha mẹ và con ruột có khác gì so với hợp đồng giữa hai người xa lạ<br>không?", "options": {"A": "Mức lệ phí không có sự khác biệt", "B": "Tùy thuộc vào văn phòng công chứng", "C": "Lệ phí công chứng đối với hợp đồng giữa cha mẹ và con ruột thường thấp hơn", "D": "Lệ phí công chứng đối với hợp đồng giữa cha mẹ và con ruột thường cao hơn"}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Mục đích của việc điều chỉnh giá đất nông nghiệp lên gần bằng giá<br>đất ở trong các khu vực dân cư là gì?", "options": {"A": "Để tăng thu ngân sách", "B": "Để đảm bảo sự công bằng và hợp lý, phù hợp với giá thị trường", "C": "Để giảm gánh nặng cho người dân", "D": "Để khuyến khích chuyển đổi đất nông nghiệp"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Cá nhân nhận thừa kế một bất động sản có giá trị tính thuế là 20 tỷ<br>đồng, phải nộp thuế thu nhập cá nhân bao nhiêu? (Giả sử không có các<br>trường hợp miễn giảm)", "options": {"A": "200 triệu đồng.", "B": "2 tỷ đồng.", "C": "1 tỷ đồng.", "D": "400 triệu đồng"}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Mức lệ phí trước bạ khi mua bán bất động sản do hộ gia đình, cá<br>nhân nộp là 0,5%. Tuy nhiên, trong trường hợp nào thì mức thu này có thể<br>thay đổi?", "options": {"A": "Có thể thay đổi theo quy định của Hội đồng nhân dân cấp tỉnh đối với một số", "B": "Có thể thay đổi nếu giá trị bất động sản lớn.", "C": "Không có trường hợp nào.", "D": "Tùy thuộc vào mục đích sử dụng đất."}, "answer": "A", "explanation": ""}, {"level": "1", "content": "Chi phí nào sau đây được trừ khi tính thu nhập chịu thuế thu nhập<br>doanh nghiệp từ hoạt động chuyển nhượng bất động sản?", "options": {"A": "Chi phí bồi thường, giải phóng mặt bằng.", "B": "Chi phí đầu tư cơ sở hạ tầng.", "C": "Chi phí quảng cáo, tiếp thị.", "D": "Tất cả các chi phí trên nếu có đủ hóa đơn, chứng từ hợp lệ."}, "answer": "D", "explanation": ""}, {"level": "1", "content": "Chi phí bồi thường, giải phóng mặt bằng được tính vào giá vốn khi<br>chuyển nhượng bất động sản có bao gồm cả các khoản chi phí liên quan đến<br>việc hỗ trợ người bị thu hồi đất không?", "options": {"A": "Tùy thuộc vào loại bất động sản.", "B": "Có, nếu có đầy đủ chứng từ hợp lệ.", "C": "Không, các chi phí này là chi phí riêng.", "D": "Chỉ bao gồm chi phí trực tiếp bồi thường đất."}, "answer": "B", "explanation": ""}, {"level": "1", "content": "Mức ph
